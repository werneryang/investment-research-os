[project]
name = "investment-os"
version = "0.1.0"
description = "个人投资研究框架：免费资源接入、版本化数据、公共分析与可复现研究记录"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "xlrd>=2.0.2",
]

[project.scripts]
iros = "investment_os.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
