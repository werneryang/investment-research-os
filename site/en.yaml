- zh: 使用假设参数 (?P<name>\S+) = (?P<v>\S+)
  en: Uses assumed parameter {name} = {v}
- zh: 参数 (?P<name>\S+) = (?P<v>\S+) 超出允许范围 (?P<range>\[[^\]]*\])（(?P<unit>.+)）
  en: Parameter {name} = {v} is outside the allowed range {range} ({unit})
- zh: 输入能力为 (?P<grade>\S+?)：(?P<reasons>.+)
  en: 'Input capability {grade}: {reasons}'
- zh: 情景 (?P<id>[A-Za-z0-9_.]+)：(?P<n>\d+) 周的基准总投入已超过假设上限，标为不自洽，未计入缺口
  en: 'Scenario {id}: in {n} weeks baseline gross inputs already exceed the assumed ceiling; marked inconsistent and not counted as shortfall'
- zh: 情景 (?P<id>[A-Za-z0-9_.]+)
  en: Scenario {id}
- zh: 假设参照期 (?P<a>\S+) 至 (?P<b>\S+) 的利用率不全在用途核验范围内（(?P<state>[^；]+)；未覆盖 (?P<gaps>[^）]+)）；参照只说明允许范围的依据，不进入计算
  en: 'Utilization in the assumption reference period {a} to {b} is not fully within the use-verified range ({state}; not covered: {gaps}); the reference only explains the allowed range and is not used in the calculation'
- zh: 年度对照只有 (?P<n>\d+) 年（价差变化 (?P<m>\d+) 年），Spearman 相关只描述排序关系，不检验显著性
  en: The annual comparison has only {n} years ({m} for spread changes); Spearman correlations describe rank relations only and are not tested for significance
- zh: 未纳入 (?P<name>[^：]+)：(?P<reason>.+)
  en: 'Not included: {name}. {reason}'
