patterns:
- zh: 研究窗口内有 (?P<n>\d+) 个预期观测日未取得（(?P<dates>.*?)）：数据最近一次下载时尚未到保守可用时点（(?P<rule>.+)），不计入覆盖；这不代表已确认尚未发布。结果截至 (?P<last>\S+)
  en: '{n} expected observation date(s) in the study window were not yet retrieved ({dates}): when the data was last downloaded they were not yet past the conservative availability time ({rule}), so they are not counted in coverage; this does not confirm they were unpublished. Results run through {last}'
- zh: 预期观测日历 (?P<cal>\S+) 未在 (?P<spans>.+) 核验，该段的预期日期按规则推定，临时休市或额外发布日可能使日期覆盖略有偏差，无法证明没有缺失
  en: The expected observation calendar {cal} is not verified for {spans}; expected dates there are inferred by rule, so ad-hoc closures or extra release days may skew date coverage slightly, and the absence of gaps cannot be shown
- zh: 研究期间 (?P<start>\S+) 至 (?P<end>\S+) 覆盖不足（(?P<reason>.+)；实际覆盖 (?P<covered>.+)）。只保留首尾有效观测的对比，均值、极值与倒挂天数等期间统计不输出
  en: Coverage of the study period {start} to {end} is insufficient ({reason}; actual coverage {covered}). Only the first and last valid observations are compared; period statistics such as means, extremes and inversion days are not reported
- zh: 研究期间未能证明完整（(?P<reason>.+)）。均值、极值与倒挂天数只基于已观测日期，是已观测样本统计，不能推及整个期间
  en: The study period could not be shown complete ({reason}). Means, extremes and inversion days use observed dates only; they are observed-sample statistics and cannot be extended to the whole period
- zh: 基准日 (?P<date>\S+) 距研究窗口终点 (?P<days>\d+) 天；结果对应该日的收益率
  en: The base date {date} is {days} days before the end of the study window; results reflect yields on that day
- zh: 应已发布 (?P<due>\d+) 个观测日，实际 (?P<have>\d+) 个（(?P<share>[\d.]+%)），低于要求 (?P<req>\d+%)
