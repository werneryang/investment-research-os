  每次取得原样保存原始文件及校验值；标准化版本只追加、不覆盖，记录上游快照与上一版本。: Every fetch keeps the raw file as downloaded, with its hash; standardized versions are append-only, never overwritten, and record the upstream snapshot and previous version.
  缺失显式表达: Missing data stays explicit
  不填零、不沿用前值、不插值；冲突数据隔离；覆盖不足时，依赖它的结论标为不支持。: No zero-filling, no carrying values forward, no interpolation; conflicting data is quarantined; when coverage is insufficient, conclusions that depend on it are marked unsupported.
  期间覆盖对照日历: Period coverage checked against a calendar
  日期覆盖对照经核验的发布日历计算；期间不完整时只保留首尾对比，不输出均值、极值与计数。: Date coverage is measured against a verified release calendar; when a period is incomplete, only the first-to-last comparison is kept, without means, extremes or counts.
  时点资格需要证据: Point-in-time use needs evidence
  只有当前修订的数据，不能凭假定的发布延迟进入过去的时点视图；必须是当时已取得的快照或供应方历史版本。: Data available only in its current revision cannot enter a past point-in-time view on an assumed release lag; it must be a snapshot taken at the time or a supplier vintage.
  失败留痕: Failures leave a trace
  每次取得记录开始与终态；任何阶段失败都保留旧版本与诊断快照；凭证不进入日志。: Every fetch records its start and end state; a failure at any stage keeps the previous version and a diagnostic snapshot; credentials never enter logs.
  固定输入可复现: Reproducible from pinned inputs
