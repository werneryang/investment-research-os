  "CPI 与 10 年期长期利率（已有 FRED 序列，未重复登记）": "CPI and the 10-year long-term rate (already available as FRED series, not registered twice)"
  "周期调整市盈率 CAPE（价格 / 过去 10 年实际盈利平均）与总收益口径的 TR CAPE，1881 年起": "Cyclically adjusted P/E, CAPE (price / average real earnings over the past 10 years), and the total-return TR CAPE, from 1881"
  "按 CPI 换算到最新月份价格水平的实际价格与实际总收益价格指数（股息再投资）": "Real price and real total-return price index (dividends reinvested), converted with CPI to the latest month's price level"
  "按研究需要登记超额 CAPE 收益率等其他列": "Register other columns such as the excess CAPE yield as studies need them"
  "文件内免责声明只说明数据来自公开来源、不保证准确，未见使用或再分发条款；只在本地使用，不进公开存档": "The file's disclaimer only says the data come from public sources and accuracy is not guaranteed; no terms of use or redistribution found; used locally only, not in the public archive"
  "早期数据由 Cowles 等历史资料拼接，不是今天口径的标普 500。耶鲁旧页面已无下载链接，shillerdata.com 是当前入口": "Early data are spliced from historical sources such as Cowles and are not today's S&P 500. The old Yale page no longer links the file; shillerdata.com is the current entry point"
  "标普综合指数价格、股息与盈利 1871-01 起，CAPE 1881-01 起，月度": "S&P Composite price, dividends and earnings from 1871-01, CAPE from 1881-01, monthly"
  "标普综合指数月度价格（当月每日收盘价的平均）": "S&P Composite monthly price (average of daily closes in the month)"
  "标普综合指数的股息与盈利（按指数单位计的过去 12 个月合计，约滞后四个月补上）": "S&P Composite dividends and earnings (trailing 12-month totals per index unit, filled in about four months late)"
  "美国股票市场与 Fama/French 因子的月度收益，以及标普综合指数 1871 年起的价格、股息、盈利与 CAPE 估值": "Monthly returns of the US stock market and Fama/French factors, plus S&P Composite price, dividends, earnings and CAPE valuation from 1871"
  "行业或个股层面的估值（只有标普综合指数整体的 CAPE 与市盈率）": "Valuations of industries or individual stocks (only CAPE and P/E for the S&P Composite as a whole)"
  "观测期间结束后第 180 天结束时（来源时区）": "End of the 180th day after the observation period ends (source time zone)"
  "观测期间结束后第 30 天结束时（来源时区）": "End of the 30th day after the observation period ends (source time zone)"
  "超额 CAPE 收益率与 10 年滚动实际回报": "Excess CAPE yield and rolling 10-year real returns"
  "E2：导入全部申报主体并按 SIC 汇总": "E2: import all filers and aggregate by SIC industry"
  "FSDS 只含报表主体数字，不含封面数据（如流通股数）；Company Facts API 补上封面数据与 FSDS 尚未收录的新申报": "FSDS contains only the primary statements, not cover-page data (such as shares outstanding); the Company Facts API adds cover-page data and new filings not yet in FSDS"
  "XBRL 财报数字 2009 年起；E1 只导入 config/fundamentals.yaml 登记的 15 家公司": "XBRL financial figures from 2009; E1 imports only the 15 companies registered in config/fundamentals.yaml"
  "全部申报主体的财报（E2，含 SIC 行业分类）": "Financial statements for all filers (E2, with SIC industry codes)"
  "季度数据与推算的第四季度（E3）": "Quarterly data and a derived fourth quarter (E3)"
  "无需注册或 key；www.sec.gov 要求 User-Agent 写明联系邮箱（.env 中的 SEC_USER_AGENT，不入库）， data.sec.gov 没有它时也可访问": "No registration or key; www.sec.gov requires a contact email in the User-Agent (SEC_USER_AGENT in .env, not committed), while data.sec.gov also works without it"
  "美国联邦政府发布的申报数据；再分发条款尚未核实，只在本地使用，不进公开存档": "Filing data published by the US federal government; redistribution terms not yet checked, so used locally only, not in the public archive"
  "Financial Statement Data Sets 季度 ZIP（www.sec.gov）与 Company Facts API（data.sec.gov）； 由 iros edgar sync 同步，设计见 docs/edgar-design.md": "Financial Statement Data Sets quarterly ZIPs (www.sec.gov) and the Company Facts API (data.sec.gov); synced by iros edgar sync, design in docs/edgar-design.md"
  "SEC 公平访问规则：每秒不超过 10 次请求；本项目串行请求，间隔不少于 0.2 秒": "SEC fair-access rule: at most 10 requests per second; this project sends requests one at a time, at least 0.2 seconds apart"
  "每份申报有编号与 EDGAR 接受时间，可作为供应方历史版本；修正申报（/A）形成新版本。FSDS 季度文件 偶有整体重新处理（2024-12-27），所以仍保存原始文件": "Each filing has an accession number and EDGAR acceptance time, usable as supplier vintages; amendments (/A) form new versions. FSDS quarterly files are occasionally reprocessed wholesale (2024-12-27), so raw files are still kept"
  "每月 HEAD 检查 FSDS 文件的大小与修改时间，只下载变化的季度；指标别名表随核验补充； HEAD 发现不了大小与日期都不变的替换，偶尔用 --refresh 全面复核": "Monthly HEAD checks of FSDS file size and modification time, downloading only changed quarters; the metric alias table grows with verification; HEAD cannot detect a replacement with the same size and date, so --refresh is used occasionally for a full recheck"
  "15 家验证公司 2009 年起的 8 个年度核心指标（营收、净利润、每股收益、现金流、资本开支、资产、权益、股数），带申报版本与时点视图": "8 annual core metrics from 2009 for 15 validation companies (revenue, net income, EPS, cash flow, capex, assets, equity, shares), with filing versions and a point-in-time view"
  "EDGAR 接受时间次日 0 点（美东）": "Midnight (US Eastern) after EDGAR acceptance"
  "SEC Company Facts：同一批公司的财报事实，补上封面数据与 FSDS 尚未收录的新申报": "SEC Company Facts: the same companies' facts, adding cover-page data and filings not yet in FSDS"
  "SEC 财报数据集（FSDS）：登记公司 2009 年起的申报与合并口径财报事实": "SEC Financial Statement Data Sets (FSDS): filings and consolidated facts of the registered companies from 2009"
  "全部上市公司的财报与行业汇总（E2 尚未开始）": "Financial statements of all listed companies and industry aggregates (E2 not started)"
  "季度数据（E3 尚未开始）": "Quarterly data (E3 not started)"
  "申报日期次日 0 点（美东）": "Midnight (US Eastern) after the filing date"
  "部分公司的个别指标（如银行的资本开支），见 EDGAR 设计说明的缺口列表": "Some metrics for some companies (such as a bank's capex); see the gap list in the EDGAR design notes"
  "中国 A 股（交易所与社区工具尚未接入）": "China A-shares (exchanges and community tools not yet connected)"
  "人民币兑美元汇率（每美元的人民币数）": "Renminbi per US dollar"
  "以当地货币计的回报（French 国际因子只有美元计价）": "Returns in local currency (French international factors are in USD only)"
  "北美股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "North America stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "发达、欧洲、日本、亚太、北美与新兴市场的股票因子月度收益（美元计价，1990 年起），以及主要汇率与美元广义指数": "Monthly stock factor returns for developed, European, Japanese, Asia-Pacific, North American and emerging markets (in USD, from 1990), plus major exchange rates and the broad dollar index"
  "发达市场股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "Developed-market stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "各国国债与宏观数据（世界银行、IMF、BIS、OECD 尚未接入）": "Government bonds and macro data by country (World Bank, IMF, BIS and OECD not yet connected)"
  "国际动量因子与按规模、价值分组的国际组合": "International momentum factors and international portfolios sorted by size and value"
  "新兴市场股票因子月度收益（美元）：市场超额收益、规模、价值、盈利、投资与无风险利率": "Emerging-market stock factor monthly returns (USD): market excess return, size, value, profitability, investment and the risk-free rate"
  "日元兑美元汇率（每美元的日元数）": "Japanese yen per US dollar"
  "日本以外的亚太股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "Asia-Pacific ex-Japan stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "日本股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "Japan stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "欧洲股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "Europe stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "美元兑欧元汇率（每欧元的美元数，中午纽约买入价）": "US dollars per euro (noon buying rate in New York)"
  "美元兑英镑汇率（每英镑的美元数）": "US dollars per British pound"
  "美元名义广义指数（相对主要贸易伙伴货币，2006-01 = 100）": "Nominal broad US dollar index (against major trading partners' currencies, January 2006 = 100)"
  "美国以外的发达市场股票因子月度收益（美元）：市场超额收益、规模、价值与无风险利率": "Developed ex-US stock factor monthly returns (USD): market excess return, size, value and the risk-free rate"
  "美国股票因子 1926-07 起（五因子 1963-07 起，CRSP）；国际因子 1990-07 起（新兴市场 1989-07 起，Bloomberg，美元计价）；月度，另有日度、周度与年度文件": "US equity factors from 1926-07 (five factors from 1963-07, CRSP); international factors from 1990-07 (emerging markets from 1989-07, Bloomberg, in USD); monthly, with daily, weekly and annual files also available"
  "观测期间结束后第 10 天结束时（来源时区）": "End of the 10th day after the observation period ends (source time zone)"
  "10 年期与 2 年期的变化各有多少来自实际利率、通胀补偿、已实施的政策利率与对未来政策路径的定价": "How much of the 10-year and 2-year changes came from real rates, inflation compensation, the policy rate already set, and pricing of the future policy path"
  "会计恒等式分解，不是因果推断": "Accounting-identity decomposition, not causal inference"
  "会计恒等式分解：Δ10Y = Δ实际收益率 + Δ盈亏平衡通胀；Δ2Y = Δ联邦基金有效利率 + Δ(2Y − 联邦基金利率)；斜率变化由以上四项组成。只用所有输入都有观测值的共同日期，不插值、不前值填充；不估计参数，不作因果推断。": "Accounting-identity decomposition: Δ10Y = Δreal yield + Δbreakeven inflation; Δ2Y = Δeffective fed funds rate + Δ(2Y − fed funds); the slope change is made of these four parts. Only dates on which every input has an observation are used, with no interpolation or carry-forward; no parameters are estimated and no causal inference is made."
  "使用最新修订数据；CPI 与美联储总资产只作背景，不参与分解": "Uses the latest revision; CPI and Fed total assets are background only and not part of the decomposition"
  "分解案例": "Decomposition case"
  "分解研究": "Decomposition study"
  "名义票面收益率曲线的水平、斜率、曲率与倒挂，以及变化在实际利率、通胀补偿与政策利率之间的会计分解": "Level, slope, curvature and inversion of the nominal par yield curve, plus an accounting decomposition of its changes into real rates, inflation compensation and the policy rate"
  "曲线变化的因果原因（会计分解只拆出实际利率、通胀补偿与政策利率各自的变化，不能区分期限溢价与政策预期）": "The causal reasons for curve moves (the accounting decomposition only separates real rates, inflation compensation and the policy rate, and cannot tell term premium from policy expectations)"
  "期间内 10 年期与 2 年期国债收益率及其利差的变化，各有多少来自实际利率、通胀补偿、已实施的政策利率与市场对未来政策路径的定价？": "Over the period, how much of the changes in the 10-year and 2-year Treasury yields and their spread came from real rates, inflation compensation, the policy rate already set, and the market's pricing of the future policy path?"
  "盈亏平衡通胀含通胀风险溢价与流动性溢价，不等于通胀预期；2Y 与联邦基金利率之差不能拆分为政策预期与期限溢价": "Breakeven inflation includes inflation-risk and liquidity premia and is not expected inflation; the 2Y-minus-fed-funds spread cannot be split into policy expectations and term premium"
  "美国国债曲线变化的分解（2024 年）": "Decomposition of US Treasury curve changes (2024)"
  "美国国债曲线变化的分解（近一年）": "Decomposition of US Treasury curve changes (last 12 months)"
  "基线运行 ust_curve_attribution_2024-20261025T230032Z-b01fed8d（2024-01-02 至 2024-12-31）与 ust_curve_attribution_last_year-20261025T230034Z-d50f7afa（2025-10-27 至 2026-10-22），代码 24f0471，dirty=false，iros verify 以固定输入重算结果校验值一致；两项研究的长端恒等式核对通过（250、248 个共同日期，最大残差 0 bp），Treasury 10Y 与 DGS10 同源一致。原始快照独立解析抽查 24 个点全部一致。恒等式 DGS10 = DFII10 + T10YIE 在 2003-01-02 至 2026-10-22 的全部 5956 个共同日期成立（最大残差 0 bp），覆盖研究窗口之间的 2025 年 1–10 月。2026-10-25 经用户确认登记。": "Baseline runs ust_curve_attribution_2024-20261025T230032Z-b01fed8d (2024-01-02 to 2024-12-31) and ust_curve_attribution_last_year-20261025T230034Z-d50f7afa (2025-10-27 to 2026-10-22), code 24f0471, dirty=false; iros verify recomputed matching result hashes from pinned inputs. Both studies passed the long-end identity check (250 and 248 common dates, max residual 0 bp), and Treasury 10Y agreed with DGS10 (same source). An independent raw-snapshot spot check matched all 24 points. The identity DGS10 = DFII10 + T10YIE holds on all 5,956 common dates from 2003-01-02 to 2026-10-22 (max residual 0 bp), covering January–October 2025 between the study windows. Registered on 2026-10-25 after user confirmation."
  "基线运行 ust_curve_attribution_2024-20261025T230032Z-b01fed8d（2024-01-02 至 2024-12-31）与 ust_curve_attribution_last_year-20261025T230034Z-d50f7afa（2025-10-27 至 2026-10-22），代码 24f0471，dirty=false，iros verify 以固定输入重算结果校验值一致；两项研究的长端恒等式核对通过（250、248 个共同日期，最大残差 0 bp），Treasury 10Y 与 DGS10 同源一致。原始快照独立解析抽查 24 个点全部一致。2024-01-01 至 2026-10-22 之间 10bp 以上的变动共 7 次，全部在 FOMC 会议次日（会议日期按美联储官网日程核对）：2024-09-19 −50、2024-11-08 −25、2024-12-19 −25、2025-09-18 −25、2025-10-30 −25、2025-12-11 −25、2026-09-17 +25；此外没有 3bp 以上的变动。2026-10-25 经用户确认登记。": "Baseline runs ust_curve_attribution_2024-20261025T230032Z-b01fed8d (2024-01-02 to 2024-12-31) and ust_curve_attribution_last_year-20261025T230034Z-d50f7afa (2025-10-27 to 2026-10-22), code 24f0471, dirty=false; iros verify recomputed matching result hashes from pinned inputs. Both studies passed the long-end identity check (250 and 248 common dates, max residual 0 bp), and Treasury 10Y agreed with DGS10 (same source). An independent raw-snapshot spot check matched all 24 points. Between 2024-01-01 and 2026-10-22 there were 7 moves of 10 bp or more, all on the day after an FOMC meeting (meeting dates checked against the Fed's calendar): 2024-09-19 −50, 2024-11-08 −25, 2024-12-19 −25, 2025-09-18 −25, 2025-10-30 −25, 2025-12-11 −25, 2026-09-17 +25; there were no other moves of 3 bp or more. Registered on 2026-10-25 after user confirmation."
  "10 年期 TIPS 实际收益率的期间描述与会计分解（如国债曲线变化的分解），使用最新修订数据；观测日期 2024-01-01 至 2026-10-22。 不包括时点研究（当时公布的值）、预测与交易回测；核验范围之外的日期须先补充核验。": "Period description and accounting decomposition of the 10-year TIPS real yield (such as the Treasury curve decomposition), on the latest revision; observation dates 2024-01-01 to 2026-10-22. Excludes point-in-time studies (values as published then), forecasts and trading backtests; dates outside the verified range need further verification first."
  "10 年期盈亏平衡通胀率的期间描述与会计分解（如国债曲线变化的分解），使用最新修订数据；观测日期 2024-01-01 至 2026-10-22。 不包括时点研究（当时公布的值）、预测与交易回测；核验范围之外的日期须先补充核验。": "Period description and accounting decomposition of the 10-year breakeven inflation rate (such as the Treasury curve decomposition), on the latest revision; observation dates 2024-01-01 to 2026-10-22. Excludes point-in-time studies (values as published then), forecasts and trading backtests; dates outside the verified range need further verification first."
  "联邦基金有效利率的期间描述与会计分解（如国债曲线变化的分解），使用最新修订数据；观测日期 2024-01-01 至 2026-10-22。 不包括时点研究（当时公布的值）、预测与交易回测；核验范围之外的日期须先补充核验。": "Period description and accounting decomposition of the effective federal funds rate (such as the Treasury curve decomposition), on the latest revision; observation dates 2024-01-01 to 2026-10-22. Excludes point-in-time studies (values as published then), forecasts and trading backtests; dates outside the verified range need further verification first."
  "1928 年以来，美国股票、小盘股、长期国债、公司债、国库券、房地产与黄金的回报与风险各是多少？扣除通胀后呢？资产之间的相关性在不同年代是否稳定？": "Since 1928, what have been the returns and risks of US stocks, small caps, long-term Treasuries, corporate bonds, T-bills, real estate and gold? What about after inflation? Have the correlations between assets been stable across eras?"
  "最近 25 个完整年度，美国主要资产的回报、风险与相关性如何？与 1928 年以来的长期情况有何不同？": "Over the last 25 complete years, what have been the returns, risks and correlations of the main US assets, and how do they differ from the long run since 1928?"
  "只描述美国历史；美国是事后表现最好的市场之一，存在幸存者偏差，不代表其他市场或未来": "US history only; the US is one of the best-performing markets in hindsight, so there is survivorship bias, and this does not represent other markets or the future"
  "债券回报由收益率推算，不是指数实际持有回报；房地产为房价变化，不含租金；黄金在 1971 年以前价格基本固定；国库券回报为年内平均利率": "Bond returns are derived from yields, not actual index holding returns; real estate is house-price change without rent; gold prices were essentially fixed before 1971; T-bill returns are the average rate over the year"
  "不含交易成本、税负与管理费；年度数据低估年内回撤": "Excludes trading costs, taxes and management fees; annual data understate intra-year drawdowns"
  "实际回报从 1948 年起（CPI 12 月对 12 月）；相关系数只描述线性同向程度，样本只有几十个年度观测": "Real returns start in 1948 (December-to-December CPI); correlations only describe linear co-movement, with only a few dozen annual observations"
  "历史统计不是预测，也不是配置建议": "Historical statistics are not a forecast or allocation advice"
  "年度回报的算术平均、几何平均（期末财富的年化）、波动率（标准差）、最差年份、亏损年数与最大回撤；实际回报 = (1 + 名义) / (1 + 当年 CPI 通胀) − 1；股票风险溢价为几何平均之差；相关系数按全期与事先固定的时期计算。只用所有资产都有值的完整年度；只描述历史，不估计模型。": "Arithmetic mean, geometric mean (annualized end wealth), volatility (standard deviation), worst year, number of losing years and maximum drawdown of annual returns; real return = (1 + nominal) / (1 + that year's CPI inflation) − 1; the equity risk premium is the difference of geometric means; correlations are computed for the full period and for periods fixed in advance. Only complete years in which every asset has a value are used; this describes history only and estimates no model."
  "美国主要资产的长期回报与风险（1928 年起）": "Long-run returns and risk of major US assets (since 1928)"
  "美国主要资产的回报与风险（最近 25 年）": "Returns and risk of major US assets (last 25 years)"
  "长期统计": "Long-run statistics"
