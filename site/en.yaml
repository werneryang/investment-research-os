  核验下载格式、方法与更新频率: Verify the download format, methods and update frequency
  核验下载格式与历史估计的保留方式: Verify the download format and how historical estimates are kept
  核验下载格式与调查方法说明: Verify the download format and survey method notes
  核验披露与行情资料的入口和访问规则: Verify the entry points and access rules for disclosures and market data
  核验数据入口与口径说明: Verify the data entry points and definition notes
  核验数据入口与接口说明: Verify the data entry points and interface documentation
  核验项目说明，确认各接口的上游来源: Verify the project documentation and confirm each interface's upstream source
  模型估计，不是观测值；不能与其他期限溢价模型无条件替代: A model estimate, not an observation; not interchangeable with other term premium models
  模型估计，不是观测值；历史估计是否完整保留待核验: A model estimate, not an observation; whether historical estimates are fully kept is still to be verified
