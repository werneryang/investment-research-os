  价格、裂解价差、炼厂或公司利润: Prices, crack spreads, refinery or company profits
  单个炼厂、地区（PADD）或公司: Individual refineries, regions (PADD) or companies
  需求预测；增幅 g 是外生情景定义: Demand forecasts; the increase g is an exogenous scenario definition
  周度炼厂利用率与声明裂解价差的历史关系（水平相关与年度汇总）: The historical relation between weekly refinery utilization and the declared crack spread (level correlation and annual summaries)
  选定炼油公司日历年股东总收益相对标普 500 的表现，与年均价差、利用率的描述性对照: Calendar-year shareholder return of selected refiners relative to the S&P 500, compared descriptively with the annual mean crack spread and utilization
  炼厂或公司的实际炼油毛利（价差是指标定义）: Actual refining margins of refineries or companies (the spread is an indicator definition)
  业绩图未以文字列出数值的公司: Companies whose performance graph does not list values as text
  股价预测、交易信号或因果关系: Share-price forecasts, trading signals or causal relations
  一体化石油公司（上游、化工、零售另有影响）: Integrated oil companies (upstream, chemicals and retail also matter)
  ? 逐周核对 EIA 周度总投入、可运行产能与官方利用率；按公布精度的舍入区间复算利用率；缺失周不插值、不混用四周平均。情景中 D = (1 + g) × G、Q_cap = kappa × K，经固定系数约束引擎计算可处理量与缺口；g 为外生情景定义，kappa 为允许假设清单内的参数。
  : Weekly check of EIA gross inputs, operable capacity and official utilization; utilization recomputed with rounding intervals at the published precision; missing weeks are not interpolated and four-week averages are not mixed in. In scenarios D = (1 + g) × G and Q_cap = kappa × K; a fixed-coefficient constraint engine computes output and shortfall; g is an exogenous scenario definition and kappa a parameter from the allowed-assumption list.
  逐周核对 EIA 周度总投入、可运行产能与官方利用率；按公布精度的舍入区间复算利用率；缺失周不插值、不混用四周平均。: Weekly check of EIA gross inputs, operable capacity and official utilization; utilization recomputed with rounding intervals at the published precision; missing weeks are not interpolated and four-week averages are not mixed in.
  ? 逐周计算 3-2-1 裂解价差 = (2 × 42 × 汽油 + 1 × 42 × 柴油 − 3 × 原油) ÷ 3（美元/桶），缺任一成分的周不计算；利用率与价差取同周水平相关与逐年汇总。公司日历年总收益由 10-K 业绩图累计总收益指数相邻年末之比换算，重叠申报与跨公司的标普 500 按舍入区间核对；超额收益 = 公司 − 标普 500。
  : Weekly 3-2-1 crack spread = (2 × 42 × gasoline + 1 × 42 × diesel − 3 × crude) ÷ 3 (USD per barrel); weeks missing any component are not computed; utilization and the spread are compared by same-week level correlation and annual summaries. Calendar-year company total return is the ratio of consecutive year-end values of the 10-K performance-graph cumulative total return index; overlapping filings and the S&P 500 across companies are checked with rounding intervals; excess return = company − S&P 500.
  只计算处理量的机械关系；不含产品收率、进口、库存、物流与价格，不是汽油需求预测、燃料短缺或炼厂利润结论: Only the mechanical throughput relation is computed; no product yields, imports, inventories, logistics or prices; not a gasoline-demand forecast, fuel-shortage or refinery-profit conclusion
  增幅 g 与上限比例 kappa 都是假设，不代表概率；缺口是情景下的计算结果，不是历史真实短缺: Both the increase g and the ceiling ratio kappa are assumptions, not probabilities; shortfalls are scenario calculations, not historical shortages
  美国全国合计，不区分地区（PADD）、炼厂或公司；周度数据为估计值，只使用当前修订版本: U.S. national totals, not by region (PADD), refinery or company; weekly data are estimates and only the current revision is used
  美国全国合计，不区分地区（PADD）、炼厂或公司: U.S. national totals, not by region (PADD), refinery or company
  总投入（Gross Inputs）包含原油以外的投入，不等于原油加工量: Gross inputs include inputs other than crude oil and are not crude runs
  裂解价差是声明的指标定义，不是炼厂实际毛利；不含 RIN 合规成本、运输、产品结构与原油价差: The crack spread is a declared indicator, not an actual refining margin; it excludes RIN compliance costs, transport, product slate and crude differentials
  现货价为 EIA 对日度收盘价的周均值，日度价格来自 Refinitiv（LSEG）；只使用当前修订版本: Spot prices are EIA's weekly averages of daily closing prices; the daily prices come from Refinitiv (LSEG); only the current revision is used
  利用率是美国全国周度估计，不区分地区（PADD）或炼厂，也不等于样本公司的利用率: Utilization is a U.S. national weekly estimate, not by region (PADD) or refinery, and is not the sample companies' utilization
  公司只有 Valero 与 PBF 两家独立炼油公司；Valero 另有乙醇与可再生柴油业务，PBF 有物流业务，总收益不只反映炼油: Only two independent refiners, Valero and PBF; Valero also has ethanol and renewable diesel businesses and PBF has logistics, so total return does not reflect refining alone
  业绩图数值为公司在 10-K 中披露的累计总收益（含股息再投资），未与独立价格来源核对: Performance-graph values are the cumulative total returns the companies disclose in their 10-Ks (dividends reinvested); not checked against an independent price source
  Exxon Mobil 等一体化石油公司: Exxon Mobil and other integrated oil companies
  Exxon 的 10-K 没有业绩图；一体化公司还受上游、化工与零售影响，需分部数据另行对照: Exxon's 10-K has no performance graph; integrated companies are also driven by upstream, chemicals and retail, and need segment data for a separate comparison
  10-K 业绩图只有图片，没有以文字列出的数值表，不能逐值核对；本项目也没有已核验的个股总收益来源: The 10-K performance graph is an image only, with no value table in text, so values cannot be checked one by one; the project also has no verified source of individual-stock total returns
  基准情景（g = 0）下每周可处理量等于实际总投入: In the baseline scenario (g = 0), each week's output equals actual gross inputs
  美国 12 与 49 行业的收益风险、因子暴露，经济、历史公司财报、估值和指引专题，以及炼油产业链的处理量、裂解价差与公司总收益: Return, risk and factor exposures of 12 and 49 U.S. industries; economy, historical filings, valuation and guidance dossiers; and refining throughput, crack spreads and company total returns
  美国炼厂利用率与裂解价差的历史关系，以及独立炼油公司总收益与二者的描述性对照: The historical relation between U.S. refinery utilization and crack spreads, and a descriptive comparison of independent refiners' total returns with both
  ? 以 2025 年周度数据为基准的处理能力机械情景（D = (1 + g) × G，Q_cap = kappa × K）；只确认基准输入可用于该情景，不验证 g 或 kappa 的取值，也不代表情景结果有预测能力；参照期 2015–2024 的利用率分布只作假设参照，不在本核验范围内。观测日期 2025-01-01 至 2025-12-31。
  : Mechanical throughput scenarios on the 2025 weekly baseline (D = (1 + g) × G, Q_cap = kappa × K); confirms only that the baseline inputs can be used for the scenarios, does not validate the values of g or kappa, and does not imply predictive power; the 2015–2024 utilization distribution is only an assumption reference and is outside this verification. Observation dates 2025-01-01 to 2025-12-31.
  美国全国周度总投入、可运行产能与利用率的齐全性、利用率复算与描述统计；使用当前修订数据；观测日期 2025-01-01 至 2025-12-31。不包括时点研究、预测、地区（PADD）、炼厂或公司层面的研究；核验范围之外的日期须先补充核验。: Completeness, utilization recomputation and descriptive statistics of U.S. national weekly gross inputs, operable capacity and utilization; current revised data; observation dates 2025-01-01 to 2025-12-31. Excludes point-in-time studies, forecasts, and regional (PADD), refinery or company research; dates outside the verified range need further verification first.
  ? 全国周度利用率与墨西哥湾沿岸 3-2-1 裂解价差的水平相关、日历年汇总及与公司年度总收益的描述性对照（炼油投资对照）；使用当前修订数据；观测日期 2016-01-01 至 2025-12-31。不包括地区（PADD）、炼厂或公司层面的利用率、时点研究或预测。
  : Level correlation and calendar-year summaries of national weekly utilization and the Gulf Coast 3-2-1 crack spread, and descriptive comparison with company annual total returns (refining investment comparison); current revised data; observation dates 2016-01-01 to 2025-12-31. Excludes regional (PADD), refinery or company utilization, point-in-time studies and forecasts.
