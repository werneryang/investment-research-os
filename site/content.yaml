# 项目网站的说明性内容（建设进度、模块地图、可靠性机制）。
# 研究结果、数据与核验状态不写在这里，由 `iros site` 从运行记录与登记中生成。

title: Investment Research OS
tagline: 基于公开免费数据、可追溯、可复现的市场研究

# 首页研究的显示顺序：第一项为研究焦点（日常查看的滚动研究），其余列在「全部研究」
study_order: [ust_curve_last_year, ust_par_bond_rate_risk, ust_curve_2024]

studies:
  ust_curve_last_year: {label: 滚动研究}
  ust_par_bond_rate_risk: {label: 情景研究}
  ust_curve_2024: {label: 历史案例}

# 研究能力地图的领域。数据、分析与验证状态由登记和运行记录自动得出；
# 只有 planned: true 的领域在这里人工维护，并写明还缺什么（needs）。
domains:
  - id: us_treasury_curve
    name: 美国国债收益率曲线
    summary: 名义票面收益率曲线的水平、斜率、曲率与倒挂
    datasets: [ust_par_yield_curve, fred_dgs10]
    studies: [ust_curve_last_year, ust_curve_2024]
    can_answer:
      - 指定期间内各期限收益率、利差与曲率如何变化
      - 期间内倒挂持续了多少天、何时由倒挂转为正斜率
    cannot_answer:
      - 持有国债或债券基金的回报（票面收益率不是持有期回报）
      - 曲线变化的原因（需要解释性研究与宏观数据）
      - 未来曲线走势（需要预测模型与样本外验证）
  - id: us_inflation_macro
    name: 美国通胀与宏观
    summary: CPI 等宏观序列；时点研究需要 ALFRED 历史版本
    datasets: [fred_cpiaucsl, alfred_cpiaucsl]
    studies: []
    can_answer: []
    cannot_answer:
      - 当时可获知的通胀数据（ALFRED 尚未用真实 key 接入）
  - id: rates_duration_risk
    name: 国债久期与利率风险
    summary: 假设平价债券的久期、凸性、DV01 与收益率冲击情景
    datasets: [ust_par_yield_curve]
    studies: [ust_par_bond_rate_risk]
    can_answer:
      - 以最近票面收益率构造的假设平价债券，收益率平移若干 bp 时价格变化多少
      - 久期、久期 + 凸性近似相对完整重新定价的误差有多大、随期限如何变化
    cannot_answer:
      - 某只真实国债或债券基金（如 TLT）的风险与回报（需要真实现金流、价格或总收益数据）
      - 非平移的曲线形变（需要零息曲线与关键利率久期）
      - 冲击发生的概率或未来利率走势（需要预测模型与样本外验证）
  - id: equity_risk
    name: 股票市场风险
    planned: true
    needs: 需要指数总收益与估值数据源，以及公司行动与成分变化的处理
  - id: credit_premium
    name: 信用风险溢价
    planned: true
    needs: 需要免费、可核验的信用利差或公司债指数来源
  - id: vol_premium
    name: 波动率风险溢价
    planned: true
    needs: 需要隐含波动率与已实现波动率数据；完整历史期权链目前列为能力缺口
  - id: global_assets
    name: 全球资产比较
    planned: true
    needs: 需要多市场数据、交易日历与汇率换算（架构 §4、§7.1）
  - id: portfolio
    name: 组合与情景研究
    planned: true
    needs: 依赖上游资产收益与风险数据；只做模拟组合，不需要真实账户

phases:
  - id: P0
    name: 总体架构
    status: done
    summary: 目标、范围、模块契约、资源地图与可靠性规则（架构 V0.3）
  - id: P1
    name: 公共契约与资源核验
    status: partial
    summary: 首个案例所需的来源登记、时间与质量契约、成果与运行规范已实现；其他市场与对象待扩展
  - id: P2
    name: 小规模贯通验证
    status: done
    summary: 美国国债收益率曲线案例：取得 → 快照 → 标准化 → 分析 → 报告 → 复现，含异常反例测试
  - id: P3
    name: 研究模块渐进扩展
    status: partial
    summary: >-
      已有两个研究领域：美国国债收益率曲线（描述性研究）与国债久期和利率风险（假设平价债券情景）；
      研究页按分支注册展示组件。解释、预测与组合研究，以及宏观、行业、证券分支尚未开始
  - id: P4
    name: 高级研究或可选应用
    status: planned
    summary: 复杂预测、策略模拟、新市场或个人账户等应用，按需启用

modules:
  - id: Q
    name: 研究定义
    code: registry.py · config/studies
    role: 问题、范围、方法与用途
  - id: D
    name: 资源接入
    code: connectors/
    role: Treasury、FRED、ALFRED、人工导入
  - id: S
    name: 数据与版本
    code: data/
    role: 原始快照、标准化版本、时间契约、时点视图
  - id: A
    name: 公共分析
    code: analytics/
    role: 利率曲线、收益、风险
  - id: M
    name: 研究分支
    code: research/
    role: 描述、解释、预测、模拟成果
  - id: O
    name: 成果与档案
    code: reporting/ · runs.py
    role: 报告、图表、运行清单
  - id: V
    name: 质量与验证
    code: quality/ · validation/
    role: 缺失与隔离、交叉核验、快照抽查、复现

guarantees:
  - title: 来源可追溯
    detail: 每次取得原样保存原始文件及校验值；标准化版本只追加、不覆盖，记录上游快照与上一版本。
  - title: 缺失显式表达
    detail: 不填零、不沿用前值、不插值；冲突数据隔离；覆盖不足时，依赖它的结论标为不支持。
  - title: 期间覆盖对照日历
    detail: 日期覆盖对照经核验的发布日历计算；期间不完整时只保留首尾对比，不输出均值、极值与计数。
  - title: 时点资格需要证据
    detail: 只有当前修订的数据，不能凭假定的发布延迟进入过去的时点视图；必须是当时已取得的快照或供应方历史版本。
  - title: 失败留痕
    detail: 每次取得记录开始与终态；任何阶段失败都保留旧版本与诊断快照；凭证不进入日志。
  - title: 固定输入可复现
    detail: 运行清单固定研究定义、数据版本、输入角色与代码内容校验值；verify 重算并比较结果校验值。
