# 项目网站的说明性内容（建设进度、模块地图、可靠性机制）。
# 研究结果、数据与核验状态不写在这里，由 `iros site` 从运行记录与登记中生成。

title: Investment Research OS
tagline: 基于公开免费数据、可追溯、可复现的市场研究

# 研究的显示顺序：首页目录中同一方向内按此排列，未列出的按 id 排在后面
study_order: [us_industry_dossier, us_industry_12, us_industry_49, ust_curve_last_year, ust_curve_attribution_last_year, us_asset_history_last_25y, ust_par_bond_rate_risk,
              ust_curve_2024, ust_curve_attribution_2024, us_asset_history, us_refining_investment_2016_2025, us_refining_utilization_2025,
              us_refining_throughput_scenarios_2025]

# 首页「研究焦点」：显式选择，与目录顺序分开；最多 4 项，检查失败的研究不显示
featured: [us_industry_dossier, ust_curve_last_year, us_asset_history_last_25y, company_sample]

# 研究集合：同一主方向下的一组同类研究在首页收成一个入口，由 lead 代表；成员仍各有研究页
collections:
  company_filings:
    name: 公司年度财报
    lead: company_sample
    members: [company_apple, company_microsoft, company_nvidia, company_amazon, company_alphabet, company_tesla, company_jpmorgan,
              company_berkshire, company_exxon, company_johnson-johnson, company_procter-gamble, company_coca-cola, company_walmart,
              company_costco, company_nike]

# label：首页条目的类型标签；primary_direction（可选）：研究属于多个方向时，首页列出完整条目的方向，
# 默认是框架顺序中第一个列出该研究的方向
studies:
  us_industry_dossier: {label: 四层行业专题}
  us_industry_12: {label: 12 行业总览}
  us_industry_49: {label: 49 行业细分}
  ust_curve_last_year: {label: 滚动研究}
  ust_par_bond_rate_risk: {label: 情景研究}
  ust_curve_2024: {label: 历史案例}
  ust_curve_attribution_last_year: {label: 分解研究}
  ust_curve_attribution_2024: {label: 分解案例}
  us_asset_history: {label: 长期统计}
  us_asset_history_last_25y: {label: 滚动统计}
  us_refining_investment_2016_2025: {label: 炼油投资对照}
  us_refining_utilization_2025: {label: 炼油统计}
  us_refining_throughput_scenarios_2025: {label: 炼油情景}

# 研究框架（docs/research-map.md）：研究分支为主轴（架构 §4），分支下是研究方向。
# 方向的数据、分析与验证状态由登记和运行记录自动得出，分支状态取其方向中最好的一项；
# 只有 planned: true 的方向在这里人工维护，并写明还缺什么（needs）。
# risk 是风险来源标签（架构 §4）：equity rates credit inflation fx commodity liquidity instrument。
# 成果类型读研究定义的 result_type，不在这里重复。
branches:
  - id: macro_policy
    name: 宏观与政策
    question: 增长、通胀、信用、流动性和政策如何变化？
    directions:
      - id: us_inflation_macro
        name: 通胀
        summary: CPI、盈亏平衡通胀率与 TIPS 实际收益率；时点研究需要 ALFRED 历史版本
        risk: [inflation]
        datasets: [fred_cpiaucsl, fred_t10yie, fred_dfii10, alfred_cpiaucsl]
        studies: []
        can_answer: []
        cannot_answer:
          - 盈亏平衡通胀率与 TIPS 收益率当时公布的数值（只有当前修订版本；CPI 的历史版本已由 ALFRED 接入）
          - 市场的通胀预期本身（盈亏平衡通胀率含通胀风险溢价与流动性溢价）
      - id: policy_liquidity
        name: 政策利率与流动性
        summary: 联邦基金有效利率、SOFR、3 个月国库券利率与美联储资产负债表规模
        risk: [rates, liquidity]
        datasets: [fred_dff, fred_sofr, fred_dtb3, fred_walcl]
        studies: []
        can_answer: []
        cannot_answer:
          - 市场对未来政策利率的预期（需要期货或调查数据）
      - id: growth_labor
        name: 增长与就业
        summary: 名义 GDP、失业率与非农就业人数：当前修订版本，以及 ALFRED 的全部历史版本（当时公布的数值）
        datasets: [fred_gdp, fred_unrate, fred_payems, alfred_gdp, alfred_unrate, alfred_payems]
        studies: []
        can_answer: []
        cannot_answer:
          - 实际 GDP 与产出缺口（只接入了名义 GDP）
          - 增长预期（SPF、GDPNow 等调查与模型估计尚未接入，须与观测值分开登记）

  - id: markets_assets
    name: 市场与大类资产
    question: 不同资产的收益、估值和风险如何比较？
    directions:
      - id: us_treasury_curve
        name: 美国国债期限结构
        summary: 名义票面收益率曲线的水平、斜率、曲率与倒挂，以及变化在实际利率、通胀补偿与政策利率之间的会计分解
        risk: [rates]
        datasets: [ust_par_yield_curve, fred_dgs10, fred_dfii10, fred_t10yie, fred_dff]
        studies: [ust_curve_last_year, ust_curve_2024, ust_curve_attribution_last_year, ust_curve_attribution_2024]
        can_answer:
          - 指定期间内各期限收益率、利差与曲率如何变化
          - 期间内倒挂持续了多少天、何时由倒挂转为正斜率
          - 10 年期与 2 年期的变化各有多少来自实际利率、通胀补偿、已实施的政策利率与对未来政策路径的定价
        cannot_answer:
          - 持有国债或债券基金的回报（票面收益率不是持有期回报）
          - 曲线变化的因果原因（会计分解只拆出实际利率、通胀补偿与政策利率各自的变化，不能区分期限溢价与政策预期）
          - 未来曲线走势（需要预测模型与样本外验证）
      - id: rates_duration_risk
        name: 债券利率敏感性
        summary: 假设平价债券的久期、凸性、DV01 与收益率冲击情景
        risk: [rates]
        datasets: [ust_par_yield_curve]
        studies: [ust_par_bond_rate_risk]
        can_answer:
          - 以最近票面收益率构造的假设平价债券，收益率平移若干 bp 时价格变化多少
          - 久期、久期 + 凸性近似相对完整重新定价的误差有多大、随期限如何变化
        cannot_answer:
          - 某只真实国债或债券基金（如 TLT）的风险与回报（需要真实现金流、价格或总收益数据）
          - 非平移的曲线形变（需要零息曲线与关键利率久期）
          - 冲击发生的概率或未来利率走势（需要预测模型与样本外验证）
      - id: equity_risk
        name: 股票
        summary: 美国股票市场与 Fama/French 因子的月度收益，以及标普综合指数 1871 年起的价格、股息、盈利与 CAPE 估值
        risk: [equity]
        datasets: [french_ff3, french_ff5, french_mom, damodaran_histret, shiller_price, shiller_fundamentals, shiller_cape, shiller_real]
        studies: [us_asset_history, us_asset_history_last_25y]
        can_answer: []
        cannot_answer:
          - 个股或具体指数基金的回报（只有组合层面的因子收益）
          - 行业或个股层面的估值（只有标普综合指数整体的 CAPE 与市盈率）
          - 美国以外的股票市场
      - id: credit_premium
        name: 信用
        summary: 穆迪 Baa、Aaa 公司债收益率相对 10 年期国债的利差（日度），以及由收益率推算的 Baa 公司债年度回报
        risk: [credit]
        datasets: [fred_baa10y, fred_aaa10y, damodaran_histret]
        studies: [us_asset_history, us_asset_history_last_25y]
        can_answer: []
        cannot_answer:
          - 期权调整利差与高收益债利差（只有穆迪收益率利差）
          - 公司债指数的实际持有回报（Damodaran 的 Baa 回报由收益率推算）
      - id: vol_premium
        name: 波动率
        summary: Cboe VIX 波动率指数（标普 500 期权隐含的 30 天波动率，日度）
        risk: [instrument]
        datasets: [fred_vixcls]
        studies: []
        can_answer: []
        cannot_answer:
          - 隐含波动率相对已实现波动率的溢价（需要股票日度收益，尚未接入）
          - 期权定价与波动率曲面（完整历史期权链列为能力缺口）
      - id: global_assets
        name: 跨市场比较
        summary: 发达、欧洲、日本、亚太、北美与新兴市场的股票因子月度收益（美元计价，1990 年起），以及主要汇率与美元广义指数
        risk: [fx, equity]
        datasets: [french_developed3, french_developed_ex_us3, french_europe3, french_japan3, french_asia_pacific_ex_japan3, french_north_america3, french_emerging5, fred_dexuseu, fred_dexjpus, fred_dexchus, fred_dexusuk, fred_dtwexbgs]
        studies: []
        can_answer: []
        cannot_answer:
          - 以当地货币计的回报（French 国际因子只有美元计价）
          - 各国国债与宏观数据（世界银行、IMF、BIS、OECD 尚未接入）
          - 中国 A 股（交易所与社区工具尚未接入）

  - id: sectors_regions
    name: 地区与行业
    question: 结构、周期、集中度和相对表现有何差异？
    directions:
      - id: sector_structure
        name: 行业与地区结构
        summary: 美国 12 与 49 行业的收益风险、因子暴露，经济、历史公司财报、估值和指引专题，以及炼油产业链的处理量、裂解价差与公司总收益
        risk: [equity]
        datasets: [french_ind12_vw, french_ind49_vw, french_ind12_ew, french_ind12_firms, french_ind12_bm, fred_rvam, fred_rvama, fred_rvar, fred_rvaw, fred_rvai, industry_sec_facts, industry_valuation, industry_guidance,
                   eia_refinery_gross_inputs, eia_refinery_operable_capacity, eia_refinery_utilization, eia_spot_wti_cushing,
                   eia_spot_gasoline_gulf, eia_spot_ulsd_gulf, sec_tsr_valero, sec_tsr_pbf]
        studies: [us_industry_dossier, us_industry_12, us_industry_49, us_refining_investment_2016_2025, us_refining_utilization_2025,
                  us_refining_throughput_scenarios_2025]
        can_answer:
          - 哪些行业的历史回报伴随更高风险或风格暴露
          - 选定行业的实体经济、历史申报样本盈利和管理层指引如何变化
          - 美国炼厂利用率与裂解价差的历史关系，以及独立炼油公司总收益与二者的描述性对照
        cannot_answer:
          - 精确的行业盈利—估值回报分解、历史成分权重和全市场一致预期
          - 美国以外的地区与行业

  - id: securities_funds
    name: 证券与基金
    question: 财务、估值、费用、持仓及工具结构有何特点？
    directions:
      - id: company_filings
        name: 公司财报
        summary: 15 家验证公司的核心指标与时点视图，以及能源、批零、半导体软件的历史 SIC 年度专题样本
        risk: [equity]
        datasets: [edgar_fsds, edgar_companyfacts, company_sec_facts, industry_sec_facts, industry_guidance]
        studies: [company_sample, company_apple, company_microsoft, company_nvidia, company_amazon, company_alphabet, company_tesla, company_jpmorgan, company_berkshire, company_exxon, company_johnson-johnson, company_procter-gamble, company_coca-cola, company_walmart, company_costco, company_nike, us_industry_dossier]
        can_answer:
          - 选定历史申报样本的营收、利润率、现金流与资本配置
        cannot_answer:
          - 全部上市普通股的同口径盈利（专题 SEC 申报样本不等于股票成分）
          - 季度数据（E3 尚未开始）
          - 部分公司的个别指标（如银行的资本开支），见 EDGAR 设计说明的缺口列表
      - id: fund_costs
        name: 基金费用与持仓
        risk: [instrument]
        planned: true
        needs: 需要逐家核验基金发行方的费用、净值与持仓资料；净值不替代成交价
      - id: real_bonds
        name: 真实债券与债券基金
        risk: [rates]
        planned: true
        needs: 需要真实现金流、价格或总收益数据，才能与假设平价债券对比

  - id: portfolio_scenarios
    name: 组合与情景
    question: 资产如何共同影响风险，假设变化会造成什么结果？
    directions:
      - id: portfolio
        name: 模拟组合风险
        summary: 股票、国库券、国债、公司债、房地产与黄金的年度回报（1928 年起），以及股票市场与无风险利率的月度收益；只做模拟组合，不需要真实账户
        datasets: [damodaran_histret, french_ff3]
        studies: [us_asset_history, us_asset_history_last_25y]
        can_answer: []
        cannot_answer:
          - 月度或日度的多资产组合风险（债券等只有年度回报）
          - 交易成本、税负与真实账户的执行

  - id: forecast_strategy
    name: 预测与策略实验
    question: 某种信号是否改善预测或模拟表现？
    directions:
      - id: signal_tests
        name: 信号与预测检验
        planned: true
        needs: 需要时点数据（ALFRED 或持续积累的本地快照），以及预设基准、样本外评估与预登记

phases:
  - id: P0
    name: 总体架构
    status: done
    summary: 目标、范围、模块契约、资源地图与可靠性规则（架构 V0.3）
  - id: P1
    name: 公共契约与资源核验
    status: partial
    summary: 首个案例所需的来源登记、时间与质量契约、成果与运行规范已实现；其他市场与对象待扩展
  - id: P2
    name: 小规模贯通验证
    status: done
    summary: 美国国债收益率曲线案例：取得 → 快照 → 标准化 → 分析 → 报告 → 复现，含异常反例测试
  - id: P3
    name: 研究模块渐进扩展
    status: partial
    summary: >-
      市场与大类资产分支已有两个研究方向：美国国债期限结构（描述性研究）与债券利率敏感性（假设平价债券情景）；
      宏观与政策分支已接入通胀、政策利率与就业序列（只有数据，尚无研究），本机每个工作日定时保存快照。研究页按实现分支注册展示组件。解释、预测与组合研究，
      以及地区与行业、证券与基金分支尚未开始
  - id: P4
    name: 高级研究或可选应用
    status: planned
    summary: 复杂预测、策略模拟、新市场或个人账户等应用，按需启用

modules:
  - id: Q
    name: 研究定义
    code: registry.py · config/studies
    role: 问题、范围、方法与用途
  - id: D
    name: 资源接入
    code: connectors/
    role: Treasury、FRED、ALFRED、人工导入
  - id: S
    name: 数据与版本
    code: data/
    role: 原始快照、标准化版本、时间契约、时点视图
  - id: A
    name: 公共分析
    code: analytics/
    role: 利率曲线、收益、风险
  - id: M
    name: 研究分支
    code: research/
    role: 描述、解释、预测、模拟成果
  - id: O
    name: 成果与档案
    code: reporting/ · runs.py
    role: 报告、图表、运行清单
  - id: V
    name: 质量与验证
    code: quality/ · validation/
    role: 缺失与隔离、交叉核验、快照抽查、复现

guarantees:
  - title: 来源可追溯
    detail: 每次取得原样保存原始文件及校验值；标准化版本只追加、不覆盖，记录上游快照与上一版本。
  - title: 缺失显式表达
    detail: 不填零、不沿用前值、不插值；冲突数据隔离；覆盖不足时，依赖它的结论标为不支持。
  - title: 期间覆盖对照日历
    detail: 日期覆盖对照经核验的发布日历计算；期间不完整时只保留首尾对比，不输出均值、极值与计数。
  - title: 时点资格需要证据
    detail: 只有当前修订的数据，不能凭假定的发布延迟进入过去的时点视图；必须是当时已取得的快照或供应方历史版本。
  - title: 失败留痕
    detail: 每次取得记录开始与终态；任何阶段失败都保留旧版本与诊断快照；凭证不进入日志。
  - title: 固定输入可复现
    detail: 运行清单固定研究定义、数据版本、输入角色与代码内容校验值；verify 重算并比较结果校验值。
