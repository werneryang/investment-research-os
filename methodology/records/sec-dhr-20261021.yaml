evidence:
  # 题目里 AI 凭记忆写的公司特征，取数时逐条对照
  - layer: source_fact
    text: 财年按日历年，结束于 12 月 31 日；前三个季度结束于月末附近的星期五（例如 2025-03-28、2025-06-27、2025-09-26、2026-03-27、2026-06-26、2026-09-25），第四季度到 12 月 31 日为止。季度天数因此不等（Q4-25 为 96 天，Q4-24 为 95 天，Q1-26 为 86 天，Q1-25 为 87 天）。
    location: Company Facts 各期间起止日；Submissions 的 reportDate
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 2023-09-30 完成 Veralto 分拆，此后 Veralto 按终止经营列报；FY2021、FY2022 的营收、成本、营业利润和经营现金流在后来的 10-K 里重述为持续经营口径，归属 Danaher 的净利润仍含终止经营。FY2021 末的资产负债表各项没有被重述过（后来的 10-K 不再列示这一期）；FY2022 末的应收、存货、应付在 10K-FY2023 里重述，Veralto 的资产改列为待处置资产（流动 1,280，非流动 3,501）。
    location: veralto_separation_20230930 公告；Company Facts 中同一期间在不同申报里的数值（RevenueFromContractWithCustomerExcludingAssessedTax、AccountsReceivableNetCurrent 等）；AssetsOfDisposalGroupIncludingDiscontinuedOperationCurrent、DisposalGroupIncludingDiscontinuedOperationOtherNoncurrentAssets
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 2023-12-06 完成 Abcam 收购（FY2023 收购企业支付现金 5,610）；2026-06-10 完成 Masimo 收购（2026 年前九个月收购企业支付现金 9,881）。期间内另有一处终止经营：FY2025 归属净利润比持续经营利润多 14，Q3-26 多 28。
    location: abcam_completion_20231206、masimo_completion_20260610 公告；Company Facts 的 PaymentsToAcquireBusinessesNetOfCashAcquired、NetIncomeLoss、IncomeLossFromContinuingOperations
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 公司在每份业绩新闻稿里披露非 GAAP 的核心营收增长，按总增长减去收购和剥离、汇率的影响列出调节表，并分三个分部列示。2026 年第三季度起，核心营收增长另外剔除向客户返还的关税退款（Q3-26 合计影响 1.0 个百分点，Biotechnology 4.0 个百分点）。公司另有两种派生口径：2021–2023 年的“剔除新冠影响的基础业务核心增长”，2026 年起的“剔除呼吸道检测的核心增长”。
    location: 8K-Q4-21 至 8K-Q3-26 对应新闻稿的 Core Sales Growth 调节表；8K-Q3-26 对应新闻稿调节表下的注释
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: FY2021、FY2022 的核心营收增长是按分拆前的口径公布的（FY2022 的调节表还有第四个分部 Environmental & Applied Solutions），之后没有按持续经营口径重新公布这两年的核心增长。
    location: 8K-Q4-21、8K-Q4-22 对应新闻稿的调节表
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 指引都是非 GAAP 口径，公司在新闻稿中写明只按核心营收给营收预测，不给 GAAP 营收和 GAAP 每股收益指引。新闻稿正文和附表同时给当季（或下一季）和全年指引：季度指引只有核心营收增长（合计与分部），2026 年起加了当季调整后营业利润率；全年指引有核心营收增长和调整后稀释每股收益区间，2026 年起加了呼吸道检测收入。季度核心增长多数写成“低个位数”“持平”“小幅增长”一类的描述，不给数字。
    location: 8K-Q4-24 至 8K-Q3-26 对应新闻稿的 Outlook 段和 Forecasted / Forward-Looking Information 表
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 资产负债表上应收一行就是“贸易应收（扣除坏账准备）”，应付一行就是“贸易应付”，应计费用及其他负债另列一行。
    location: 8K-Q4-25 对应新闻稿所附合并资产负债表；Company Facts 的 AccountsReceivableNetCurrent、AccountsPayableTradeCurrent、AccruedLiabilitiesCurrent
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 第四季度的单季数字不在 XBRL 里直接列报；季度经营现金流只有年初至今累计值。新闻稿列有单季数字。
    location: Company Facts；8K-Q4-25 对应新闻稿
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 季度新闻稿不列实际的调整后营业利润率和分部营业利润，只有第四季度新闻稿附分部信息表（分部营收、GAAP 与调整后营业利润）。调整后毛利率不披露。
    location: 8K-Q2-25 至 8K-Q3-26 对应新闻稿的全部附表
    verified: true
    verifiability: public_filing

