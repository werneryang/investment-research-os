research_question:
  - layer: own_extension
    text: 照同一条路径换一家有分拆、有收购、披露核心营收增长的公司，四张卡的首批范围各能走到哪一步，Micron 那次临时定的口径还能不能沿用？
    location: ""
    verified: false

