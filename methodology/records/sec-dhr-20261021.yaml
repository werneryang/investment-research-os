            - what: 登记哪几张表
              options: [只登记主指引表（核心增长、调整后营业利润率、调整后每股收益、呼吸道检测收入）, 连同“其他前瞻信息”表（汇率影响、摊销、公司费用、利息、税率、股数）一起登记]
              chosen: 只登记主指引表
              vs_mu: 沿用“只登记新闻稿指引表”；Micron 只有一张表，这次有两张，另一张没有登记
            - what: 分部指引和派生口径（剔除呼吸道）登记不登记
              options: [都登记, 只登记公司合计]
              chosen: 都登记
              vs_mu: 新碰到
        - step: 2
          did: 确认每个指标能用官方数据核对
          classification: 已完成（按临时口径）
          guesses:
            - what: 非 GAAP 实际值只在公司自己的新闻稿里，算不算官方数据
              options: [算（新闻稿是 8-K 附件）, 不算，记为无法核对]
              chosen: 算
              vs_mu: 沿用。本例全部指引都是非 GAAP，核心增长的实际值也只在新闻稿里
            - what: 指引发布后、实际值公布前，公司改了核心增长的定义（Q3-26 起剔除向客户返还的关税退款）
              options: [用公司新口径的实际值, 按旧口径重算（把关税退款的影响加回）, 记为无法核对]
              chosen: 用公司新口径的实际值，另列旧口径值
              vs_mu: 新碰到
              impact: Q3-26 合计核心增长新口径 3.0%、旧口径 2.0%，都在 2.0%–3.0% 区间内，一个在上端、一个在下端；剔除呼吸道的核心增长对约 5.0% 的点值，新口径 +0.5、旧口径 −0.5
            - what: 调整后营业利润率的实际值季度新闻稿不列
              options: [记为无法核对, 用新闻稿调节项自己推算, 读电话会演示材料]
              chosen: 记为无法核对（因数据不足）
              vs_mu: 新碰到
              note: 2026-11-14 补读后确认 10-Q、10-K 正文也没有调整后营业利润率（正文的非 GAAP 说明只涉及核心增长）；电话会演示材料仍没有取
            - what: 呼吸道检测收入的实际值公司按 5,000 万美元取整
              options: [照取整值比, 记为无法核对]
              chosen: 照取整值比，并标注
              vs_mu: 新碰到
            - what: 每股收益指引的名称在 8K-Q3-26 改为“持续经营”口径
              status: 记录在案；FY2026 尚未到期，不影响本次核对
        - step: 3
          did: 已到期的 30 条取实际值并标位置；未到期的 38 条留空
          classification: 位置已完成；达成与否需人工判断
          guesses:
            - what: 怎样算达成
              options: [落在区间内, 不低于下限, 与中点比]
              chosen: 落在区间内；另记与中点的差
              vs_mu: 沿用
              impact: 5 条区间指引里 3 条在区间内、2 条高于上限；换成“不低于下限”，5 条都算达成
            - what: 约数指引怎样判定
              options: [不判定只记差值, 自定容差, 按四舍五入位数]
              chosen: 不判定只记差值
              vs_mu: 沿用
            - what: 描述性指引怎样判定
              options: [不判定只记实际值, 映射成数值区间再判定]
              chosen: 不判定只记实际值
              vs_mu: 新碰到
          note: 全年指引一年只到期一次。窗口内到期的全年指引只有 FY2025 的 7 条；FY2026 的 27 条要到第四季度新闻稿（预计 2027 年 1 月下旬）才能核对
      not_in_scope: 第 4、5 步的统计和反馈；定性承诺

