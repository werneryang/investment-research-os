method_output:
  unit: 金额为百万美元（每股收益为美元）；比率为小数，利润率、增长和占比为百分数，周转为天
  periods:
    annual: FY2021–FY2025（期末均为 12-31）；平均余额和同比另用 FY2020
    quarterly: Q3-25、Q4-25、Q1-26、Q2-26、Q3-26（期末 2025-09-26、2025-12-31、2026-03-27、2026-06-26、2026-09-25）；同比另用 Q3-24 至 Q2-25
    latest_available: 截至 2026-11-14，最新的定期报告是 10Q-Q3-26；Q4-26 尚未公布
  classification_terms: [已完成, 因数据不足未执行, 需人工判断]

  walkthrough:
    - card: dupont-return-decomposition
      reached: 第 1、3 步都走完（只做历史年份）
      first_guess: {step: 1, what: 净利润取哪个口径——含不含终止经营（Veralto）、扣不扣优先股股利；权益含不含优先股}
      steps:
        - step: 1
          did: 三因子分解，FY2021–FY2025
          classification: 已完成
          guesses:
            - what: 净利润口径
              options: [GAAP 归属 Danaher 的净利润（含终止经营）, 持续经营利润, 归属普通股的净利润（扣优先股股利）, 非 GAAP 调整后净利润]
              chosen: GAAP 归属 Danaher 的净利润（含终止经营）
              vs_mu: 沿用（Micron 取 GAAP 归属母公司）。但 Micron 没有终止经营和优先股，这两个子选项是这次新碰到的
              impact: FY2021–FY2023 差别明显，见 sensitivity.continuing_income；FY2024 起两者几乎相同
            - what: 权益口径
              options: [Danaher 股东权益（含优先股、不含少数股东）, 总权益（含少数股东）, 普通股权益（扣优先股）]
              chosen: Danaher 股东权益（含优先股、不含少数股东）
              vs_mu: 沿用（Micron 没有少数股东和优先股）。少数股东 4–12，可以忽略；优先股 FY2020–FY2022 末为 3,268、3,268、1,668，2023 年转换完毕
              impact: 见 sensitivity.common_equity
            - what: 营收取最新申报的重述值（持续经营）还是首次申报值（含 Veralto）
              options: [最新申报（持续经营）, 首次申报（含 Veralto）]
              chosen: 最新申报（沿用共用规则）
