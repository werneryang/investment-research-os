  handover_gaps:
    - 题目写“5 个财年、5 个季度”，但重述让“取最新申报”这条共用规则在本例第一次影响结果：FY2021 的余额从没重述、营收重述过，两张卡各自定了不同的处理（杜邦沿用，营运资本改为同一份申报取分子分母）。交接里没有约定重述和终止经营怎样处理。
    - 首次走查时卡和交接都没有说取数要不要读 10-K、10-Q 正文，因为 www.sec.gov 要求联系邮箱而没有取，分部五季、地区口径、收购附注都缺。同日交接约定补上了取数范围（可以读正文和附注、可以用已配置的 SEC 请求标识），补读后这三处都补上了。
    - 收购附注只给收购日的公允价值，按年列合计，不按被收购方分列；年末余额里被收购方占多少、被收购方的成本，正文也没有，量化只能近似。
    - 第 4 张卡的检查日和期间窗口没有对上全年指引：题目的“最近 5 个季度”能覆盖的全年指引只有一年，FY2026 的 27 条都未到期。题目没有写全年指引要回看几年。
