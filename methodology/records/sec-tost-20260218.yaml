research_question:
  - layer: own_extension
    text: 交易额增长时，每 1 美元交易额留下的毛利是否改善？
    location: ""
    verified: false

thesis: []

evidence:
  - layer: source_fact
    text: GPV 是 Toast 支付平台处理的总金额；FY2025 为 195.1 十亿美元，FY2024 为 159.1。
    location: 10K-FY2025，MD&A 关键业务指标；8K-Q425 指标汇总表
    verified: true
  - layer: source_fact
    text: 金融科技解决方案收入按总额确认，公司判定自己是托管支付服务的委托人。
    location: 10K-FY2025，MD&A 收入说明；Item 8 收入确认附注
    verified: true
  - layer: source_fact
    text: 金融科技收入还包含 Toast Capital 贷款的营销与服务费，没有单独列示。
    location: 10K-FY2025，MD&A 收入说明
    verified: true
  - layer: source_fact
    text: 支付处理成本包括交换费、卡组织费和付给收单处理商的费用，记入营业成本；没有拆出金额。
    location: 10K-FY2025，Item 8 附注 Costs of Revenue
    verified: true
  - layer: source_fact
    text: 公司依赖第三方支付处理商接入卡组织，可自行决定使用哪家收单处理商；没有披露自有处理比例。
    location: 10K-FY2025，Item 1A 风险因素；Item 8 收入确认附注
    verified: true
  - layer: source_fact
    text: 业绩 8-K 把金融科技毛利拆成支付与非支付两部分；这是非 GAAP 数字，且只拆毛利，不拆收入。
    location: 8K-Q425、8K-Q424、8K-Q423，Non-Payments Financial Technology Solutions Gross Profit 调节表
    verified: true
  - layer: source_fact
    text: Toast Capital 的预期信用损失记入一般及行政费用，不在金融科技成本里。
    location: 10K-FY2025，Item 8 贷款服务义务附注
    verified: true

causal_mechanism:
  - layer: author_judgment
    text: 管理层把 FY2025 金融科技成本的增加归因于 GPV 增长，把收入增加主要归因于网点增长。
    location: 10K-FY2025，MD&A 经营结果
    verified: true
  - layer: ai_inference
    text: FY2024 到 FY2025，毛利增加的约四分之三来自交易额增长，其余几乎全部来自抽成率上升，成本率基本不变。
    location: ""
    verified: false

analytical_method:
  - layer: own_extension
    text: 用 unit-economics-take-rate 方法卡第 3、4 步计算；公式写在 method_output.attribution_formula。
    location: ""
    verified: false

assumptions:
  - layer: own_extension
    text: 把金融科技收入和成本都除以 GPV。这是近似值，因为分子含 Toast Capital 等非支付业务。
    location: ""
    verified: false

valuation_logic: []
counterarguments: []

falsification:
  - layer: own_extension
    text: 如果公司日后披露非支付收入，且剔除后抽成率没有上升，本例“抽成率提升”的读法就不成立。
    location: ""
    verified: false

transferability:
  - layer: ai_inference
    text: 第 3、4 步适用于按总额确认收入、同时披露交易额和交易相关收入与成本的平台。
    location: ""
    verified: false

