method_output:
  unit: "金额为百万美元，比率为 bps（占 GPV）；GPV 原始精度为一位小数的十亿美元，比率误差约 0.1 bps"
  attribution_formula: >-
    毛利变化 = 交易额贡献 + 抽成率贡献 + 成本率贡献。
    交易额贡献 = (V1 − V0) × (t0 − c0)；抽成率贡献 = V1 × (t1 − t0)；成本率贡献 = −V1 × (c1 − c0)
  disclosed:
