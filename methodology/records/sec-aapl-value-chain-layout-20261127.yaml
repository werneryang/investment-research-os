  checks:
    parent_unchanged: "原走查记录 sha256 与 supplements 声明一致。"
    universe: "items 的 32 个 id 与原记录 relationships 一一对应，没有重复、遗漏或多出。"
    layer: "32 条的层次都按 id 前缀归类，与 classification_rules 一致。"
    tense: "逐条对照原记录的 temporal_status、limits 和 evidence_date_refs；TI、Coherent 另读了出处原文（Apple 2025-08-06 公告、2026-10-20 公告）。29 条与规则一致，3 条更正，见 corrections。"
    rendering: "线上报告页的矩阵与第一版一致（14 条现行、13 条已签或已公告、5 条只有历史，6 个星号）。"
  corrections:
    - id: u_ti
      before: {tense: announced, future_component: false}
      after: {tense: current, future_component: true}
      reason: "原记录 temporal_status 写的是扩大合作；出处原文是 Apple 与 TI 扩大双方合作，并为 TI 现有工厂加装设备、新建工厂。按规则，现有关系另含未来扩产，应归现有并打星号，与 Corning 同类。原记录 limits 不认定扩产已完成，星号正好表达这一点。"
    - id: u_coherent
      before: {future_component: false}
      after: {future_component: true}
      reason: "出处原文是与这家长期合作伙伴新签多年协议，2026-10 仍在此协议下供货。规则把同一来源的前瞻承诺记为星号；同样有多年协议的 Broadcom（射频）、Perryman 都打了星号，Coherent 应一致。"
    - id: e_goldman
      before: {future_component: true}
      after: {future_component: false}
      reason: "Goldman 的未来变化是 2026-01 签约把 Apple Card 移交给 Chase，是退出，不是扩产或承诺。图上星号的说明是另含未来扩产或承诺，打星号会让读者读反。移交由 e_chase（已签或已公告）表达。"
  borderline_kept:
    - "u_qualcomm 维持已签或已公告：协议覆盖 2024–2026 年机型，但原记录 limits 不认定 2026 年实际出货。"
    - "u_amkor_existing 维持仅历史实例：现有封装关系的直接证据是 2023-11-30，最新一期出处只提新厂项目。"
    - "u_qnity 维持现有加星号：原记录写的是扩大关系，同时说明项目公告不等于已全量交付。"
  effect: "矩阵改为 15 条现行、12 条已签或已公告、5 条只有历史；星号仍为 6 个（加 TI、Coherent，去 Goldman）。"
