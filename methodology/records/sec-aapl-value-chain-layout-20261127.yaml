classification_rules:
  layer: Taken from the id prefix used in the parent record (u_ component and manufacturing, t_ upstream-of-upstream chain, h_ final assembly, d_ channel and end use, e_ software and financial ecosystem). Display order runs along the chain, upstream first.
  tense: |
    Read from the parent record's temporal_status wording and its limits field.
    current = the source describes the relationship as existing or in operation, or a dated 2026 arrangement in force.
    announced = a signed agreement, announcement or plan whose delivery or rollout is not confirmed by the source.
    historical = the source evidence is a past instance only and does not show the relationship in the latest period.
  future_component: true when a current relationship also carries a stated future expansion, goal or prospective commitment in the same source.
