    final assembly, plus dependence on third-party compute/storage. No named firm is mechanically assigned these
    risks.
  contract_observations:
  - Broadcom custom-ASIC agreement covers multiple generations through 2031, not an unconditional delivered-volume
    guarantee.
  - Qualcomm supply agreement covers 2024–2026 launches, not all Apple models or all modem demand.
  - Amkor existing relationship and prospective Peoria project are distinct.
  - Long duration/co-development does not quantify switching costs or prove dependency.
