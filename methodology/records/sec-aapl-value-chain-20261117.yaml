  vendor_identity_continuity: No assurance these are identical legal counterparties in both years; percentages are
    separate period-end groups.
  revenue_concentration_absence_check: No direct statement found in reviewed 10-K establishing no customer at or
    above 10% of annual revenue; no absence claim made.
  vendor_nontrade_accounting: Components sold to assembly vendors do not enter product net sales; gains reduce product
    cost of sales when related finished products are sold.
flow_scope:
  supply_or_service_direction: Each relationship from/to expresses disclosed product/service/technology path, not
    payment direction.
  aggregate_demand_path: Customer markets → direct Apple retail/online/direct-sales or indirect carriers/resellers
    → Apple product/services demand; Item 1 supports aggregate channel model, not named channel weights.
  payment_direction_and_terms: Not generally established from cited announcements; no amounts, margin capture or
    invoices assigned to individual edges. Multi-party equipment/wafer paths are not assumed direct Apple purchases.
  non_production_roles:
  - carriers/resellers
  - enterprise users
  - software/model integration
  - payment network/issuer
  multi_role_policy: Same entity may be supplier, channel, ecosystem complement and competitor in different businesses.
    Every edge retains product/role/date; no single exclusive entity bucket.
