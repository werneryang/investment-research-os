reproduction:
  environment: Existing project Python environment; yaml, stdlib HTMLParser, registered SecClient; no new dependencies
    or connector
  procedure:
  - Read SEC submissions; filter 10-K/10-Q accepted no later than cutoff; pin accession and reportDate.
  - Read filing HTML in memory with registered client; parse selected inline facts and associated product/service
    contexts, including scale 6 and FY2026 dates.
  - Cross-check consolidated revenue against Company Facts same accession and period.
  - For each category, compute 100*revenue/478834; compare sum with total and products statement subtotal.
  - Open cited public HTML; locate named parties and supported scope; separate agreement, future output, historical
    relationship and existing delivery.
  - Keep undated pages secondary, unaccessed PDF/search leads unverified; preserve publication and access separately.
  - No original persisted; response hash lets a future permitted re-read compare bytes, but dynamic pages/metadata
    may change.
  arithmetic_python: v=[254098,37929,27929,35577,123301]; total=478834; assert sum(v)==total; shares=[100*x/total
    for x in v]; assert sum(v[:-1])==355533
  inline_context_check: 'c-1, c-11, c-14, c-44, c-47, c-50, c-53: period 2025-09-28 to 2026-09-26; srt:ProductOrServiceAxis
    dimension for categories.'
