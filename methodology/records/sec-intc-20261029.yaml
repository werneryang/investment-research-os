evidence:
  - layer: source_fact
    text: 财年是 52/53 周制，结束于 12 月最后一个星期六附近：FY2020 至 FY2025 的期末为 2020-12-26、2021-12-25、2022-12-31、2023-12-30、2024-12-28、2025-12-27；FY2022 为 53 周（371 天），其余为 52 周。窗口内的季度都是 13 周。
    location: Company Facts 各期间起止日；Submissions 的 reportDate
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 2025-09-12 出售 Altera 51% 股权并出表，此前 Altera 的经营结果计入“All Other”；出表后按权益法核算剩余 49%，Altera 成为外部客户（Q3-26 向其提供晶圆制造服务确认收入 126，前九个月 446）。Q3-25 确认出售收益 5,546（在营业外）。公司没有披露 Altera 在 Q3-25 的季度收入；10K-FY2025 只写了 FY2024 Altera 收入 1.5 十亿美元。
    location: 10Q-Q3-26 第 9 号附注（Acquisitions and Divestitures）与关联方段落、营业外收支表；10K-FY2025 MD&A 分部收入小结
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 2026-02-03 Mobileye 完成收购 Mentee Robotics，对价 637（现金净额 596）。期间内没有其他收购现金流出；公司不披露剔除收购和剥离的有机增长。
    location: 10Q-Q3-26 第 9 号附注；Company Facts 的 PaymentsToAcquireBusinessesNetOfCashAcquired
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 归属 Intel 的净利润在窗口内多次被营业外项目主导：Q3-25 含 Altera 出售收益 5,546；Q2-26、9M-26 含托管股份（Escrowed Shares）按市值计量的损失（9M-26 合计 12,614），Q3-26 为收益 1,005。公司在非 GAAP 调节表中剔除这两项。
    location: 8K-Q3-25、8K-Q2-26、8K-Q3-26 的非 GAAP 调节表；10Q-Q3-26 营业外收支表
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 资产负债表的应付账款是单独一行（应计薪酬、其他应计负债另列），但其中含资本开支的应付款：公司与部分设备供应商约定超过 90 天的付款期，FY2025、FY2024 末这类未付款分别为 1.5、3.2 十亿美元，计入“应付账款和其他应计负债”，没有拆出应付账款中的部分。
    location: 10K-FY2025 财务报表附注（现金流补充说明段）；10Q-Q3-26 现金流量表脚注
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 少数股东权益在窗口内明显上升（FY2021 末为 0，FY2025 末 12,079，Q3-26 末 16,642），来自 Mobileye、IMS、爱尔兰和亚利桑那的 SCIP 合资。Q2-26 公司以 14.2 十亿美元买回爱尔兰 SCIP 的少数股东权益。
    location: Company Facts 的 MinorityInterest；10K-FY2025 MD&A 少数股东权益段；10Q-Q3-26 流动性段落
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 公司每份业绩新闻稿给下一季度的 GAAP 和非 GAAP 两套指引（收入区间、毛利率、税率、每股收益），并写明毛利率和每股收益指引以收入区间中点为前提；另有一张全年表（资本开支、政府补助、合作方出资、净资本开支、研发和管理费用或营业费用）。全年表的指标名称在窗口内改过两次：8K-Q2-25 起“R&D and MG&A”改为“operating expenses”（GAAP 口径因此含重组费用），“net capital spending”改为“net capital expenditures”。
    location: 各期新闻稿 Business Outlook 段、GAAP 与非 GAAP 指引调节表
    verified: true
    verifiability: public_filing
  - layer: source_fact
    text: 公司在 10K-FY2025 说明，Q3-25 10-Q 中与美国政府协议有关的会计处理在征询 SEC 意见后作了调整，公司认定不重大。本次用到的 Q3-25 收入、毛利、营业利润、净利润在 Company Facts 中只有一个值，各份申报一致。
    location: 10K-FY2025 MD&A；Company Facts 中 Q3-25 各期间的 n_vals
    verified: true
    verifiability: public_filing

