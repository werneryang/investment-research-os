    - 交接约定的期间（全年指引看最近 2 个已结束的财年加当年）在本例够用：FY2024、FY2025 各有多次发布、都已到期。但 FY2024 的全年表从 8K-Q2-24 才开始出现，要往前多读两份新闻稿才能确认。
