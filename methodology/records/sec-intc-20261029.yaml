method_output:
  unit: 金额为百万美元（每股收益为美元；全年指引表为十亿美元）；比率为小数，利润率、增长和占比为百分数，周转为天
  periods:
    annual: FY2021–FY2025（期末 2021-12-25、2022-12-31、2023-12-30、2024-12-28、2025-12-27）；平均余额另用 FY2020 期末 2020-12-26
    quarterly: Q3-25、Q4-25、Q1-26、Q2-26、Q3-26（期末 2025-09-27、2025-12-27、2026-03-28、2026-06-27、2026-09-26）；同比另用 Q3-24 至 Q2-25
    latest_available: 截至 2026-11-14，最新的定期报告是 10Q-Q3-26；Q4-26 尚未公布
  classification_terms: [已完成, 因数据不足未执行, 需人工判断]

  walkthrough:
    - card: dupont-return-decomposition
      reached: 第 1、3 步都走完（只做历史年份）
      first_guess: {step: 1, what: 净利润和权益取归属 Intel 还是含少数股东——本例少数股东权益在 FY2025 末占总权益约一成，且 FY2025 归属 Intel 为负、合并口径为正，两种取法正负相反}
      steps:
        - step: 1
          did: 三因子分解，FY2021–FY2025
          classification: 已完成
          guesses:
            - what: 净利润和权益口径
              options: [归属 Intel 的净利润 ÷ Intel 股东权益, 合并净利润（含少数股东）÷ 总权益, 非 GAAP 净利润]
              chosen: 归属 Intel 的净利润 ÷ Intel 股东权益
              vs_prior: 沿用（Micron、Danaher 都取归属母公司）。前两家少数股东可以忽略，本例不能
              impact: FY2025 ROE −0.25% 对合并口径 +0.02%，正负相反；其余年份差别在 0.7 个百分点以内。见 sensitivity.total_equity_profitloss
            - what: 净利润为负或接近零的年份（FY2024、FY2025）
              options: [照算并标注, 不算]
              chosen: 照算并标注
              vs_prior: 沿用 Micron（FY2023 为负时三个因子照算）
            - what: 净利润被营业外项目主导（FY2024 递延所得税资产估值准备、FY2025 Altera 出售收益和托管股份市值变动）
              options: [照 GAAP 算, 改用非 GAAP 净利润]
              chosen: 照 GAAP 算，不调整
              vs_prior: 新碰到（前两家没有这么大的营业外项目）
              impact: 没有量化；净利率因子的变化有一部分不是经营带来的，解读属于范围外的第 4 步
            - what: FY2020 Intel 股东权益在 Company Facts 有两个值（首次 81,038，后来 81,073）
              options: [取最新申报, 取首次申报]
              chosen: 取最新申报（共用规则）
              vs_prior: 沿用
              impact: 只影响 FY2021 的平均权益，差 17.5，ROE 不变到小数点后四位
        - step: 3
          did: 五个财年并列，余额取平均
          classification: 已完成
          guesses:
            - what: 平均值怎样算
              options: [年初年末两点平均, 五个季末平均]
              chosen: 年初年末两点平均
              vs_prior: 沿用
            - what: 首年的平均余额要多取一期
              options: [多取 FY2020 期末余额, 首年改用期末余额, 首年不算]
              chosen: 多取 FY2020 期末余额
              vs_prior: 沿用
            - what: 53 周的 FY2022
              options: [不折算, 按 52/53 折算]
              chosen: 不折算
              vs_prior: 沿用 Micron
              impact: FY2022 资产周转率按 52/53 折算后约低 1.9%
      not_in_scope: 预测年、ROIC 版本、同业比较、变化原因
    - card: working-capital-forecast
      reached: 第 1、2 步走完；第 3 步算出了与自身上年的差异，找原因没有做
      first_guess: {step: 1, what: 应付账款表面行含资本开支应付（设备供应商的延长账期），分母是销货成本，取表面行会高估应付天数；公司只披露了延长账期那一部分的金额，而且是与其他应计负债的合计}
      steps:
        - step: 1
          did: 应收对营收、存货和应付对销货成本，换成天数，FY2021–FY2025
          classification: 已完成
          guesses:
            - what: 期末还是平均余额
              options: [期末余额, 年初年末平均]
              chosen: 期末余额
              vs_prior: 沿用
              impact: 见 sensitivity.average_balance；现金周期最多差 22.5 天（FY2022），FY2025 由 44.9 天变为 32.6 天
            - what: 应付取表面行还是剔除资本开支应付
              options: [表面行, 表面行减去披露的延长账期资本开支应付（上限调整）, 附注里的贸易应付（公司没有单列）]
              chosen: 表面行；另列减去延长账期资本开支应付的结果
              vs_prior: Micron 选表面行（它的表面行含应计费用）；Danaher 的表面行就是贸易应付。本例的表面行是第三种情况：不含应计费用，但含资本开支应付
              impact: 只有 FY2024、FY2025 有披露。减去后应付天数 128.2→95.5、104.6→88.7，现金周期 20.2→52.9、44.9→60.8 天；FY2024 对 FY2025 的方向由“延长 24.7 天”变为“延长 7.9 天”。披露额含其他应计负债里的部分，所以这是上限调整；普通账期的资本开支应付没有披露，表面行里还有多少无法知道
            - what: 一年按多少天
              options: [365, 期间实际天数]
              chosen: 365
              vs_prior: 沿用
              impact: 只有 53 周的 FY2022 不同；按 371 天，现金周期 60.5→61.5 天
            - what: 用年度还是季度数据
              options: [年度, 季度年化]
              chosen: 年度
              vs_prior: 沿用
            - what: Altera 出表当年（FY2025）的余额和收入
              options: [照算, 剔除 Altera 后再算]
              chosen: 照算
              vs_prior: 新碰到（Danaher 是收购当年，这里是出售当年）
              impact: FY2025 期末余额已不含 Altera，全年收入和成本含 Altera 约 8 个半月；公司没有披露 Altera 的期间收入和成本，无法量化
        - step: 2
          did: 营业周期 = 收款天数 + 存货天数；现金周期 = 营业周期 − 应付天数
          classification: 已完成
          guesses: []
          note: 合同负债不在这两步的算式里；Intel 的客户预付款没有单列在资产负债表上
        - step: 3
          did: 只和自身历史比
          classification: 差异已完成；找原因需人工判断
          guesses:
            - what: 和哪一段历史比
              options: [上一年, 五年平均, 五年区间]
              chosen: 上一年
              vs_prior: 沿用
          note: >-
            三处大的变化要读管理层说明并作判断，本次不解释：FY2022 收款天数由 43.7 降到 23.9；
            FY2024 应付天数升到 128.2、FY2025 回落到 104.6（与资本开支应付有关，见上）；FY2022 存货天数升到 133.4 之后维持在 123–125。
      not_in_scope: 第 4–7 步的预测
    - card: earnings-quality-checklist
      reached: 第 1、5、6、7 步都有结果；第 1 步出售业务的影响只能给出范围；第 7 步多数期间净利润为负，比值算不出；同比原因和冲击影响没有做
      first_guess: {step: 1, what: 公司不披露有机增长，期间有一项出售（Altera 出表）但不披露它的季度收入，剔除剥离的影响怎样填}
      steps:
        - step: 1
          did: 增长来源。总增长用 GAAP 营收同比；按分部拆贡献；收购和剥离逐项判断
          classification: 已完成（按临时口径）；剥离贡献的金额因数据不足未执行
          guesses:
            - what: 有机增长用什么
              options: [不剔除，总增长全部记为有机（Micron 的做法）, 用分部拆贡献，把含被出售业务的“All Other”单列, 自己按外部资料估 Altera 收入再剔除, 记为不适用]
              chosen: 用分部拆贡献，“All Other”单列；Intel Products（CCPG + DCAI）期间内没有收购和出售，它的增长当作有机增长的近似
              vs_prior: 改了。Micron 没有收购也没有出售，全记为有机；Danaher 有公司自报的核心增长。本例两样都没有
              impact: Q3-26 总增长 20.95%；Intel Products 增长 21.84%；“All Other”贡献 −2.20 个百分点，是剥离影响的近似上限（同一类别里 Mobileye 增长、Altera 改为外部客户后向 Intel Foundry 采购，方向相反，公司不分拆）
            - what: Mentee Robotics 收购（2026-02，对价 637）
              options: [忽略, 剔除]
              chosen: 忽略，记为“有收购但规模小”
              vs_prior: 新碰到
              impact: 公司没有披露被收购方收入；对价约为 Q1-26 营收的 5%，收入影响应远小于此（推导，未核对）
            - what: 增长按哪个期间算
              options: [最近一季同比, 最近财年同比, 最近一季环比]
              chosen: 最近一季同比，附最近财年同比；另列五季和五年
              vs_prior: 沿用
            - what: 分部贡献的分母和抵销项
              options: [各分部收入变动 ÷ 上年合并收入，分部间抵销单列, 只算 Intel Products 两个分部]
              chosen: 各分部收入变动 ÷ 上年合并收入，分部间抵销单列
              vs_prior: 新碰到（Intel Foundry 收入大部分是对 Intel Products 的内部收入，分部贡献相加远超总增长）
              impact: Q3-26 DCAI +23.45、Intel Foundry +18.03、CCPG −3.21、All Other −2.20、抵销 −15.12 个百分点
        - step: 5
          did: 最近 5 季的毛利率和营业利润率，GAAP 与非 GAAP 分开列，公司和分部分开列
          classification: GAAP 与非 GAAP 公司层面、分部五季已完成；同比变化的原因需人工判断
          guesses:
            - what: GAAP 还是非 GAAP
              options: [只列 GAAP, 两者都列]
              chosen: 两者都列（沿用 Danaher）
              vs_prior: 沿用 Danaher。本例每份新闻稿都列实际的非 GAAP 毛利率和营业利润率，五季和对比期都取得到；Danaher 取不到
            - what: 非 GAAP 数字的精度
              options: [用公司公布的一位小数, 用调节表金额自己重算]
              chosen: 用公司公布的一位小数
              vs_prior: 新碰到
            - what: 分部五季取哪里
              options: [各季新闻稿的分部信息表, 10-Q 分部附注, 10-K 全年 − 10-Q 前三季]
              chosen: 各季新闻稿的分部信息表；对比期取最新一份新闻稿的上年同期列
              vs_prior: Danaher 读 10-Q 分部附注；本例新闻稿直接给三个月的分部表，Q4 也有单季列，不用相减
              impact: 9 个季度的分部收入加抵销等于合并收入，分部营业利润加公司未分配项和抵销等于合并营业利润，逐季一致
            - what: 分部的非 GAAP 营业利润
              options: [只列分部表的营业利润, 自己推算]
              chosen: 只列分部表的营业利润（公司分部口径本身已把股权激励、重组等放在“公司未分配”）
              vs_prior: 沿用 Danaher 的“不推算”
            - what: “方向”怎样判定
              options: [逐季环比的正负, 首尾比较, 线性趋势]
              chosen: 逐季环比的正负
              vs_prior: 沿用
              impact: GAAP 毛利率环比 Q4-25 下降、其余上升；GAAP 营业利润率 Q4-25、Q1-26 下降；非 GAAP 毛利率和营业利润率只有 Q4-25 下降。按规则都不是单一方向。首尾比较（Q3-25→Q3-26）：GAAP 毛利率 +4.75、营业利润率 +10.27 个百分点；非 GAAP 毛利率 +4.1、营业利润率 +8.4 个百分点
            - what: 季度天数
              status: 本例窗口内各季都是 13 周，不用定
        - step: 6
          did: 最大终端市场占比
          classification: 占比已完成（按临时口径）；单一市场受冲击的影响需人工判断
          guesses:
            - what: “终端市场”用哪个口径
              options: [业务分部, 按开票地的地区, 主要客户]
              chosen: 业务分部为主；地区和主要客户并列
              vs_prior: 沿用（Micron、Danaher 都取业务分部）
              impact: FY2025 最大分部 CCG（现名 CCPG）占合并营收 60.98%；最大地区美国 29.81%，中国 24.02%；前三大客户合计 43%
            - what: 分部占比的分母
              options: [合并营收（各分部占比相加超过 100%）, 各分部收入之和（含内部收入）]
              chosen: 合并营收；Intel Foundry 的收入大部分是内部收入，单列不作为“终端市场”
              vs_prior: 新碰到（前两家没有大额分部间收入）
            - what: 地区口径
              status: 公司按开票地披露，不是最终使用地；照实记录
              vs_prior: 新碰到
            - what: 取哪个期间
              options: [最近财年, 最近一季]
              chosen: 最近财年（FY2025）；附 Q3-26 单季的分部占比
              vs_prior: 沿用
              impact: Q3-26 CCPG 49.03%、DCAI 44.32%，两者差距比 FY2025 小很多
            - what: 冲击多大、怎样传到公司
              status: 没有做
        - step: 7
          did: 经营现金流 ÷ 净利润
          classification: 已完成（按临时口径）；按合并口径五季中三季、五年中一年（FY2024）净利润为负，这些期间比值算不出；归属口径下 FY2025 也为负
          guesses:
            - what: 分子分母的口径
              options: [经营现金流 ÷ 合并净利润（含少数股东）, 经营现金流 ÷ 归属 Intel 的净利润, 经营现金流 ÷ 非 GAAP 归属净利润]
              chosen: 经营现金流 ÷ 合并净利润（两者都含少数股东）
              vs_prior: 改了。Micron 用归属净利润；Danaher 改成同口径相除（持续经营）。本例按 Danaher 的“同口径”原则，选合并净利润，因为经营现金流含少数股东的部分
              impact: 能算出的两季 Q3-25 0.60、Q3-26 1.44；归属口径 0.63、1.53。见 sensitivity
            - what: 净利润为负时比值怎样处理
              options: [不计比值, 照算并标注]
              chosen: 不计比值（沿用 Micron）
              vs_prior: 沿用
              impact: 五季中 Q4-25、Q1-26、Q2-26 为负，五年中 FY2024 为负，比值都不计；“是否持续低于 1”只剩 Q3-25、Q3-26 两季可判断
            - what: 净利润接近零时比值怎样处理（FY2025 合并净利润 26）
              options: [照算并标注, 视同不可比不计]
              chosen: 照算并标注（372.96），不用来判断
              vs_prior: 新碰到
            - what: 净利润被营业外项目主导（Q3-25 Altera 出售收益，Q2-26、Q3-26 托管股份市值变动）
              options: [照 GAAP 算, 另列非 GAAP 净利润口径]
              chosen: 主结果照 GAAP；另列经营现金流 ÷ 非 GAAP 归属净利润
              vs_prior: 新碰到
              impact: 非 GAAP 口径五季都能算：2.49、5.59、0.74、3.19、1.84；只有 Q1-26 低于 1
            - what: “持续”指几期
              options: [窗口内每一期, 连续两期及以上, 多数期间]
              chosen: 窗口内每一期
              vs_prior: 沿用
              impact: 主口径只有两季可判断，Q3-25 低于 1、Q3-26 高于 1，三种定义都得“否”
            - what: 按季度还是年度
              options: [季度, 年度, 两者]
              chosen: 两者
              vs_prior: 沿用
      not_in_scope: 第 2、3、4、8 步和第 9–11 步
    - card: guidance-tracking-playbook
      reached: 第 1–3 步都走到；登记 98 条，到期 75 条；第 3 步只标了实际值相对指引的位置，达成与否按临时规则
      first_guess: {step: 3, what: 毛利率和每股收益指引以收入区间中点为前提，而 5 季里有 3 季收入高于区间上限；比较时要不要按实际收入调整，卡里没有写；同一步还要定“达成”的定义}
      steps:
        - step: 1
          did: 登记 13 份新闻稿的下季指引表和全年指引表。季度：目标期 Q3-25 至 Q3-26 共 35 条（到期）、Q4-26 共 9 条（未到期）；全年：FY2024 共 10 条、FY2025 共 30 条（到期）、FY2026 共 14 条（未到期）
          classification: 已完成
          guesses:
            - what: GAAP 与非 GAAP 两套指引登记哪一套
              options: [都登记, 只登记 GAAP, 只登记非 GAAP]
              chosen: 都登记
              vs_prior: 沿用 Micron（Danaher 只有非 GAAP）
            - what: 约数指引（“约 36.0%”“约 18.0”）
              options: [按点值登记, 不登记]
              chosen: 按点值登记
              vs_prior: 沿用
            - what: 登记哪几张表
              options: [只登记下季指引表, 下季指引表 + 全年指引表（资本开支、补助、合作方出资、净资本开支、费用）, 再加上调节表里的分项]
              chosen: 下季指引表 + 全年指引表的每一行（含 Q4-26 的单季费用行）；调节表分项不登记
              vs_prior: 改了。前两家“只登记主指引表”；本例全年指引只在第二张表里，不登记就没有全年指引可追踪
            - what: 全年指引多次发布怎样登记
              options: [每次发布单独登记，重申也登记并标明, 只登记有变化的]
              chosen: 每次发布单独登记，重申也登记并标明
              vs_prior: 沿用 Danaher
            - what: 全年表指标改名（8K-Q2-25 起 R&D and MG&A → operating expenses；net capital spending → net capital expenditures）
              options: [当作同一指标连续登记，标注改名, 当作新指标]
              chosen: 非 GAAP 费用当作同一指标（公司调节表显示两者只差重组费用，非 GAAP 口径不含重组）；GAAP 口径改名后含重组费用，当作新指标 gaap_opex
              vs_prior: 新碰到（Danaher 碰到的是核心增长定义改了）
            - what: 检查日怎样定
              options: [实际值首次公布日（下一份业绩新闻稿）, 对应 10-Q 或 10-K 的申报日, 目标期末日]
              chosen: 实际值首次公布日；全年指引取第四季度新闻稿日
              vs_prior: 沿用
            - what: 窗口：季度看几份，全年看几年
              chosen: 季度看目标期在最近 5 个季度的 5 份，加新发的 Q4-26；全年看 FY2024、FY2025 加 FY2026（按交接约定）
              note: FY2024 的全年表从 8K-Q2-24 才开始出现；8K-Q4-23、8K-Q1-24 没有全年表（已读确认）
        - step: 2
          did: 确认每个指标能用官方数据核对
          classification: 已完成（按临时口径）
          guesses:
            - what: 非 GAAP 实际值只在公司自己的新闻稿里，算不算官方数据
              options: [算（新闻稿是 8-K 附件）, 不算]
              chosen: 算
              vs_prior: 沿用
            - what: 实际值用一位小数的公布值，还是用金额重算
              options: [公司公布的百分比和每股收益, 用金额重算]
              chosen: 收入用百万美元金额；毛利率、税率、每股收益用公司公布值
              vs_prior: 新碰到
            - what: FY2024 资本开支各分项的实际值
              options: [8K-Q4-24（只列净资本开支）, 8K-Q4-25 调节表的上年列（四项都有）]
              chosen: 净资本开支取 8K-Q4-24；其余三项取 8K-Q4-25 的上年列，并标注首次完整公布晚了一年
              vs_prior: 新碰到
              impact: 净资本开支在两份里都是 10,515
            - what: 合作方出资的指引写“Partner contributions”，实际值是“net”（扣除分配）
              options: [用 net 实际值比较, 用现金流量表的总额]
              chosen: 用 net 实际值（公司调节表的口径），另记现金流量表总额
              vs_prior: 新碰到
              impact: FY2024 net 12,671，现金流量表总额 12,714
        - step: 3
          did: 已到期的 75 条取实际值并标位置；未到期的 23 条留空
          classification: 位置已完成；达成与否需人工判断
          guesses:
            - what: 怎样算达成
              options: [落在区间内, 不低于下限, 与中点比]
              chosen: 落在区间内；另记与中点的差
              vs_prior: 沿用
              impact: 25 条区间指引里 9 条在区间内、6 条高于上限、10 条低于下限；换成“不低于下限”为 15 条
            - what: 以收入中点为前提的毛利率、每股收益指引，在收入高于区间时怎样比
              options: [直接与指引值比, 按实际收入调整指引后再比, 只在收入落在区间内的季度比]
              chosen: 直接与指引值比，并在同一条标注当季收入相对区间的位置
              vs_prior: 新碰到（Micron 的毛利率指引是否以中点为前提，记录里没有写；Danaher 没有毛利率指引）
              impact: Q3-25、Q1-26、Q2-26 收入高于上限，这三季毛利率高于指引的部分有多少来自收入多、多少来自利润率本身，分不出来
            - what: 约数指引怎样判定
              options: [不判定只记差值, 自定容差]
              chosen: 不判定只记差值
              vs_prior: 沿用
            - what: GAAP 税率和 GAAP 每股收益受营业外项目主导（出售收益、托管股份市值变动、估值准备）
              options: [照比, 标注后照比]
              chosen: 标注后照比
              vs_prior: 新碰到
              impact: 例如 Q3-25 GAAP 每股收益指引 −0.24、实际 0.90，差额主要来自 Altera 出售收益（推导，未核对）；Q2-26 指引 0.08、实际 −2.16，托管股份市值损失
          note: 全年指引一年只到期一次。FY2026 的 14 条要到第四季度新闻稿（未公布，按往年约在次年 1 月下旬）才能核对
      not_in_scope: 第 4、5 步的统计和反馈；定性承诺
