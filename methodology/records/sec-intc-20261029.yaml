    text: 结果只适用于 Intel 的这一期间和所选口径。Intel 与前两家的差别：净利润多期为负或接近零、被营业外项目主导；少数股东权益大；应付账款含资本开支应付；出售了一项业务但不披露它的季度收入；指引是季度 GAAP 与非 GAAP 两套加全年费用和资本开支表。
    location: ""
