    text: 按 method_library 列出的卡和步骤编号执行；每一步的归类和临时决定写在 method_output.walkthrough，Micron、Danaher 两次走查的同类决定是沿用还是改了，写在每条 vs_prior。
    location: ""
    verified: false

assumptions:
  - layer: own_extension
    text: 四张卡共用的临时决定（沿用 Micron、Danaher）：同一期间在多份申报中出现时取最新一份的数值；53 周年度不折算；第四季度单季 = 全年 − 前三季累计；季度经营现金流 = 年初至今累计相减；分部数字取各季新闻稿的分部信息表（与 10-Q 分部附注同源），同比对比期取最新一份新闻稿的上年同期列。
    location: ""
    verified: false
  - layer: own_extension
    text: 期间：年度取 FY2021–FY2025，平均余额另用 FY2020 期末；季度取 Q3-25 至 Q3-26，同比另用 Q3-24 至 Q2-25。截至 2026-11-14，最新的定期报告是 10Q-Q3-26（2026-10-30 申报），Q4-26 和 FY2026 尚未公布。指引追踪：季度指引看目标期为 Q3-25 至 Q3-26 的 5 份，另登记新发的 Q4-26；全年指引看 FY2024、FY2025 两个已结束的财年，加 FY2026。
    location: ""
    verified: false

