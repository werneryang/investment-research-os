  steps:
    - step: 1
      output:
        technology: "铁路的变革作用当时没有争议。T1 时 Poor's 1868-69 版已把铁路的社会收益（估计为其成本合理利息的五倍）和对股东、债权人的直接回报分开写，并认为即使没有直接回报也值得修。availability: contemporaneous"
        return_on_timeline:
          T1: "Poor's 1868-69：北方各州铁路总收入（不是净收益）约为成本的 23%，Poor's 据此说四年多的总收入等于成本；全国净收益约 1 亿美元，北方约为成本的 6.7%。估计口径粗（按每英里收入假定外推）。availability: contemporaneous"
          T3: "Poor's 1873-74（危机前出版）：预计 10 年内收入翻倍，1881 年达到 10 亿美元；1872 年为 4.73 亿。availability: contemporaneous"
          T4: "Poor's 1876-77 五年表：总收入 1873 年 5.26 亿、1874 年 5.20 亿、1875 年 5.03 亿，连续两年下降；同版称过去两年为萧条。按 1873 年预测的十年翻倍路径（执行时按复合增长约 7.2%/年，以五年表的 1872 年 4.652 亿为基数），1875 年应约 5.73 亿，实际 5.031 亿，低约 12%。availability: contemporaneous（T4 时）"
      reached: 走完
      first_guess: "无。两个问题当时的行业手册已分开写。"
      card_vs_added: "两个问题分开来自卡；用 Poor's 的收入预测当作“回本时间表”的当时预期是执行时补充。"
      consistent_with_expected: true

    - step: 2
      output:
        industry:
          funding_mix:
            T1: "Poor's 1868-69：股本对债务约 3 比 2（债务约占 40%），并称重组中有把债务转成股本的趋势。估计值。availability: contemporaneous"
            T3: "Poor's 1873-74（1872 财年，57,323 英里）：成本 31.59 亿美元 = 股本 16.48 亿 + 各类债务 15.12 亿，债务占 47.85%。availability: contemporaneous（T3 前出版）"
            T4: "Poor's 1876-77（1875 财年，71,759 英里）：股本 21.99 亿 + 债务 24.60 亿，债务占 52.8%（股本对债务 89 比 100）。availability: contemporaneous"
          capex_proxy: "没有现金流量表。用资本加债务账户的变化代替资本开支：1871→1875 年 26.65 亿 → 46.58 亿；1872→1875 年总账户 +47.4%，其中债务 +62.7%、股本 +33.4%，同期总收入 +8.1%。覆盖范围扩大混在里面，不能全算成新建。"
          internal_funds: "1872 财年净收益 1.658 亿、分红 0.644 亿，剩 1.018 亿，相当于债务的 6.70%（Poor's 原文给出这一比率）。按 7% 票面（执行时假定，CFC 1873-11-15 称新债最常见是 7% 金债按 90 发行）估算利息约 1.058 亿，净收益覆盖利息 1.57 倍；1875 财年降到 1.08 倍，扣分红后只剩债务的 4.52%。"
          T1_warning: "Poor's 1868-69 已写：收入每年增长 20% 时，扩建投入会超过净收益，只能对外融资或停发分红；把营运支出记进建设账户会虚增净收益。availability: contemporaneous"
          new_mileage: "Poor's 当年数：1869 年新增 5,118 英里，1872 年新增 6,427 英里（1873-01-01 累计 67,104）。Poor's 1912 汇编（NBER a02082）的同年数为 4,615 和 5,870，1871 年为 7,379；1880 年普查回溯（a02082a）1872 年为 7,439。三套数字互有出入。"
          stock_watering: "Poor's 1868-69：股票和债券实际募得大概不超过面值的 75%；资本账户常因合并、送股膨胀。availability: contemporaneous"
        company_np:
          T1: "北太平洋 1864 年获国会特许和约 4,700 万英亩土地赠予，没有联邦贷款；T1 时尚未开工。availability: contemporaneous（Poor's 1868-69 有条目但无财务数字）"
          T2: "没有营运收入。融资全靠 7.3% 金债（1870-07-01 发行，30 年期，按每英里不超过 5 万美元的抵押）；CFC 1872-11-02 的承销商广告称按面值出售，折合纸币收益约 8¼%。availability: contemporaneous"
          T2_post_hoc: "Oberholtzer 转引的书信：1872 年 9 月债券月销售降到 17.3 万美元，公司每月支用约 100 万；1873 年春零售累计约 1,600 万，加 1870 年内部认购团 500 万，共约 2,100 万。availability: post_hoc_disclosure"
          T3: "Poor's 1873-74：已支出 1,580 万美元（土地、建设、设备等合计），称公司未提供营运和土地部门的报表。availability: contemporaneous"
          T4: "Poor's 1876-77 转引明尼苏达铁路委员会：到 1874-06-30 发行债券 3,078 万、股票 20.2 万、流动负债 77.8 万；卖债实得现金 2,277 万（面值的 74.0%，按 7.3% 票面折合约 9.87% 的现金成本），建设和设备支出 2,132 万。availability: contemporaneous（T4 时）"
