    - "第 4 步 T2_post_hoc 第一条：原文没有“以公司债券按面值五成作抵押”。原文是：合同要求承销商按需垫款 50 万美元，或日后另行商定的更大数额；承销商对这笔信用按每月 0.5% 收费；贷款由存放在承销商处的公司债券充分担保。“五成”应是把每月 0.5% 的费率误读成了抵押率。透支额 60.5 万、177.5 万、158.3 万和 3.55 倍都与原文一致。"
    - "第 3 步漏记一项：Poor's 1873-74 同一条目还写北太平洋每年另付 3.5 万金元，是为买下 Lake Superior & Mississippi 24 英里线路一半权益而发行的 50 万美元债券的利息。计入后，北太平洋在自身债券之外承担的固定付息约 45.5 万金元/年，约为自身年息的 21%（原记录 19%）。结论方向不变。"
    - "第 8 步 CFC 1876 分首次违约时间的六档，按原文正文相加是 784,967,865 美元，比原文总额 783,967,665 多约 100 万；差在 OCR（正文与表格对同两档读出的数字不同），六档数字可以引用，但不要用它们复算总额。"
  result: pass_with_corrections

# ---- 技术复核补充（2026-11-27，同日稍后）：CFC 1876 页面原图核对 ----
# 通过 FRASER 的 IIIF 图像服务，按原始分辨率看了两处 OCR 存疑的页面原图。上面 technical_review.fact_check.cfc 里
# “记录自算 26.1%、17.8% 并注明读不清，处理得当”这一判断撤回，以本节为准。
technical_review_addendum:
  checked_on: "2026-11-27"
  method: "FRASER 页面原图（IIIF，原始分辨率截取局部），只看图，没有下载"
  findings:
    - "1876-01-22（第 8 页）：原文写 Poor's 给出的 1875-01-01 全部铁路债约 20 亿美元（$2,000,000,000），OCR 把 2 读成了 3。原文的两个百分比是约 39% 和约 26½%，分别是 783,967,665 ÷ 20 亿 = 39.2%、533,045,115 ÷ 20 亿 = 26.7%，原文自洽。"
    - "1876-01-29 修订版（第 3 页）：估计在美国持有 535,967,665 美元、在国外持有 253,400,000 美元，相加等于修订总额 789,367,665 美元；国外约占 32.1%。记录里“约 2.534 亿（约 32%）”与此一致，OCR 存疑解除。修订版仍未解决的违约额是 538,415,115 美元。"
  corrections:
    - "第 8 步违约：分母应为 CFC 所引 Poor's 的约 20 亿美元，不是 30 亿；1873-09-20 至 1876-01 有违约的铁路债约占全部铁路债的 39%（原文），仍未解决的约 26½%（原文），记录自算的 26.1% 和 17.8% 作废。结论方向不变，违约的范围比记录写的更大。"
  open_questions_closed:
    - "open_questions 第 4 条（CFC 1876 汇总的百分比和一处合计数 OCR 不清）已由本节解决。"

