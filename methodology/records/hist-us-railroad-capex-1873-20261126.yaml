  tool: "Claude Code（Opus 5.5），investment-research-os 会话；Poor's 与 Oberholtzer 用 OCR 文字层按关键词定位后逐段读，CFC 在内置浏览器里取全文"
  review: "技术复核 2026-11-27（见文末 technical_review）；未经人工核对"
  quality_notes:
    - "每个数字标 availability：contemporaneous（当时已公开）、contemporaneous_lagged（当时公开但晚于该时点）、post_hoc_disclosure（事件当时存在、后来才公开，如书信）、post_hoc_estimate（后人汇编或估计）。"
    - "Poor's 各年版的覆盖范围不同（报告运营数据的里程 1871 年 44,614、1872 年 57,323、1875 年 71,759），跨年变化里混有覆盖扩大，不能当成同一批公司的增长。"
    - "Poor's 1876-77 五年表的 1872 年总收入是 465.2 百万美元，1873-74 版正文写 473.2 百万（同段又写 472.2），口径或 OCR 有出入；比率按五年表算。"

point_in_time:
  rule: "每个时点只用当时已公开的信息作判断；事后数据另列，用来对照。Macaulay 的利率和股价序列是 1938 年汇编的，但底层报价当时每天见报，标 post_hoc_estimate（底层当时可得）。货币监理署的银行报表按报告日公开，滞后数周到数月。Poor's 每年一版，T2（1872-12）能看到的是 1872-73 版（1871 财年数据）；本次没有取 1872-73 版，1871 财年数字取自 1876-77 版五年表，标 contemporaneous_lagged 并注明转引。"

method_output:
