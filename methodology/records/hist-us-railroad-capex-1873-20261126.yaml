      output:
        np_lease:
          T2: "北太平洋 1872-05-01 起租入 Lake Superior & Mississippi（999 年），承担其第一抵押债 450 万（7% 金币）的利息和税共 31.5 万金元/年，以及三条被租支线债券的利息 10.5 万金元/年（2.8 万 + 2.8 万 + 4.9 万；另有第二抵押债 320 万在换成收益债，有收益才付息）。Poor's 列的合计为 42 万金元/年，不在北太平洋自己的债券里；按其 7.3% 金债约 3,010 万面值的年息 219.7 万算，约为自身年息的 19%（执行时计算；T2 时北太平洋已售债券少于此数，比例会更高）。availability: contemporaneous（Poor's 1873-74 刊出，T2 时租约已签、是否已见报未核）"
          T2_related: "北太平洋持有 St. Paul & Pacific 的控股权（Poor's 1873-74）。CFC 1872-11-09：有传 St. Paul & Pacific 未付息，被否认，并说北太平洋对其负债不负责任。availability: contemporaneous"
