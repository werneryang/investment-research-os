research_question:
  - layer: own_extension
    text: 交易额增长时，每 1 美元交易额留下的毛利是否改善？
    location: ""
    verified: false

thesis: []

evidence:
  - layer: source_fact
    text: FY2024 及以前，公司单列交易收入和交易成本；交易收入按总额确认，公司判定自己是委托人。
    location: 10K-FY2024，利润表与 Item 8 收入附注；10K-FY2025，收入确认附注
    verified: true
  - layer: source_fact
    text: 交易成本主要是付给第三方处理商和金融机构的交换费、卡组织费、处理费和清算费；没有按分部列示。
    location: 10K-FY2024，MD&A 成本说明
    verified: true
  - layer: source_fact
    text: FY2025 起收入改为商业赋能、金融解决方案、比特币生态三类，旧的交易收入和交易成本不再列示。
    location: 10K-FY2025，Item 1 分部与收入类别；Item 8 重分类说明
    verified: true
  - layer: source_fact
    text: FY2025 文字披露 Square 处理收入增加 541.2 百万美元，但没有给出当年水平。
    location: 10K-FY2025，MD&A 收入讨论
    verified: true
  - layer: source_fact
    text: 交易损失是单独的费用项，FY2024 为 198.0 百万美元，FY2025 为 202.0 百万美元，不在营业成本里。
    location: 10K-FY2025，MD&A 交易、贷款及消费者应收款损失表
    verified: true
  - layer: source_fact
    text: 业绩信披露 Square 商业赋能（不含硬件）货币化率，但只有 Q4 2024 到 Q4 2025 五个季度，且是毛利口径。
    location: 8K-Q425，Square 季度指标表及脚注 20
    verified: true
  - layer: source_fact
    text: 卖家笔数披露为 FY2023 4.0、FY2024 5.2、FY2025 5.9 十亿笔，都是 Item 1 里的取整文字。
    location: 10K-FY2023、10K-FY2024、10K-FY2025，Item 1 Square 卖家
    verified: true

causal_mechanism:
  - layer: author_judgment
    text: 管理层说 FY2024 交易收入增长与 GPV 增长大致同步，FY2025 Square 处理成本增长与 Square GPV 增长同步。
    location: 10K-FY2024 与 10K-FY2025，MD&A
    verified: true
  - layer: ai_inference
    text: FY2022 到 FY2024，抽成率和成本率以相近幅度同步下降，所以单位贡献基本持平，毛利增长几乎全部来自交易额。
    location: ""
    verified: false

analytical_method:
  - layer: own_extension
    text: 用 unit-economics-take-rate 方法卡第 3、4 步计算；公式写在 method_output.attribution_formula。
    location: ""
    verified: false

assumptions:
  - layer: own_extension
    text: 用合并交易收入和成本除以合并 GPV。成本没有分部数字，所以不能算纯 Square 的单位贡献。
    location: ""
    verified: false
  - layer: own_extension
    text: FY2025 估算假设“Square 处理收入”等于旧口径的 Square 交易收入。申报没有说明两者相同。
    location: ""
    verified: false

valuation_logic: []
counterarguments: []

falsification:
  - layer: own_extension
    text: 如果公司披露新旧分类的对照表，且 FY2025 的 Square 处理收入不能这样衔接，下面的估算就要作废。
    location: ""
    verified: false

transferability:
