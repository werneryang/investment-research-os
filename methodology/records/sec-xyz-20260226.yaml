method_output:
  unit: "金额为百万美元，比率为 bps（占 GPV）"
  attribution_formula: >-
    毛利变化 = 交易额贡献 + 抽成率贡献 + 成本率贡献。
    交易额贡献 = (V1 − V0) × (t0 − c0)；抽成率贡献 = V1 × (t1 − t0)；成本率贡献 = −V1 × (c1 − c0)
  disclosed:
    - {period: 2022FY, total_gpv: 203536, transaction_revenue: 5701.540, transaction_cost: 3364.028}
    - {period: 2023FY, total_gpv: 227699, square_gpv: 209606, cash_app_gpv: 18093, transaction_revenue: 6315.301, square_transaction_revenue: 5817.125, transaction_cost: 3702.016}
    - {period: 2024FY, total_gpv: 240812, square_gpv: 227607, cash_app_gpv: 13205, transaction_revenue: 6613.680, square_transaction_revenue: 6260.981, transaction_cost: 3881.013, transaction_losses: 198.010}
    - {period: 2025FY, total_gpv: 259631, square_gpv: 250461, cash_app_gpv: 9170, transaction_revenue: null, transaction_cost: null, transaction_losses: 202.014}
  derived:
    - {period: 2022FY, take_rate_bps: 280.1, processing_cost_bps: 165.3, unit_contribution_bps: 114.8}
    - {period: 2023FY, take_rate_bps: 277.4, processing_cost_bps: 162.6, unit_contribution_bps: 114.8}
    - {period: 2024FY, take_rate_bps: 274.6, processing_cost_bps: 161.2, unit_contribution_bps: 113.5, transaction_loss_bps: 8.2, after_loss_bps: 105.3}
  growth_attribution:
    - {from: 2022FY, to: 2023FY, gross_profit_change: 275.8, volume: 277.5, take_rate: -63.1, cost_rate: 61.4}
    - {from: 2023FY, to: 2024FY, gross_profit_change: 119.4, volume: 150.5, take_rate: -65.3, cost_rate: 34.2}
  estimates:
    - metric: square_take_rate_bps
      period: 2025FY
      value: 271.6
      estimate: true
      note: (6260.981 + 541.2) ÷ Square GPV 250461；依赖上面的口径假设，不与披露值并列使用
  not_available:
    - FY2025 的交易收入、交易成本，因此 FY2024 到 FY2025 无法做增长归因
    - 纯 Square 的交易成本
    - 第三方处理费、自有处理成本的拆分
    - 自有处理比例
  checks:
    - 2022–2024 财年的交易收入与成本已和本地 FSDS 的 ProductOrService=Transaction 事实逐值一致
    - Square GPV 与 Cash App GPV 之和等于合并 GPV（FY2023–FY2025）
  open_questions:
    - 笔数从 4.0 跳到 5.2 十亿笔，同期 Square GPV 只增长约 9%，隐含平均金额由约 52 美元降到约 44 美元；申报没有解释，暂不用于价量拆分
    - 业绩信提到 2025 年二季度收到一笔卡组织补偿款和一项处理流程调整，金额未在已读段落中出现，会影响当年比率
