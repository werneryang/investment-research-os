  reproducibility:
    input_selection: Pin SEC accession/original statement for income attribution. For additional annual balance facts,
      use units USD, matching instant date, 10-K/10-Q only, latest filed before cutoff; provenance retained per value.
      Do not select nonperiodic facts or generic NI tags blindly.
    quarter_formula: Statement Q3/Q2/Q1 income is directly disclosed; Q4=FY-9M. Cash flow single quarters = differences
      of cumulative statements.
    ratio_formula: Growth=(current/prior-1)*100; margin=value/revenue*100; margin differences in percentage points;
      contribution pp=product delta/prior total revenue*100.
    snapshots: All downloaded input hashes/URLs above; original temporary data not committed. No external dataset
      version or study run fabricated.
  verification:
    independent: Separate temporary read-only verifier independently selected original SEC statements and rederived
      quarter revenue/margin/cash flow/NI, balance, tariff, SpaceX and SBC items. Agreed with lead separately provided
      quarter amounts; no material discrepancy.
    limitations: Same original issuer disclosures, not an audit. Independent review confirmed quarterly figures, five
      annual DuPont/CCC years, actual quarter day counts, Q4/cumulative differences and historical capex vintages.
      It identified small historical-vs-latest cash-PPE comparative differences, recorded separately. Final YAML,
      numerical identities, eligible periodic filings including amendments and public-boundary checks passed.
    tests: No code changed, no pytest required. Documentary numerical assertions and YAML parsing used.
    publication: No commit, push, PR, merge or site deployment; only new walkthrough authorized.
