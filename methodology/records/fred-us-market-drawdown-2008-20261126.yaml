# ---- 技术复核（2026-11-26）----
# 复核在另一个会话里做，复核者没有参与本记录的执行；与执行者是同一模型，不算独立人员复核。上面的内容不改写，更正以本节为准。
technical_review:
  reviewed_on: "2026-11-26"
  reviewer: "Claude Code（Opus 5.5），investment-research-os 会话"
  scope: "事实核对（数值、时点、版本）；语义核对（层级推导是否照卡的步骤，证据撑不撑得住结论）；定性文献正文核对（此前只核了书目）。"
  human_review: "未做；可选。"
  fact_check:
    recompute: "用缓存以 --offline 重算，汇总值文件与入库版本逐字节相同。"
    numbers: "第一次执行与重跑两部分写出的全部数字，逐个对到同一事件的汇总值（或本机 French 对照、补充数据算出的比值）；按记录写的小数位四舍五入后全部对上。"
    against_fred: "抽查 7 个日度值（DGS10、BAA10Y、DFII10、VIXCLS、VXVCLS）向 FRED 现取，与缓存相同；脚本写的 4 个 ALFRED 首个版本日（STLFSI4、DTWEXBGS、NFCI、DEXJPUS）与 FRED 现查一致。"
    point_in_time: "2008 年早于所有周度序列的 ALFRED 首个版本，全部标 post_hoc_vintage，属实；没有可按当日版本核的值。日度序列取观测日不晚于时点。"
    not_checked:
      - "补充数据（黄金、ETF 净值、FINRA 保证金债务）只核到记录与脚本从本机文件算出的值一致，没有核本机文件与发行方原件是否一致。"
      - "事件首次报导日按复核者所知的史实核对，没有逐条查当日报导。"
  semantic_check:
    - "第 4 层的判定有依据：雷曼破产、货币基金跌破面值，Baa 与 TED 利差在 1986 年以来最高区间。第一次执行凭卡外的实质利率判 10-10 的第 3 层，重跑已按卡改掉（黄金在涨）。"
    - "重跑里第 2 步的处理前后不一：09-19 防御三只在 SPY 下跌日全部跟跌（比值 0.66），layer_now 只列 [4]；10-10 同样的读数（比值 0.72，86% 跟跌）却据此列入第 2 层。卡的第 2 步只说一起跌就性质变了，没分第 2 还是第 3 层，10-10 指定为第 2 层是执行者的选择。第 4 层的结论不受影响。"
  literature_check:
    source: "Financial Crisis Inquiry Commission, The Financial Crisis Inquiry Report（GPO 官方版 PDF，663 页，取文字层读结论和相关章节）"
    limit: "这份 PDF 的文字层丢了全部数字，只核了定性表述，没有核报告里的数字。"
    supports:
      - "委员会结论（PDF 第 17 页起）：大型机构资产负债表不透明、互相牵连，使信用市场冻结，交易停顿，股市暴跌。"
      - "第 20 章「Crisis and Panic」（PDF 第 382–400 页）：雷曼破产后 Reserve Primary 货币基金跌破面值并遭挤兑；连评级最高的公司也发不出商业票据；对冲基金从大券商的主经纪业务撤走资产；Wachovia 失去批发融资。即真有违约、放款人全面收缩，是第 4 层。"
      - "PDF 第 324–327 页：联储担心三方回购抵押品被抛售、贷款人挤兑，属强制卖出与流动性层。"
      - "PDF 第 279–280 页：2007 年 8 月法国巴黎银行暂停三只基金赎回，报告把它写成危机的敲钟时刻。这支持记录里“早于股市见顶、是起点候选”的说法（G31）。"
    cuts_against: []
    verdict: "支持走到第 4 层的预期，也支持起点在信用层、早于股市见顶。"
  corrections: []
  open_for_user:
    - "重跑 09-19 与 10-10 的第 2 步怎样统一：都按第 2 步列入第 2 层（09-19 改为 [2, 4]），或都不列（10-10 改为 [4]）。复核者倾向前者，因为两处读数相同。"
  result: pass_with_notes
