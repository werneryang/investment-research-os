method_output:
  unit: 金额为百万美元（每股收益为美元）；比率为小数，利润率和占比为百分数，周转为天
  periods:
    annual: FY2022–FY2026（期末 2022-09-01、2023-08-31、2024-08-29、2025-08-28、2026-09-03）；平均余额另用到 FY2021 期末（2021-09-02）
    quarterly: FQ4-25、FQ1-26、FQ2-26、FQ3-26、FQ4-26（期末 2025-08-28、2025-11-27、2026-02-26、2026-05-28、2026-09-03）；同比另用到 FQ4-24 至 FQ3-25
    latest_available: 截至 2026-11-14，最新的定期报告是 FY2026 10-K（2026-10-09 申报）；FQ1-27 尚未公布
  classification_terms: [已完成, 因数据不足未执行, 需人工判断]
  provenance_terms:
    material: 卡里写有材料来源
    added: 卡里标为整理时补充
    ad_hoc: 执行时临时定的

  walkthrough:
    - card: dupont-return-decomposition
      reached: 第 1、3 步都走完（第 3 步只做历史年份）
      first_guess: {step: 3, what: 平均余额怎样算, note: 第 1 步在本例不需要猜}
      steps:
        - step: 1
          did: 三因子分解
          classification: 已完成
          provenance: {material: [三因子公式], added: [], ad_hoc: [净利润与权益取 GAAP 归属母公司口径]}
          guesses:
            - what: 余额用期末还是平均
              status: 不算猜。所需数据一栏两种都列了，第 3 步写明用平均值，照第 3 步做
            - what: 净利润、权益含不含少数股东，GAAP 还是非 GAAP
              options: [GAAP 归属母公司, 含少数股东, 非 GAAP 净利润]
              chosen: GAAP 归属母公司
              impact: 本例没有少数股东，前两种没有差别；非 GAAP 净利润只在新闻稿里有，未使用
        - step: 3
          did: 五个财年并列，余额取平均
          classification: 已完成
          provenance: {material: [多年并列, 余额用平均值], added: [], ad_hoc: [平均 = 年初年末两点平均, 多取 FY2021 期末余额, 53 周财年不折算]}
          guesses:
            - what: 平均值怎样算
              options: [年初年末两点平均, 五个季末平均]
              chosen: 年初年末两点平均
            - what: 首年的平均余额需要再往前一年的期末余额，超出“最近 5 个财年”
              options: [多取一年期末余额, 首年改用期末余额, 首年不算]
              chosen: 多取一年期末余额
            - what: 净利润为负的年份（FY2023）
              status: 三个因子照算，净利率和 ROE 为负；怎样读属于范围外的第 4 步
      not_in_scope: 预测年、ROIC 版本、同业比较、变化原因
    - card: working-capital-forecast
      reached: 第 1、2 步走完；第 3 步算出了与自身上年的差异，找原因没有做
      first_guess: {step: 1, what: 用期末还是平均余额；同一步还要定应收、应付取哪一行，以及一年按多少天}
      steps:
        - step: 1
          did: 应收对营收、存货和应付对销货成本，换成天数
          classification: 已完成
          provenance: {material: [应收对销售, 存货和应付对销货成本, 换成天数], added: [], ad_hoc: [期末余额, 资产负债表表面行, 365 天, 用年度数据]}
          guesses:
            - what: 期末还是平均余额
              options: [期末余额, 年初年末平均]
              chosen: 期末余额
              impact: 见 sensitivity.average_balance
            - what: 应收、应付取哪一行
              options: [资产负债表表面行（应收合计、应付账款及应计费用）, 附注里的贸易应收与贸易应付]
              chosen: 资产负债表表面行
              impact: 差别很大，见 sensitivity.trade_lines；FY2026 应付天数 321 对 50，现金周期 −75 对 +185
            - what: 一年按多少天
              options: [365, 期间实际天数（FY2026 为 371）]
              chosen: 365
            - what: 用年度还是季度数据
              options: [年度, 季度年化]
              chosen: 年度
        - step: 2
          did: 营业周期 = 收款天数 + 存货天数；现金周期 = 营业周期 − 应付天数
          classification: 已完成
          provenance: {material: [两个周期的算式], added: [], ad_hoc: []}
          guesses: []
          note: 客户预付款（合同负债）不在这两步的算式里，属于范围外的第 5 步；FY2026 末 XBRL 的合同负债余额为 13,000
        - step: 3
          did: 只和自身历史比
          classification: 差异已完成；找原因需人工判断
          provenance: {material: [与历史比较并找原因], added: [], ad_hoc: [历史基准取上一年]}
          guesses:
            - what: 和哪一段历史比
              options: [上一年, 五年平均, 五年区间]
              chosen: 上一年
          note: 每项差异的原因要读管理层说明并作判断，本次不解释
      not_in_scope: 第 4–7 步的预测
    - card: earnings-quality-checklist
      reached: 第 1、5、6、7 步都有结果；第 5 步的同比原因和第 6 步的冲击影响没有做
      first_guess: {step: 1, what: 公司不披露有机增长、期间也没有收购时这一项怎样填；同一步还要定用季度还是年度}
      steps:
        - step: 1
          did: 增长来源
          classification: 已完成（按临时口径）
          provenance: {material: [检查有机与收购各占多少], added: [], ad_hoc: [没有收购现金流出时把全部增长记为有机, 用最近一季同比并附全年, GAAP 营收]}
          guesses:
            - what: 公司不披露有机增长时怎样填
              options: [没有收购现金流出就把全部增长记为有机, 记为不适用, 记为因数据不足未执行]
              chosen: 没有收购现金流出就把全部增长记为有机
              impact: 没有读 FY2026 10-K 正文确认无收购，只看了现金流量表的 XBRL 科目
            - what: 增长按哪个期间算
              options: [最近一季同比, 最近财年同比, 最近一季环比]
              chosen: 最近一季同比，附最近财年同比
              impact: FQ4-26 是 14 周，对比的 FQ4-25 是 13 周；FY2026 是 53 周
        - step: 5
          did: 最近 5 季的毛利率和营业利润率
          classification: 方向已完成；同比变化的原因需人工判断
          provenance: {material: [最近 5 季的毛利率与营业利润率方向, 同比变化的原因], added: [], ad_hoc: [GAAP 口径, 方向按逐季环比的正负记, 同比每季都算]}
          guesses:
            - what: GAAP 还是非 GAAP
              options: [GAAP, 非 GAAP（新闻稿）]
              chosen: GAAP
              impact: 两种口径 FQ4-26 毛利率 86.8 对 87.0，营业利润率 80.7 对 82.3
            - what: “方向”怎样判定
              options: [逐季环比的正负, 首尾比较, 线性趋势]
              chosen: 逐季环比的正负
          note: 同比变化归因到产品组合、成本、定价要读 MD&A 并作判断；FY2026 10-K 正文没有取，本次不解释
        - step: 6
          did: 最大终端市场占比
          classification: 占比已完成（按临时口径）；单一市场受冲击的影响需人工判断
          provenance: {material: [最大终端市场占比, 冲击影响], added: [], ad_hoc: [终端市场 = 业务单元分部, 期间取 FY2026 全年]}
          guesses:
            - what: “终端市场”用哪个口径
              options: [业务单元分部, 产品（DRAM、NAND）, 地区, 主要客户]
              chosen: 业务单元分部
              impact: 口径不同结果差别大：FY2026 最大业务单元占 32.3%，前三季最大产品占 77.1%
            - what: 取哪个期间
              options: [最近财年, 最近一季]
              chosen: 最近财年
              impact: FY2026 全年最大的是 CMBU，FQ4-26 单季最大的是 CDBU
            - what: 冲击多大、怎样传到公司
              status: 卡没有给参数，没有做
        - step: 7
          did: 经营现金流 ÷ 净利润
          classification: 已完成（按临时口径）
          provenance: {material: [经营现金流除以净利润, 是否持续低于 1], added: [], ad_hoc: [“持续”= 窗口内每一期都低于 1, 季度和年度都算, 净利润为负的年份不计比值]}
          guesses:
            - what: “持续”指几期
              options: [窗口内每一期, 连续两期及以上, 多数期间]
              chosen: 窗口内每一期
              impact: 选“连续两期及以上”结果会由否变为是（FQ2-26、FQ3-26 连续低于 1）
            - what: 净利润为负时比值怎样处理
              options: [不计比值, 照算并标注]
              chosen: 不计比值
            - what: 按季度还是年度
              options: [季度, 年度, 两者]
              chosen: 两者
      not_in_scope: 第 2、3、4、8 步和第 9–11 步
    - card: guidance-tracking-playbook
      reached: 第 1–3 步都走到；第 3 步只标了实际值相对区间的位置，达成与否的判定是临时规则
      first_guess: {step: 1, what: 检查日怎样定；同一步还要定 GAAP 与非 GAAP 两套指引登记哪一套}
      steps:
        - step: 1
          did: 登记六份新闻稿指引表里的全部量化指引，共 48 条
          classification: 已完成
          provenance: {material: [按“谁、何时、数值、指标、检查日”登记], added: [区间同时记中点], ad_hoc: [检查日 = 下一份业绩新闻稿的发布日, GAAP 与非 GAAP 都登记, 只登记新闻稿指引表]}
          guesses:
            - what: 检查日怎样定
              options: [实际值首次公布日, 对应 10-Q 或 10-K 的申报日, 目标期末日]
              chosen: 实际值首次公布日（下一份业绩新闻稿）
            - what: 两套口径登记哪一套
              options: [都登记, 只登记 GAAP, 只登记非 GAAP]
              chosen: 都登记
            - what: 约数指引（不带区间）算不算已量化
              options: [算，按点值登记, 不登记]
              chosen: 算，按点值登记
          note: 电话会讲稿和演示材料里的其他指引（资本开支等）没有取，不在登记范围
        - step: 2
          did: 确认每个指标能用官方数据核对
          classification: 已完成（按临时口径）
          provenance: {material: [], added: [口径确认整步], ad_hoc: [非 GAAP 实际值以公司 8-K 新闻稿为准, GAAP 营业费用 = 毛利 − 营业利润]}
          guesses:
            - what: 非 GAAP 实际值只在公司自己的新闻稿里，算不算“官方数据”
              options: [算（8-K 是申报文件）, 不算，记为无法核对]
              chosen: 算
            - what: GAAP 营业费用没有对应的 XBRL 科目
              options: [毛利减营业利润, 取新闻稿列示值]
              chosen: 毛利减营业利润（与新闻稿列示值一致）
        - step: 3
          did: 已到期的 40 条取实际值并标位置；未到期的 8 条留空
          classification: 位置已完成；达成与否需人工判断
          provenance: {material: [], added: [到期核对整步, 三种标记], ad_hoc: [区间内 = 达成，区间外 = 未达成并注明方向, 约数指引只记差值不判定]}
          guesses:
            - what: 怎样算达成
              options: [落在区间内, 不低于下限（费用为不高于上限）, 与中点比]
              chosen: 落在区间内
              impact: 32 条区间指引里 29 条实际值高于上限，按这条规则都记为未达成；换成第二种规则，营收、毛利率、每股收益的 26 条会变成达成
            - what: 约数指引没有区间，怎样判定
              options: [不判定只记差值, 自定容差, 按四舍五入位数]
              chosen: 不判定只记差值
            - what: 实际值取几位小数
              options: [新闻稿列示精度, XBRL 精确值]
              chosen: 新闻稿列示精度
      not_in_scope: 第 4、5 步的统计和反馈；定性承诺

