    因数据不足未执行:
      - 没有哪一个范围内步骤整步落在这一类
      - 局部：FY2026 10-K 正文和分部事实本地没有（FSDS 2026q4 未发布），第 6 步的全年分部改用季报加新闻稿拼出
      - 局部：新闻稿指引表之外的指引（电话会讲稿、演示材料）没有取
    需人工判断:
      - working-capital-forecast 第 3 步的差异原因
      - earnings-quality-checklist 第 5 步的同比变化原因，第 6 步的冲击影响
      - guidance-tracking-playbook 第 3 步的达成判定规则，以及约数指引的判定

  handover_gaps:
    - “所需数据”只写到科目类别。应收、应付取报表表面行还是附注里的贸易项，卡和交接都没有写，而这一处对结果影响最大。
    - 没有写每张卡用年度还是季度。题目只给了“5 个财年、5 个季度”，哪张卡用哪种由下游定；平均余额和同比还各要多取一期，超出题目写的期间。
    - 没有写 GAAP 还是非 GAAP，第 3、4 张卡都碰到。
    - 没有写财年不按日历年、53 周财年、14 周季度怎样处理，也没有写单季数字要推算时（第四季度）能不能用。
    - 只交 id、提交号、步骤编号和所需数据不够执行。判定一步的出处要读卡里的来源说明、判断规则和待补充，等于要能读到私有库的全文；公开的下游记录因此无法单独复核。
    - 出处的三分法在卡里是按段落写的，不是按步骤或参数标的；第 3 张卡注明清单各项并非都由来源逐项列出，下游分不清哪一步有材料来源。
    - 三类归类按整步用不够细。多个步骤是“计算做完、原因或判定要人工判断”，本记录只能拆成半步来归类。
    - 第 4 张卡的三种核对标记放不下“实际值高于区间上限”和“约数指引”两种情况。
    - 第 4 张卡的输出是一家公司一个登记文件。本项目 ../playbooks/ 的说明指向本目录的旧卡，登记该落在哪里没有约定，本次只写在本记录里。
    - 本项目 ../methods/ 里有两张同名旧卡（earnings-quality-checklist、guidance-tracking-playbook），links.methods 只写 id 会分不清指哪一份，本记录加了 library 字段。
    - 试点取数没有登记来源和数据集，原始文件不在版本存储里，这次执行不能用 iros 命令复现；交接没有约定试点的原始文件放哪里。

