limitations:
- No Apple procurement share, ranking or exclusivity can be inferred from supplier revenue concentration.
- OEM end-customer attribution through intermediaries does not imply direct billing to Apple.
- Broadcom anonymous share cannot be mapped to Apple. Qualcomm named threshold does not map Apple to anonymous numeric
  row.
- Annual percentages are rounded as disclosed and do not identify individual component or device revenues.
- No valuation, investment conclusion, personal position or trading instruction.
