    notes: >-
      市场因子 Mkt-RF 加 RF 即美国股票市场的月度总收益（价值加权，含分红）；RF 在 202406 之前取自 Ibbotson，
      之后为 ICE BofA 1 个月国库券指数。数值为百分比，缺失写作 -99.99 或 -999
    next_step: 按研究需要登记日度因子或更细的行业组合
    verification:
      - dataset: french_ff3
        status: access_verified
        date: "2026-10-23"
        evidence: >-
          取得 F-F_Research_Data_Factors（CRSP 202608）：1926-07 至 2026-08 共 1202 个月 × 4 列全部合格，无缺月
          （版本 v20261023T224136Z-97921212）。月度复利与文件自带年度表在 1927–2025 年逐年一致（最大差 0.04 个百分点，
          为四舍五入）；近三个月 RF 年化约 3.6%，与联邦基金利率 3.88% 相称
        scope: 月度表（文件第一段）；年度表不读入
      - dataset: french_ff5
        status: access_verified
        date: "2026-10-23"
        evidence: >-
          取得 F-F_Research_Data_5_Factors_2x3（CRSP 202608）：1963-07 至 2026-08 共 758 个月 × 6 列全部合格
          （版本 v20261023T224136Z-dc32763b）。RF 与三因子文件完全一致；Mkt-RF 在 167 个月有差异，最大 0.08 个百分点，
          分布在各年代，可能是两个文件的市场因子样本略有不同（原因未核实）。需要市场收益时以三因子文件为准
        scope: 月度表（文件第一段）
      - dataset: french_mom
        status: access_verified
        date: "2026-10-23"
        evidence: 取得 F-F_Momentum_Factor（CRSP 202608）：1927-01 至 2026-08 共 1196 个月全部合格（版本 v20261023T224137Z-a7da223f）
        scope: 月度表（文件第一段）
      - dataset: french_ind12_vw
