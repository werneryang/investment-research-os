# 来源登记与资源目录（docs/architecture.md §5）
#
# 本文件是免费资源的唯一索引：已接入的来源与候选来源都登记在这里，网站的资源目录页（sources.html）
# 与 `iros sources` 由它生成。不另写手工维护的资源清单。
#
# 核验状态按「来源 × 数据集 × 用途」分别记录：
#   candidate        候选来源：只有资料入口（没有核验记录即为候选）
#   docs_verified    说明已核验：已阅读官方说明，不代表程序接入成功；可以不指明 dataset，表示来源整体的说明
#   access_verified  接入已验证：指定获取方式和样本取得成功；必须指明 dataset
#   use_verified     用途已验证：在明确范围内通过相应研究要求；必须指明 dataset 并声明 use，
#                    且只对该用途有效（descriptive | point_in_time）；
#                    valid_from / valid_through 为核验覆盖的观测日期（含两端，可省略一端）
# 说明与接入核验对数据集整体有效；scope 写明核验覆盖的范围。
# 一个样本下载成功不代表整个来源可用。新增核验请追加记录，不改写旧记录。
#
# 字段：
#   必填            id、publisher、url、category；name 为目录中显示的短名称（默认用 publisher）
#   §5.1 字段       channel、license、registration、rate_limit、revisions、maintenance；
#                   候选来源可以暂缺，在 datasets.yaml 登记数据集（开始接入）前必须补齐
#   索引字段        directions  可服务的研究方向（site/content.yaml 的方向 id）
#                   access      api 接口 | file 文件下载 | tool 第三方工具 | web 网页资料 | manual 人工导入
#                   signup      none 无需注册 | free_key 免费注册或 key | unknown 未核验
#                   redistribution  allowed 可公开再分发 | per_series 按序列确认 | restricted 不可 | unknown 未核验
#                   coverage    历史与频率覆盖；offers 可提供、尚未登记为数据集的数据
#                   notes       依据与限制；next_step 下一步核验或接入工作
# 候选来源的索引字段是资料入口上的初步判断，未经核验，网站上会标明。
# verification 放在每个来源的最后（iros calendar apply 在来源块末尾追加记录）。

categories:
  macro: 宏观与历史修订
  rates: 美国国债曲线
  filings: 公司申报与财报
  funds: 基金资料
  prices: 证券行情
  factors: 学术因子与估值
  global_macro: 全球宏观
  china: 中国宏观与证券
  surveys: 调查与模型估计
  manual: 人工导入

# 能力缺口：在取得并验证适用的免费数据之前，不承诺相应的完整历史研究能力（architecture §5.2）
gaps:
  - name: 完整历史期权链
    directions: [vol_premium]
    detail: 只能做明确标记的理论分析或有限样本研究；隐含波动率指数不等于期权链
  - name: 逐笔成交与订单簿
    directions: [vol_premium, global_assets]
    detail: 不研究日内微观结构与流动性冲击
  - name: 历史指数成分
    directions: [equity_risk, sector_structure]
    detail: 没有成分变化记录时，指数层面的回测有幸存者偏差
  - name: 退市证券
    directions: [equity_risk, company_filings, sector_structure]
    detail: 只用现存证券会产生幸存者偏差，相关结论须注明
  - name: 免费、可核验的信用利差历史
    directions: [credit_premium]
    detail: 尚未找到；FRED 上的信用利差序列涉及第三方权利，可得历史长度待核验

sources:
  - id: ust_treasury
    name: Treasury 利率数据
    publisher: U.S. Department of the Treasury
    channel: home.treasury.gov 每日利率数据 CSV 按年下载
    url: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rate-archives
    license: 美国联邦政府发布信息；以官网条款为准，再分发前另行确认
    registration: 无需注册或 key
    rate_limit: 未公布；本项目串行请求，失败有界重试
    revisions: 按日发布，偶有更正；官网不提供历史版本，本地以快照保存
    maintenance: 期限列会随发行变化（如 2022 年新增 4 Mo、2025 年新增 1.5 Month），解析按列名识别
    alternatives: [fred_graph]
    category: rates
    directions: [us_treasury_curve, rates_duration_risk, real_bonds]
    access: file
    signup: none
    redistribution: allowed
    coverage: 名义票面收益率曲线 1990 年起，日度；期限列随年份变化
    offers:
      - 实际票面收益率曲线（TIPS）
      - 国库券利率与长期平均利率
    notes: 公开存档已于 2026-10-22 经用户确认；官网不提供历史版本
    next_step: 按年核验预期发布日历，延长用途核验范围
    verification:
      - dataset: ust_par_yield_curve
        status: docs_verified
        date: "2026-10-22"
        evidence: 官方档案页说明 CSV 档案及 XML 入口
      - dataset: ust_par_yield_curve
        status: access_verified
        date: "2026-10-22"
        evidence: 2019、2024、2025 年 CSV 样本取得成功；列结构随年份不同
        scope: 程序化按年下载日度票面收益率曲线
      - dataset: ust_par_yield_curve
        status: use_verified
        use: descriptive
        date: "2026-10-23"
        # 核验覆盖的观测日期；研究期间超出时显示为「部分在范围内」
        valid_from: "2024-01-01"
        valid_through: "2026-10-22"
        evidence: >-
          基线运行 ust_curve_2024-20261022T225910Z-1121d74b（代码 5c922ef，改写作者前为 f66ecca，dirty=false）：
          预期观测日 250/250，关键期限覆盖 100%，原始快照抽查 12/12 一致，与 FRED DGS10 的 250 个共同日期一致
          （同源，只证明接入与解析正确），iros verify 以固定输入重算结果校验值 9937d7eb… 一致。
          独立审查（2026-10-22，reports/reviews/2026-10-22-p1-p2-review.md，未入库）用标准库 CSV 与 Decimal
          直接从原始快照重算：250 个观测日，10Y 3.95% → 4.58%，2s10s 严格倒挂 166 日、零利差 3 日；
          审查发现的 F1–F9 已修复并有反例测试；预期发布日历与 2024 年至 2026-10-22 的实际发布日逐日一致。
          2026-10-23 经用户确认登记。
        scope: >-
          名义票面收益率曲线的期间描述：关键期限水平、利差（长端 − 短端）、蝶式曲率与倒挂天数，
          使用最新修订数据；观测日期 2024-01-01 至 2026-10-22（预期日历核验范围）。不包括时点研究、
          持有期或债券基金回报、预测与交易回测；核验范围之外的日期须先扩展日历核验。

