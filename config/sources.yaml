    next_step: 按研究需要登记各国股权风险溢价等表格
    verification:
      - dataset: damodaran_histret
        status: access_verified
        date: "2026-10-23"
        evidence: >-
          取得 histretSP.xls「Returns by year」：1928–2025 年 × 7 个序列共 686 个值全部合格（版本 v20261023T235157Z-864ffa5e）。
          由数据重算的 1928–2025 算术平均与表中汇总行完全一致；几何平均除小盘股外完全一致——表中小盘股的「$100 价值」列未逐年复利，
          其几何平均（0.16%）有误，年度回报本身不受影响。标普 500 与 French 数据库的 CRSP 市场年度总收益相关系数 0.990（指数不同，
          单年差异最大 7.2 个百分点）；3 个月国库券与 FRED DTB3 年均值相关系数 0.9995，差异不超过 0.49 个百分点。
          表内说明核实：债券回报由收益率重新定价推算，国库券为年内平均利率，房地产为 Case-Shiller 房价变化（不含租金）
        scope: 年度回报表的七个序列；「$100 价值」与平均值汇总不读入

