    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
    license: 文件带「Copyright Eugene F. Fama and Kenneth R. French」声明，未见再分发许可；只在本地使用，不进公开存档
    registration: 无需注册或 key
    rate_limit: 未公布；本项目串行请求，失败有界重试
    revisions: 只有当前版本；随 CRSP 数据库更新与方法调整整体重算，文件头注明所用 CRSP 数据库月份
    maintenance: 通常每月更新，滞后约一至两个月；版式变化时按表头核对报错（params.columns）
    alternatives: []
    category: factors
    directions: [equity_risk, sector_structure, portfolio]
