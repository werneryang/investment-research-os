# 第二类研究：情景模拟。检验门户能否承载与描述性曲线研究不同的成果与证据。
study_id: ust_par_bond_rate_risk
title: 假设平价国债的利率敏感性情景
question: >-
  以最近一个交易日的美国国债票面收益率构造假设平价债券，收益率平移时价格如何变化？
  久期与久期 + 凸性近似相对完整重新定价的误差有多大？
result_type: simulation
branch: par_bond_scenarios

scope:
  market: US
  currency: USD
  # 在窗口内取所有期限同时有值的最后一个曲线日作为基准日；日期在运行时换算并写入清单
  start: today-14d
  end: today
  frequency: daily
  vintage_policy: latest

data:
  curve: ust_par_yield_curve

method:
  # 只用有票息的期限：1 年以下为贴现型国库券，不适合按平价票息债券处理
  tenors: [2Y, 5Y, 10Y, 30Y]
  coupon_frequency: 2
  shocks_bp: [-200, -100, -50, -25, 25, 50, 100, 200]
  # 有效久期 / 凸性的有限差分步长，用于独立核对解析值
  finite_difference_bp: 1

benchmark: 完整重新定价（按冲击后收益率贴现全部现金流）
evaluation:
  - 平价债券价格等于面值
  - 解析修正久期与平价债券封闭解一致
  - 解析久期、凸性与有限差分重新定价一致
  - 固定数据版本可重现（iros verify）

limitations:
  - 假设债券：票息等于基准日票面收益率、恰在付息日估值、无应计利息；不是任何真实国债或债券基金（如 TLT）的风险
  - 冲击施加在每只债券自身的收益率上（平移），不是对整条曲线的一致重定价；票面收益率不等于零息利率
  - 冲击幅度是假设情景，不代表概率或预测
  - 只计算价格变化，不含持有期票息收入、再投资与融资成本
