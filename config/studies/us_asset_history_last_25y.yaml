# 描述与比较：最近 25 个完整年度的滚动研究（docs/study-long-run-assets.md）
study_id: us_asset_history_last_25y
title: 美国主要资产的回报与风险（最近 25 年）
question: 最近 25 个完整年度，美国主要资产的回报、风险与相关性如何？与 1928 年以来的长期情况有何不同？
result_type: descriptive
branch: asset_history
scope: {market: US, currency: USD, start: today-26y, end: today, frequency: annual, vintage_policy: latest}
data:
  annual: damodaran_histret
  cpi: {dataset: fred_cpiaucsl, required: false}
  monthly_market: {dataset: french_ff3, required: false}
  long_real: {dataset: shiller_real, required: false}
  tbill_check: {dataset: fred_dtb3, required: false}
method:
  assets: [SP500, SMALLCAP, TBOND10Y, BAA, TBILL3M, REALESTATE, GOLD]
  real_start_year: 1948
  last_n_years: 25
  # 最近 25 个完整年度（数据为年度，不截断年份）
  periods: []
  period_shift_years: 5
  rolling_years: 20
benchmark: 3 个月国库券（风险溢价的基准）
evaluation: [由数据重算的平均与原表汇总一致（接入核验）, 标普 500 与 CRSP 市场年度回报相关 ≥ 0.98, 国库券与 FRED DTB3 年均值差异 ≤ 0.5 个百分点, 月度最大回撤不浅于年度, 固定数据版本可重现（iros verify）]
limitations:
  - 只描述美国历史；美国是事后表现最好的市场之一，存在幸存者偏差，不代表其他市场或未来
  - 债券回报由收益率推算，不是指数实际持有回报；房地产为房价变化，不含租金；黄金在 1971 年以前价格基本固定；国库券回报为年内平均利率
  - 不含交易成本、税负与管理费；年度数据低估年内回撤
  - 实际回报从 1948 年起（CPI 12 月对 12 月）；相关系数只描述线性同向程度，样本只有几十个年度观测
  - 历史统计不是预测，也不是配置建议
