# 公司季度财报研究（docs/study-earnings.md）。首例为 Alphabet 2026 年第三季度，页面结构参照 company_alphabet 的年度研究
study_id: earnings_googl_2026q3
title: Alphabet：2026 年第三季度财报研究
question: >-
  Alphabet 2026 年第三季度的收入、利润率、分部经营、现金流与资本开支相对去年同期和上一季度如何变化？
  这些变化在多大程度上可以直接比较？哪些部分发行人没有披露，所以不能下结论？
result_type: descriptive
branch: earnings_quarter

scope:
  market: US
  currency: USD
  # 五个季度：2025 年第三季度（含）至 2026 年第三季度
  start: 2025-07-01
  end: 2026-09-30
  frequency: quarterly
  vintage_policy: latest

data:
  evidence: earnings_evidence

method:
  earnings: googl_2026q3

benchmark: 数值只来自登记的公司申报原文（10-Q、10-K、8-K 附件 99.1）；不使用媒体报道、电话会或行情数据
evaluation:
  - 登记的每个数值出现在所引原文中，原文 SHA256 固定
  - 会计恒等式成立：收入由产品线合成、分部营业利润合计等于营业利润、营业利润加其他收支等于税前利润、税前利润减所得税等于净利润
  - 经营现金流减资本开支等于发行人披露的自由现金流
  - 固定证据包版本可重现（iros verify）

limitations:
  - 全部为报告口径，不是有机增长：发行人没有披露 TPU 系统销售以及 Wiz、Intersect 并购的收入与利润贡献，也没有只含经常性服务的 Cloud 利润率
  - 2025 年第四季度由全年数减前三季度比较数推出，与当时新闻稿的直接季度值有 100 万美元的收入差异，原因未确定
  - 去年同期含约 35 亿美元的欧盟相关费用，本期有约 52 亿美元的罚款现金支付，属于不同事项；权益证券损益使各季度净利润不可直接比较
  - 剔除权益证券损益与去年罚款的算术只是税前示意，不是正常化盈利，也不是预测
  - 收入积压订单自 2026 年第一季度起口径扩大，没有同口径的同比增速
  - 没有处理业绩电话会（逐字稿的使用条款未核清）、行情反应、估值与历史预期
  - 数值出现在原文中是存在性检查，不证明取自正确的行列；没有逐条人工审阅原文
  - 不判断经营质量好坏，也不作投资建议
