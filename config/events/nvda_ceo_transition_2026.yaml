# kind：context 事件前的状态；related 同一时期的其他高管变动（不是同一事件）；event 事件本身；scheduled 公司已公布、尚未发生的日程
facts:
  - id: f_huang_tenure
    date: "2026-02-20"
    kind: context
    document: doc_nvda_10k_fy2026
    locator: Part I, Information About Our Executive Officers
    excerpt: >-
      Jen-Hsun Huang co-founded NVIDIA in 1993 and has served as our President, Chief Executive Officer, and a member of the
      Board of Directors since our inception.
    statement:
      zh: 年报所列截至 2026 年 2 月 20 日的高管：黄仁勋 1993 年共同创立 NVIDIA，自公司成立起任总裁、首席执行官和董事
      en: "Executive officers as of 20 February 2026: Jen-Hsun Huang co-founded NVIDIA in 1993 and has been President, CEO and a director since its inception"
  - id: f_puri_retire
    date: "2026-06-28"
    kind: related
    document: doc_nvda_8k_20260628
    locator: Item 5.02(b)
    excerpt: >-
      On June 28, 2026, Ajay K. Puri, Executive Vice President, Worldwide Field Operations of NVIDIA Corporation, or the
      Company, notified the Company of his intention to retire from his role effective upon the employment commencement date
      of his successor.
    statement:
      zh: 全球销售执行副总裁 Ajay K. Puri 通知公司，将在继任者入职时退休
      en: Ajay K. Puri, EVP of Worldwide Field Operations, notified the company that he will retire when his successor starts
  - id: f_parker_appointed
    date: "2026-07-01"
    kind: related
    document: doc_nvda_8k_20260628
    locator: Item 5.02(c)
    excerpt: >-
      On July 1, 2026, the Company appointed Nicholas Parker, age 55, as Executive Vice President, Worldwide Field Operations
      of the Company, effective upon the commencement of his employment with the Company, which is anticipated to be on
      August 24, 2026.
    statement:
      zh: 公司任命 Nicholas Parker 为全球销售执行副总裁，预计 2026 年 8 月 24 日入职
      en: The company appointed Nicholas Parker as EVP of Worldwide Field Operations, expected to start on 24 August 2026
  - id: f_huang_resigns
    date: "2026-11-11"
    kind: event
    document: doc_nvda_8k_20261111
    locator: Item 5.02
    excerpt: >-
      On November 11, 2026, the Board of Directors, or the Board, of NVIDIA Corporation accepted the resignation of
      Jen-Hsun Huang, as NVIDIA’s President, Chief Executive Officer and member of the Board, effective immediately.
    statement:
      zh: 董事会接受黄仁勋辞去总裁、首席执行官和董事职务，即时生效
      en: The board accepted Jen-Hsun Huang's resignation as President, CEO and director, effective immediately
  - id: f_kress_interim
    date: "2026-11-11"
    kind: event
    document: doc_nvda_8k_20261111
    locator: Item 5.02
    excerpt: >-
      Following Mr. Huang’s resignation, the Board appointed NVIDIA’s Executive Vice President and Chief Financial Officer
      Colette M. Kress, age 59, to serve as interim Chief Executive Officer, while the Board conducts a search for a new Chief
      Executive Officer.
    statement:
      zh: 董事会任命执行副总裁兼首席财务官 Colette M. Kress 为临时首席执行官，同时寻找新的首席执行官
      en: The board appointed EVP and CFO Colette M. Kress interim CEO while it searches for a new CEO
  - id: f_kress_keeps_cfo
    date: "2026-11-11"
    kind: event
    document: doc_nvda_8k_20261111
    locator: Item 5.02
    excerpt: >-
      Ms. Kress has served as NVIDIA’s Executive Vice President and Chief Financial Officer since 2013 and will continue in
      that role while she serves as the interim Chief Executive Officer.
    statement:
      zh: Kress 自 2013 年起任首席财务官，任临时首席执行官期间继续兼任
      en: Kress has been CFO since 2013 and keeps that role while serving as interim CEO
  - id: f_jones_chair
    date: "2026-11-11"
    kind: event
    document: doc_nvda_8k_20261111
    locator: Item 5.02
    excerpt: >-
      On November 11, 2026, the Board appointed Harvey C. Jones, age 73, as Chair of the Board. Mr. Jones has served on the
      Board since 1993.
    statement:
      zh: 董事会任命 1993 年起任董事的 Harvey C. Jones 为董事会主席
      en: The board appointed Harvey C. Jones, a director since 1993, as Chair of the Board
  - id: f_first_chair
    date: "2026-11-12"
    kind: event
    document: doc_nvda_8k_20261111_ex991
    locator: Exhibit 99.1
    excerpt: The Board of Directors appointed Harvey C. Jones as its first-ever Chair of the Board.
    statement:
      zh: 新闻稿说明这是公司首次设董事会主席
      en: The press release says this is the board's first-ever chair
  - id: f_search_scope
    date: "2026-11-12"
    kind: event
    document: doc_nvda_8k_20261111_ex991
    locator: Exhibit 99.1
    excerpt: >-
      The Board is initiating a search for a permanent Chief Executive Officer and will consider internal and external
      candidates.
    statement:
      zh: 董事会开始寻找正式的首席执行官，内部和外部人选都会考虑
      en: The board is starting a search for a permanent CEO and will consider internal and external candidates
  # 原为 scheduled（11-11 新闻稿公布的日程）；2026-11-26 按实际发生的情况改登为 11-17 的 8-K 第 2.02 项
  - id: f_q3_results
    date: "2026-11-17"
    kind: related
    document: doc_nvda_8k_20261117
    locator: Item 2.02
    excerpt: >-
      On November 17, 2026, NVIDIA Corporation, or the Company, issued a press release announcing its results for the
      quarter ended October 25, 2026.
    statement:
      zh: 公司按 11-11 公布的日程，于 11 月 17 日发布截至 2026 年 10 月 25 日季度的业绩新闻稿
      en: As scheduled on 11 November, the company issued its results press release for the quarter ended 25 October 2026 on 17 November
  - id: f_huang_reinstated
    date: "2026-11-22"
    kind: event
    document: doc_nvda_8k_20261122
    locator: Item 5.02
    excerpt: >-
      On November 22, 2026, the Board of Directors of NVIDIA Corporation reinstated Jen-Hsun Huang as NVIDIA’s President,
      Chief Executive Officer and member of the Board of Directors, effective immediately.
    statement:
      zh: 董事会恢复黄仁勋的总裁、首席执行官和董事职务，即时生效
      en: The board reinstated Jen-Hsun Huang as President, CEO and director, effective immediately
  - id: f_kress_cfo_only
    date: "2026-11-22"
    kind: event
    document: doc_nvda_8k_20261122
    locator: Item 5.02
    excerpt: >-
      Following the reinstatement of Mr. Huang, Ms. Kress will continue to serve as NVIDIA’s Executive Vice President and
      Chief Financial Officer.
    statement:
      zh: 黄仁勋回任后，Kress 继续任执行副总裁兼首席财务官
      en: After Huang's reinstatement, Kress continues as EVP and CFO
  - id: f_jones_stays_chair
    date: "2026-11-23"
    kind: event
    document: doc_nvda_8k_20261122_ex991
    locator: Exhibit 99.1
    excerpt: Mr. Jones will continue to serve as Board chair.
    statement:
      zh: 新闻稿说明 Harvey C. Jones 继续任董事会主席
      en: The press release says Harvey C. Jones continues as Board chair
  - id: f_investigation_continues
    date: "2026-11-23"
    kind: event
    document: doc_nvda_8k_20261122_ex991
    locator: Exhibit 99.1
    excerpt: The Board reiterated that the committee’s investigation will proceed to conclusion.
    statement:
      zh: 新闻稿说明，董事会此前成立的独立董事调查委员会的调查会继续进行到结束
      en: The press release says the investigation by the independent-director committee the board had formed will proceed to conclusion
  - id: f_ns_committee
    date: "2026-11-23"
    kind: event
    document: doc_nvda_8k_20261122_ex991
    locator: Exhibit 99.1
    excerpt: >-
      The Board also recently formed a National Security and Export Control Committee comprised solely of independent
      directors to oversee trade compliance and national security risks.
    statement:
      zh: 董事会新近成立由独立董事组成的国家安全与出口管制委员会，监督贸易合规与国家安全风险
      en: The board recently formed a National Security and Export Control Committee of independent directors to oversee trade compliance and national security risks
  - id: f_cco_search
    date: "2026-11-23"
    kind: event
    document: doc_nvda_8k_20261122_ex991
    locator: Exhibit 99.1
    excerpt: NVIDIA is commencing a search to fill a new position, Chief Compliance Officer,
    statement:
      zh: 公司开始招聘新设的首席合规官职位
      en: The company is starting a search for a newly created Chief Compliance Officer position
