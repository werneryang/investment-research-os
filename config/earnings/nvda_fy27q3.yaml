- id: rounded_segments
  document: cfo
  title:
    zh: 分部与市场平台（四舍五入收入）
    en: Segments and market platforms (rounded revenue)
  fact:
    zh: 顺序为 FY27 Q3／FY27 Q2／FY26 Q3，单位十亿美元：正式分部 Compute & Networking 106.0／88.3／50.9，Graphics
      9.8／7.9／6.1。市场平台 Data Center 107.6／89.0／51.2，其中 Hyperscale 60.1／48.7／35.1、AI
      Clouds, Industrial, & Enterprise 47.5／40.3／16.1；Edge Computing 8.2／7.2／5.8。
    en: 'Order: FY27 Q3 / FY27 Q2 / FY26 Q3, USD billions. Reportable segments: Compute
      & Networking 106.0 / 88.3 / 50.9; Graphics 9.8 / 7.9 / 6.1. Market platforms:
      Data Center 107.6 / 89.0 / 51.2, comprising Hyperscale 60.1 / 48.7 / 35.1 and
      AI Clouds, Industrial, & Enterprise 47.5 / 40.3 / 16.1; Edge Computing 8.2 /
      7.2 / 5.8.'
  limit:
    zh: 保留一位小数原精度，不转成精确百万美元、不要求四舍五入值精确加总、不由平台收入推断分部利润率。原披露增长率以未四舍五入的百万美元计算，本页不以 rounded
      数值重造该增长率。
    en: Original one-decimal precision is retained, not converted into exact USD millions
      or forced to sum exactly. Platform revenue does not establish segment margins.
      Issuer growth percentages use unrounded USD millions and are not reconstructed
      from the rounded amounts.
