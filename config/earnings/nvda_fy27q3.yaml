- id: fcf
  document: release
  title:
    zh: 自由现金流与现金税时点
    en: Free cash flow and cash timing
  fact:
    zh: 发行人 FCF = CFO−购置固定资产及无形资产的现金支出−相关本金支付。FY27 Q3 为 48,253−4,422−54=43,777；FY27
      Q2 为 24,077−2,677−59=21,341；FY26 Q3 为 23,750−1,637−24=22,089（百万美元）。
    en: 'Issuer FCF = CFO less cash purchases of property, equipment and intangible
      assets less related principal. FY27 Q3: 48,253−4,422−54=43,777; FY27 Q2: 24,077−2,677−59=21,341;
      FY26 Q3: 23,750−1,637−24=22,089 (USD millions).'
  limit:
    zh: 不是可分配或持续性 owner cash。现金税及营运资本时点影响 CFO；本金独立列示，不合并进购置支出。
    en: Not distributable or sustainable owner cash. Cash taxes and working-capital
      timing affect CFO; principal is separate from purchases.
  excerpts:
  - Free cash flow is calculated as GAAP net cash provided by operating activities
    less both purchases related to property and equipment and intangible assets and
    principal payments on property and equipment and intangible assets.
- id: nongaap
  document: release
  title:
    zh: GAAP 与非 GAAP 可比性
    en: GAAP and non-GAAP comparability
  fact:
    zh: FY27 Q3 GAAP／非 GAAP 净利润为 65,287／64,870，Q2 为 59,688／53,954（百万美元）。自 FY27 Q1
      起，发行人非 GAAP 不再剔除股份薪酬，所示历史非 GAAP 比较也已改为包含股份薪酬。
    en: FY27 Q3 GAAP/non-GAAP net income is 65,287/64,870 and Q2 is 59,688/53,954
      (USD millions). Starting FY27 Q1, issuer non-GAAP measures no longer exclude
      stock-based compensation; presented historical comparisons were updated to include
      it.
  limit:
    zh: 本表计算仅采用 GAAP；不混用旧版剔除股份薪酬的非 GAAP，不由局部调整声称完整正常化盈利。
    en: Calculated tables use GAAP only. Old non-GAAP definitions excluding SBC are
      not mixed in; partial adjustments are not full normalized earnings.
  excerpts:
  - NVIDIA’s non-GAAP financial measures no longer exclude stock-based compensation
    expense.
  check:
    document: release
    gaap_ni_q3: 65287
    non_gaap_ni_q3: 64870
    gaap_ni_q2: 59688
    non_gaap_ni_q2: 53954
- id: q4_outlook
  document: release
  title:
    zh: FY27 Q4 展望（尚未实现）
    en: FY27 Q4 outlook (not realized)
  fact:
    zh: 11/17 管理层预计 Q4 收入 130.0 十亿美元±3%，区间算术 126.1–133.9；GAAP/非 GAAP 毛利率 71%–72%，营业费用约
      11.0/10.7 十亿美元。Q4 多一周；不假设中国 Data Center compute 收入。 FY27 全年税率展望 16%–18%，不含离散事项及税务环境重大变化。
    en: On November 17, management guided Q4 revenue to USD 130.0bn±3% (mechanical
      range 126.1–133.9), GAAP/non-GAAP gross margin 71%–72%, and operating expenses
      about USD 11.0/10.7bn. Q4 includes an extra week and assumes no China Data Center
      compute revenue. FY27 full-year tax-rate outlook is 16%–18%, excluding discrete
      items and material changes in the tax environment.
  limit:
    zh: 为未来条件式展望，非收入承诺或已实现值；同比/环比不等于每周有机增长。本页资本开支展望栏未把收入展望错填成 capex。
    en: Conditional forward outlook, not a revenue commitment or realized result.
      Growth is not weekly organic growth. Revenue guidance is not misregistered as
      capex guidance.
  excerpts:
  - Revenue is expected to be $130.0 billion, plus or minus 3%.
  - GAAP and non-GAAP gross margins are expected to be between 71.0% and 72.0%.
- id: prior_outlook
  document: prior_guidance
  title:
    zh: 上季 Q3 指引核对
    en: Prior-quarter Q3 guidance check
  fact:
    zh: 8/26 原 Q3 收入指引 108.0 十亿美元±2%，即 105.84–110.16；实际 115.844，高于上界 5.684 十亿美元。GAAP
      毛利率指引 74%±0.5 个百分点，实际 74.8213% 高于 74.5% 上界。
    en: The August 26 Q3 revenue outlook was USD 108.0bn±2%, or 105.84–110.16; actual
      115.844 is 5.684 above the upper bound. GAAP gross-margin guidance was 74%±0.5pp;
      actual 74.8213% exceeds the 74.5% upper bound.
  limit:
    zh: 按原定义区间判定为高于上界、非落在区间内；这不是一致预期 surprise 或失败判定。
    en: Above the stated upper bound, not inside the range. This is not a consensus
      surprise or failure verdict.
  excerpts:
  - Revenue is expected to be $108.0 billion, plus or minus 2%.
- id: historical
  document: release
  title:
    zh: 季度选择与历史小差
    en: Quarter selection and small historical discrepancy
  fact:
    zh: 主表仅使用直接可核对的 FY26 Q3、FY27 Q2、FY27 Q3，不是连续三季。未将走查中的 FY27 Q1 减算值或跨来源 FY26 Q4
      减算值伪称直接披露。季度起始日按对应 13 周季度由期末减 90 日推定。
    en: The main table uses directly checkable FY26 Q3, FY27 Q2 and FY27 Q3, not three
      consecutive quarters. Derived FY27 Q1 and cross-source FY26 Q4 figures in the
      walkthrough are not presented as direct disclosures. Quarter starts are inferred
      as 90 days before the corresponding 13-week quarter end.
  limit:
    zh: FY27 Q1 的收入/营业利润/净利在 Q2 简表与累计减算间各差 1 百万美元，原因未确定，不证明重述；本页不扩展为五季均独立核验的声明。
    en: FY27 Q1 revenue, operating income and net income each differ by USD 1m between
      the Q2 summary and cumulative subtraction. Cause is unknown, not proof of restatement.
      This page does not claim five independently verified quarters.
  excerpts: []
