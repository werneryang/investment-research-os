claims:
  # ---- NVIDIA 2026 财年 10-K 原文 ----
  - id: clm_nvda26_fabless
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: We utilize a fabless and contracting manufacturing strategy
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_foundry
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: >-
      We utilize foundries, such as Taiwan Semiconductor Manufacturing Company Limited, or TSMC, and Samsung Electronics Co., Ltd.,
      or Samsung, to produce our semiconductor wafers.
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_memory
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: We purchase memory from SK Hynix Inc., Micron Technology, Inc., and Samsung.
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_cowos
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: We utilize CoWoS technology for semiconductor packaging.
    origin_type: observed
    review_status: candidate
    note: 原文没有写明 CoWoS 封装的提供方，不据此登记任何供应关系
  - id: clm_nvda26_atp
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: >-
      We engage with independent subcontractors and contract manufacturers such as Hon Hai Precision Industry Co., Ltd.,
      Wistron Corporation, and Fabrinet to perform assembly, testing and packaging of our final products.
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_segments
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1 Business — Our Businesses
    excerpt: >-
      The Compute & Networking segment includes our Data Center accelerated computing and networking platforms and AI solutions
      and software, and Automotive platforms and autonomous and electric vehicle solutions including software. The Graphics segment
      includes GeForce GPUs for gaming and PCs, and Quadro/NVIDIA RTX GPUs for enterprise workstation graphics.
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_codm
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part II, Item 8 — Notes, Segment Information
    excerpt: CODM reviews expenses on a consolidated basis, and expenses attributable to each segment are not regularly provided to our CODM.
    origin_type: observed
    review_status: candidate
  - id: clm_nvda26_customers
    type: filing_text
    document: doc_nvda_10k_fy2026
    locator: Part I, Item 1A Risk Factors — customer concentration
    excerpt: >-
      For fiscal year 2026, sales to one direct customer represented 22% of total revenue and sales to another direct customer
      represented 14% of total revenue, all of which were primarily attributable to the Compute & Networking segment.
    origin_type: observed
    review_status: candidate

  # ---- Micron 2025 财年 10-K 原文 ----
  - id: clm_mu25_reorg
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Business Segments
    excerpt: >-
      In the fourth quarter of 2025, we reorganized our business units. All prior-period segment amounts have been retrospectively
      adjusted to reflect this reorganization.
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_units
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Business Segments
    excerpt: >-
      Cloud Memory Business Unit ("CMBU"): Focused on memory solutions for large hyperscale cloud customers, and HBM for all data
      center customers.
    origin_type: observed
    review_status: candidate
  # ---- Micron 2024 财年 10-K 原文（重组前口径）----
  - id: clm_mu24_unit_cnbu
    type: filing_text
    document: doc_mu_10k_fy2024
    locator: Part I, Item 1 Business — business units (reportable segments)
    excerpt: >-
      Compute and Networking Business Unit ("CNBU"): Includes memory products and solutions sold into the data center, PC, graphics,
      and networking markets.
    origin_type: observed
    review_status: candidate
  - id: clm_mu24_manufacturing
    type: filing_text
    document: doc_mu_10k_fy2024
    locator: Part I, Item 1 Business — Manufacturing
    excerpt: >-
      We manufacture our products within our own facilities located in Taiwan, Singapore, Japan, the United States, Malaysia, China,
      and India and also utilize subcontractors to perform certain manufacturing processes.
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_fabs
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 2 Properties — principal facilities
    excerpt: Taiwan R&D, wafer fabrication, component assembly and test, module assembly and test
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_competitors
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Competitive Conditions
    excerpt: >-
      We face intense competition in the semiconductor memory and storage markets from a number of companies, including Samsung
      Electronics Co., Ltd.; SK hynix Inc.; Kioxia Holdings Corporation; Sandisk Corporation; ChangXin Memory Technologies, Inc.
      ("CXMT"); and Yangtze Memory Technologies Co., Ltd. ("YMTC").
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_top10
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1A Risk Factors — customer concentration
    excerpt: In 2025, over half of our total revenue came from our top ten customers.
    origin_type: observed
    review_status: candidate

  - id: clm_mu25_unit_cdbu
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Business Segments
    excerpt: >-
      Core Data Center Business Unit ("CDBU"): Focused on memory solutions for mid-tier cloud, enterprise, and OEM data center
      customers and storage solutions for all data center customers.
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_unit_mcbu
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Business Segments
    excerpt: 'Mobile and Client Business Unit ("MCBU"): Focused on memory and storage solutions for the mobile and client segments.'
    origin_type: observed
    review_status: candidate
  - id: clm_mu25_unit_aebu
    type: filing_text
    document: doc_mu_10k_fy2025
    locator: Part I, Item 1 Business — Business Segments
    excerpt: >-
      Automotive and Embedded Business Unit ("AEBU"): Focused on memory and storage solutions for the automotive, industrial,
      and consumer segments.
    origin_type: observed
    review_status: candidate

