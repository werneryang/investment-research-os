# 证据：申报文件与逐条 claim（四层共用；docs/supply-chain-research-design.md §7、§9.1）
#
# documents：原文文件的申报编号、地址与 SHA256；本地副本在 data/supply_chain/filings/（不入库）。
#   SEC 每次下载都在文末附加一段不同的 <script> 标签，SHA256 固定的是本地副本；重新下载的文件去掉该标签后再与旧副本比较。
#   接受时间来自 FSDS sub.txt（美东）；available_at = 接受时间次日 0 点（美东），与财报事实相同的保守规则。
#   document_period_end 是年报封面「fiscal year ended …」的精确期末（FSDS 只有月末口径），须在原文中出现。
# claims：
#   filing_text  excerpt 必须逐字出现在原文（去标签、空白折叠、弯引号换直引号之后）；只摘录支撑该事实所需的短句
#   xbrl_segment 必须写明 value 与 unit，并在 segment_facts 表中找到同一申报、科目、segments、期末（月末）、期间长度与单位，
#                value 一致；缺数值或单位时为未核对
# origin_type：observed / derived / assumed / inferred / unknown。
# 三种核对分开：机器核对由 iros chain check 给出（claim_checks），不写进这里；技术复核（事实核对与语义复核）记录在 reviews.yaml；
# review_status 是可选的人工复核：candidate / confirmed / rejected / retracted，confirmed 只表示人工签认，
# confirmed、rejected、retracted 须写明 reviewer 与 reviewed_at。
# 被否定、撤回或技术复核未通过的 claim 不能支撑任何映射或关系。
# 2026-10-29 登记的 27 条证据由模型从原文提取，机器核对通过，技术复核通过（trv_chip_20261029），未人工复核。

