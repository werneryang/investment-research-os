# 数据集登记：来源下的具体数据对象与语义（docs/architecture.md §6）
#
# availability 是「最早可用于研究决策」的保守规则，不是实际发布时间：
#   next_day                观测日次日 0 点（来源时区）
#   period_end_lag_days     观测期间结束后第 days 天结束时（来源时区）
#   published_next_day      供应方发布日次日 0 点（需要来源提供发布日期）
#   unknown                 无法确定，available_at 留空
#
# vintages 声明历史版本能力（默认 none）：
#   supplier  供应方提供历史版本及发布日期，可凭 available_at 用于时点研究
#   none      只有当前修订版本；时点研究只能使用当时已取得（retrieved_at）的本地快照，
#             可用时间规则本身不能证明修订值当时已知
# calendar 引用 config/calendars.yaml 中经核验的预期观测日历，用于日期覆盖检查
# scheduled_fetch 登记定时快照（iros fetch --all，本机 launchd 每个工作日运行，见 scripts/snapshot-agent.sh）
#   的请求：{} 取得全部历史；start/end 可用 today、today-30d 等相对日期，运行当天换算。
#   不登记表示不参加定时取得。只有当前修订的数据，时点研究只能依靠这些当时取得的快照。
# archive_data: true 表示允许把该数据集的原始与标准化数据存入公开的运行档案（archive 分支）；
#   默认不允许。开启前须确认来源许可允许公开再分发。

datasets:
  ust_par_yield_curve:
    source_id: ust_treasury
    upstream_id: U.S. Treasury Daily Treasury Par Yield Curve Rates
    connector: treasury_par_curve
    description: 美国国债日度票面收益率曲线（par yield，按债券等价收益率报价）
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: next_day}
    vintages: none
    calendar: us_treasury_daily
    # 联邦政府公开信息；2026-10-22 经用户确认存入公开档案
    archive_data: true
    value_range: [-5, 30]
    # 按年下载；取最近 30 天所在年份，一月初也覆盖上一年末的更正
    scheduled_fetch: {start: today-30d}

  fred_dgs10:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DGS10"
    connector: fred_graph_csv
    description: 10 年期国债固定期限收益率（H.15，与 Treasury 曲线同一上游）
    params: {series: DGS10}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    # 2026-10-23 前为 next_day，早于 FRED 上的实际可得时间（当天 15:26 EDT 时仍止于 10-21）；
    # 改为与其他 H.15 日度序列相同的保守规则：观测日后第 4 天结束，覆盖周末加周一假日
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  fred_cpiaucsl:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: CPIAUCSL"
    connector: fred_graph_csv
    description: 美国 CPI-U 季调指数（当前修订版本，非当时版本）
    params: {series: CPIAUCSL}
    frequency: monthly
    unit: index_1982_1984=100
    currency: null
    timezone: America/New_York
    # BLS 通常在次月中旬发布；取 45 天作为保守规则，仅为当前版本的近似
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 1000]
    scheduled_fetch: {}

  alfred_cpiaucsl:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: CPIAUCSL"
    connector: fred_api_vintages
    description: CPI-U 季调指数全部历史版本（需要 FRED_API_KEY）
    params: {series: CPIAUCSL}
    frequency: monthly
    unit: index_1982_1984=100
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 1000]

  # ALFRED 历史版本：供应方保留每次发布的数值与发布日期（realtime_start），不需要本机定时快照
  alfred_unrate:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: UNRATE"
    connector: fred_api_vintages
    description: 失业率（季调）全部历史版本：每次公布与修订的数值及其发布日期（需要 FRED_API_KEY）
    params: {series: UNRATE}
    frequency: monthly
    unit: percent
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 100]

  alfred_payems:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: PAYEMS"
    connector: fred_api_vintages
    description: 非农就业人数（季调）全部历史版本：首次公布、逐月修订与年度基准修订（需要 FRED_API_KEY）
    params: {series: PAYEMS}
    frequency: monthly
    unit: thousands_of_persons
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 1000000]

  # ---- 第一批 FRED 序列（2026-10-23）：只接入数据，尚无研究 ----
  # H.15 日度序列在 FRED 上通常次一工作日下午才出现（2026-10-23 15:26 EDT 时 DFF、DFII10 仍止于 10-21）；
  # 可用时间取观测日后第 4 天结束，覆盖周末加周一假日。这是保守规则，不是实际发布时间。

  fred_dff:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DFF"
    connector: fred_graph_csv
    description: 联邦基金有效利率（日度，含周末与假日，沿用前一工作日利率）
    params: {series: DFF}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  fred_walcl:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.4.1) via FRED: WALCL"
    connector: fred_graph_csv
    description: 美联储总资产（每周三余额，H.4.1 通常周四发布）
    params: {series: WALCL}
    # 观测日期是周三余额，不是期间起点；按周度处理时可用时间晚于实际发布约一周，偏保守
    frequency: weekly
    unit: millions_usd
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 0}
    vintages: none
    value_range: [0, 100000000]
    scheduled_fetch: {}

  fred_t10yie:
    source_id: fred_graph
    upstream_id: "Federal Reserve Bank of St. Louis via FRED: T10YIE（由 H.15 的 DGS10 与 DFII10 计算）"
    connector: fred_graph_csv
    description: 10 年期盈亏平衡通胀率（名义收益率 − TIPS 实际收益率；含通胀风险溢价与流动性溢价，不等于通胀预期）
    params: {series: T10YIE}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 10]
    scheduled_fetch: {}

  fred_dfii10:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DFII10"
    connector: fred_graph_csv
    description: 10 年期 TIPS 固定期限实际收益率
    params: {series: DFII10}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-10, 15]
    scheduled_fetch: {}

  fred_unrate:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: UNRATE"
    connector: fred_graph_csv
    description: 失业率（季调，当前修订版本）
    params: {series: UNRATE}
    frequency: monthly
    unit: percent
    currency: null
    timezone: America/New_York
    # 就业报告通常在次月第一个周五发布，政府停摆时会推迟；与 CPI 一样取 45 天作为保守规则
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 100]
    scheduled_fetch: {}

  fred_payems:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: PAYEMS"
    connector: fred_graph_csv
    description: 非农就业人数（季调，当前修订版本；历史值会随基准修订改变）
    params: {series: PAYEMS}
    frequency: monthly
    unit: thousands_of_persons
    currency: null
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 1000000]
    scheduled_fetch: {}

  manual_example:
    source_id: manual
    upstream_id: 人工导入示例（导入时须声明原始来源）
    connector: manual_csv
    description: 人工导入通道示例；CSV 需含 observation_at 与 value 列，可选 series_id
    frequency: monthly
    unit: percent
    currency: null
    timezone: UTC
    availability: {type: unknown}
