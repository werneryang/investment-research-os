# 数据集登记：来源下的具体数据对象与语义（docs/architecture.md §6）
#
# availability 是「最早可用于研究决策」的保守规则，不是实际发布时间：
#   next_day                观测日次日 0 点（来源时区）
#   period_end_lag_days     观测期间结束后第 days 天结束时（来源时区）
#   published_next_day      供应方发布日次日 0 点（需要来源提供发布日期）
#   unknown                 无法确定，available_at 留空
#
# vintages 声明历史版本能力（默认 none）：
#   supplier  供应方提供历史版本及发布日期，可凭 available_at 用于时点研究
#   none      只有当前修订版本；时点研究只能使用当时已取得（retrieved_at）的本地快照，
#             可用时间规则本身不能证明修订值当时已知
# calendar 引用 config/calendars.yaml 中经核验的预期观测日历，用于日期覆盖检查
# scheduled_fetch 登记定时快照（iros fetch --all，本机 launchd 每个工作日运行，见 scripts/snapshot-agent.sh）
#   的请求：{} 取得全部历史；start/end 可用 today、today-30d 等相对日期，运行当天换算。
#   不登记表示不参加定时取得。只有当前修订的数据，时点研究只能依靠这些当时取得的快照。
# archive_data: true 表示允许把该数据集的原始与标准化数据存入公开的运行档案（archive 分支）；
#   默认不允许。开启前须确认来源许可允许公开再分发。

datasets:
  ust_par_yield_curve:
    source_id: ust_treasury
    upstream_id: U.S. Treasury Daily Treasury Par Yield Curve Rates
    connector: treasury_par_curve
    description: 美国国债日度票面收益率曲线（par yield，按债券等价收益率报价）
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: next_day}
    vintages: none
    calendar: us_treasury_daily
    # 联邦政府公开信息；2026-10-22 经用户确认存入公开档案
    archive_data: true
    value_range: [-5, 30]
    # 按年下载；取最近 30 天所在年份，一月初也覆盖上一年末的更正
    scheduled_fetch: {start: today-30d}

  fred_dgs10:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DGS10"
    connector: fred_graph_csv
    description: 10 年期国债固定期限收益率（H.15，与 Treasury 曲线同一上游）
    params: {series: DGS10}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    # 2026-10-23 前为 next_day，早于 FRED 上的实际可得时间（当天 15:26 EDT 时仍止于 10-21）；
    # 改为与其他 H.15 日度序列相同的保守规则：观测日后第 4 天结束，覆盖周末加周一假日
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  fred_cpiaucsl:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: CPIAUCSL"
    connector: fred_graph_csv
    description: 美国 CPI-U 季调指数（当前修订版本，非当时版本）
    params: {series: CPIAUCSL}
    frequency: monthly
    unit: index_1982_1984=100
    currency: null
    timezone: America/New_York
    # BLS 通常在次月中旬发布；取 45 天作为保守规则，仅为当前版本的近似
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 1000]
    scheduled_fetch: {}

  alfred_cpiaucsl:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: CPIAUCSL"
    connector: fred_api_vintages
    description: CPI-U 季调指数全部历史版本（需要 FRED_API_KEY）
    params: {series: CPIAUCSL}
    frequency: monthly
    unit: index_1982_1984=100
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 1000]

  # ALFRED 历史版本：供应方保留每次发布的数值与发布日期（realtime_start），不需要本机定时快照
  alfred_unrate:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: UNRATE"
    connector: fred_api_vintages
    description: 失业率（季调）全部历史版本：每次公布与修订的数值及其发布日期（需要 FRED_API_KEY）
    params: {series: UNRATE}
    frequency: monthly
    unit: percent
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 100]

  alfred_payems:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Labor Statistics via ALFRED: PAYEMS"
    connector: fred_api_vintages
    description: 非农就业人数（季调）全部历史版本：首次公布、逐月修订与年度基准修订（需要 FRED_API_KEY）
    params: {series: PAYEMS}
    frequency: monthly
    unit: thousands_of_persons
    currency: null
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 1000000]

  # ---- 第一批 FRED 序列（2026-10-23）：只接入数据，尚无研究 ----
  # H.15 日度序列在 FRED 上通常次一工作日下午才出现（2026-10-23 15:26 EDT 时 DFF、DFII10 仍止于 10-21）；
  # 可用时间取观测日后第 4 天结束，覆盖周末加周一假日。这是保守规则，不是实际发布时间。

  fred_dff:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DFF"
    connector: fred_graph_csv
    description: 联邦基金有效利率（日度，含周末与假日，沿用前一工作日利率）
    params: {series: DFF}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  fred_walcl:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.4.1) via FRED: WALCL"
    connector: fred_graph_csv
    description: 美联储总资产（每周三余额，H.4.1 通常周四发布）
    params: {series: WALCL}
    # 观测日期是周三余额，不是期间起点；按周度处理时可用时间晚于实际发布约一周，偏保守
    frequency: weekly
    unit: millions_usd
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 0}
    vintages: none
    value_range: [0, 100000000]
    scheduled_fetch: {}

  fred_t10yie:
    source_id: fred_graph
    upstream_id: "Federal Reserve Bank of St. Louis via FRED: T10YIE（由 H.15 的 DGS10 与 DFII10 计算）"
    connector: fred_graph_csv
    description: 10 年期盈亏平衡通胀率（名义收益率 − TIPS 实际收益率；含通胀风险溢价与流动性溢价，不等于通胀预期）
    params: {series: T10YIE}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 10]
    scheduled_fetch: {}

  fred_dfii10:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DFII10"
    connector: fred_graph_csv
    description: 10 年期 TIPS 固定期限实际收益率
    params: {series: DFII10}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-10, 15]
    scheduled_fetch: {}

  fred_unrate:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: UNRATE"
    connector: fred_graph_csv
    description: 失业率（季调，当前修订版本）
    params: {series: UNRATE}
    frequency: monthly
    unit: percent
    currency: null
    timezone: America/New_York
    # 就业报告通常在次月第一个周五发布，政府停摆时会推迟；与 CPI 一样取 45 天作为保守规则
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 100]
    scheduled_fetch: {}

  fred_payems:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Labor Statistics via FRED: PAYEMS"
    connector: fred_graph_csv
    description: 非农就业人数（季调，当前修订版本；历史值会随基准修订改变）
    params: {series: PAYEMS}
    frequency: monthly
    unit: thousands_of_persons
    currency: null
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 45}
    vintages: none
    value_range: [0, 1000000]
    scheduled_fetch: {}

  # ---- 第二批 FRED 序列（2026-10-23）：只接入数据，尚无研究。日度序列同样取观测日后第 4 天结束 ----

  # VIX 与穆迪序列在 FRED 上标注为「有版权，需注明出处」：只在本机使用，不进公开存档
  fred_vixcls:
    source_id: fred_graph
    upstream_id: "Cboe Global Markets via FRED: VIXCLS（有版权，需注明出处）"
    connector: fred_graph_csv
    description: Cboe VIX 波动率指数日收盘值（标普 500 期权隐含的 30 天波动率，年化百分点）
    params: {series: VIXCLS}
    frequency: daily
    unit: index
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [0, 200]
    scheduled_fetch: {}

  fred_baa10y:
    source_id: fred_graph
    upstream_id: "Moody's via FRED: BAA10Y（有版权，需注明出处）"
    connector: fred_graph_csv
    description: 穆迪 Baa 级经调整公司债收益率减 10 年期国债固定期限收益率（收益率利差，不是期权调整利差）
    params: {series: BAA10Y}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 20]
    scheduled_fetch: {}

  fred_aaa10y:
    source_id: fred_graph
    upstream_id: "Moody's via FRED: AAA10Y（有版权，需注明出处）"
    connector: fred_graph_csv
    description: 穆迪 Aaa 级公司债收益率减 10 年期国债固定期限收益率（收益率利差，不是期权调整利差）
    params: {series: AAA10Y}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 20]
    scheduled_fetch: {}

  fred_dtb3:
    source_id: fred_graph
    upstream_id: "Board of Governors of the Federal Reserve System (H.15) via FRED: DTB3"
    connector: fred_graph_csv
    description: 3 个月国库券二级市场利率（贴现率口径）
    params: {series: DTB3}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  fred_sofr:
    source_id: fred_graph
    upstream_id: "Federal Reserve Bank of New York via FRED: SOFR"
    connector: fred_graph_csv
    description: 担保隔夜融资利率（SOFR），纽约联储次一工作日公布
    params: {series: SOFR}
    frequency: daily
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 4}
    vintages: none
    value_range: [-5, 30]
    scheduled_fetch: {}

  # GDP 初值通常在季度结束后约 30 天公布，停摆时会推迟（2025 年三季度初值推迟到 12 月下旬）；取 90 天作为保守规则
  fred_gdp:
    source_id: fred_graph
    upstream_id: "U.S. Bureau of Economic Analysis via FRED: GDP"
    connector: fred_graph_csv
    description: 名义 GDP（季调年率，十亿美元；当前修订版本，历史值会随年度与综合修订改变）
    params: {series: GDP}
    frequency: quarterly
    unit: billions_usd_saar
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 90}
    vintages: none
    value_range: [0, 10000000]
    scheduled_fetch: {}

  alfred_gdp:
    source_id: fred_api
    upstream_id: "U.S. Bureau of Economic Analysis via ALFRED: GDP"
    connector: fred_api_vintages
    description: 名义 GDP 全部历史版本：初值、修正值与年度、综合修订（需要 FRED_API_KEY）
    params: {series: GDP}
    frequency: quarterly
    unit: billions_usd_saar
    currency: USD
    timezone: America/New_York
    availability: {type: published_next_day}
    vintages: supplier
    value_range: [0, 10000000]

  # ---- Kenneth French 数据库（2026-10-23）：月度因子与行业组合收益，百分比 ----
  # 文件通常在月末后约三到八周更新（202608 数据于 2026-09-24 生成，2026-10-23 时 202609 仍未发布）；
  # 可用时间取月末后第 90 天结束，是保守规则。数据随 CRSP 更新整体重算，只有当前版本，因此参加定时快照。

  french_ff3:
    source_id: ken_french
    upstream_id: "Kenneth R. French Data Library: F-F_Research_Data_Factors（月度）"
    connector: french_csv
    description: Fama/French 三因子月度收益：市场超额收益（Mkt-RF）、规模（SMB）、价值（HML）与无风险利率（RF）
    params: {file: F-F_Research_Data_Factors, columns: [Mkt-RF, SMB, HML, RF], prefix: FF3_}
    frequency: monthly
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 90}
    vintages: none
    value_range: [-100, 1000]
    scheduled_fetch: {}

  french_ff5:
    source_id: ken_french
    upstream_id: "Kenneth R. French Data Library: F-F_Research_Data_5_Factors_2x3（月度）"
    connector: french_csv
    description: Fama/French 五因子月度收益（2x3 分组）：在三因子之外加盈利（RMW）与投资（CMA）
    params: {file: F-F_Research_Data_5_Factors_2x3, columns: [Mkt-RF, SMB, HML, RMW, CMA, RF], prefix: FF5_}
    frequency: monthly
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 90}
    vintages: none
    value_range: [-100, 1000]
    scheduled_fetch: {}

  french_mom:
    source_id: ken_french
    upstream_id: "Kenneth R. French Data Library: F-F_Momentum_Factor（月度）"
    connector: french_csv
    description: 动量因子月度收益（Mom，过去 12 至 2 个月收益高减低）
    params: {file: F-F_Momentum_Factor, columns: [Mom], prefix: MOM_}
    frequency: monthly
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 90}
    vintages: none
    value_range: [-100, 1000]
    scheduled_fetch: {}

  french_ind12_vw:
    source_id: ken_french
    upstream_id: "Kenneth R. French Data Library: 12_Industry_Portfolios，价值加权月度收益"
    connector: french_csv
    description: 12 个行业组合的价值加权月度收益（每年 6 月末按 SIC 代码重新分组）
    params:
      file: 12_Industry_Portfolios
      section: Average Value Weighted Returns -- Monthly
      columns: [NoDur, Durbl, Manuf, Enrgy, Chems, BusEq, Telcm, Utils, Shops, Hlth, Money, Other]
      prefix: IND12VW_
    frequency: monthly
    unit: percent
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 90}
    vintages: none
    value_range: [-100, 1000]
    scheduled_fetch: {}

  # ---- Damodaran 历史回报表（2026-10-23）：年度回报，小数（0.05 即 5%） ----
  # 每年 1 月更新上一年数据；可用时间取年末后第 60 天结束，是保守规则。表中自带的「更新日期」单元格已过时，不作依据

  damodaran_histret:
    source_id: damodaran
    upstream_id: "Aswath Damodaran: histretSP.xls，Returns by year"
    connector: damodaran_xls
    description: 美国主要资产的年度回报（1928 年起）：标普 500（含分红）、小盘股、3 个月国库券、10 年期国债、Baa 公司债、房地产与黄金
    params:
      file: histretSP.xls
      sheet: Returns by year
      columns:
        SP500: S&P 500 (includes dividends)
        SMALLCAP: US Small cap (bottom decile)
        TBILL3M: 3-month T.Bill
        TBOND10Y: US T. Bond (10-year)
        BAA: Baa Corporate Bond
        REALESTATE: Real Estate
        GOLD: Gold*
      prefix: DAM_
    frequency: annual
    unit: fraction
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 60}
    vintages: none
    value_range: [-1, 10]
    scheduled_fetch: {}

  # ---- Shiller 美国股市月度数据（2026-10-24）：1871 年起，只有当前版本 ----
  # 文件约每月更新：当月价格是截至取得时的月内平均，月末后才定型；股息与盈利约滞后四个月补上；
  # 实际值每次更新都换算到最新月份的价格水平，整段历史随之改变。可用时间都是保守规则

  shiller_price:
    source_id: shiller
    upstream_id: "Robert J. Shiller: ie_data.xls，Data 工作表"
    connector: shiller_xls
    description: 标普综合指数月度价格（当月每日收盘价的平均）
    params:
      columns:
        P: {col: 1, label: P}
      prefix: SHILLER_
    frequency: monthly
    unit: index_points
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 30}
    vintages: none
    value_range: [0, 1000000]
    scheduled_fetch: {}

  shiller_fundamentals:
    source_id: shiller
    upstream_id: "Robert J. Shiller: ie_data.xls，Data 工作表"
    connector: shiller_xls
    description: 标普综合指数的股息与盈利（按指数单位计的过去 12 个月合计，约滞后四个月补上）
    params:
      columns:
        D: {col: 2, label: D}
        E: {col: 3, label: E}
      prefix: SHILLER_
    frequency: monthly
    unit: usd_per_index_unit
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 180}
    vintages: none
    value_range: [-10000, 100000]
    scheduled_fetch: {}

  shiller_cape:
    source_id: shiller
    upstream_id: "Robert J. Shiller: ie_data.xls，Data 工作表"
    connector: shiller_xls
    description: 周期调整市盈率 CAPE（价格 / 过去 10 年实际盈利平均）与总收益口径的 TR CAPE，1881 年起
    params:
      columns:
        CAPE: {col: 12, label: CAPE}
        TR_CAPE: {col: 14, label: TR CAPE}
      prefix: SHILLER_
    frequency: monthly
    unit: ratio
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 30}
    vintages: none
    value_range: [0, 200]
    scheduled_fetch: {}

  shiller_real:
    source_id: shiller
    upstream_id: "Robert J. Shiller: ie_data.xls，Data 工作表"
    connector: shiller_xls
    description: 按 CPI 换算到最新月份价格水平的实际价格与实际总收益价格指数（股息再投资）
    params:
      columns:
        REAL_PRICE: {col: 7, label: Price}
        REAL_TR_PRICE: {col: 9, label: Price}
      prefix: SHILLER_
    frequency: monthly
    unit: real_index_latest_month_usd
    currency: USD
    timezone: America/New_York
    availability: {type: period_end_lag_days, days: 30}
    vintages: none
    value_range: [0, 1000000000]
    scheduled_fetch: {}

  # ---- 跨市场比较（2026-10-24）：French 国际因子（Bloomberg 数据，美元计价，1990-07 起；新兴市场 1989-07 起） ----
  # 与美国因子文件版式相同；新兴市场五因子的部分早期月份以 -99.99 表示缺失

  french_developed3:
    source_id: ken_french
    upstream_id: "Kenneth R. French Data Library: Developed_3_Factors（月度，Bloomberg 数据）"
