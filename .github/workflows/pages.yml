# 项目网站：重新取得免费数据 → 运行研究 → 复现校验 → 归档 → 生成静态页面 → 发布到 GitHub Pages
#
# 任何必需步骤失败（测试、Treasury 取得、研究运行、复现不一致、归档推送）都不会发布，线上保留上一版页面；
# 页面上的「站点更新」时间与工作流徽章会显示更新已停滞。
# FRED 取得失败不阻断发布：研究照常运行，交叉核验显示「跳过」，其余序列显示为本次构建未取得。
#
# 运行档案保存在 archive 分支（只追加）：运行清单、结果、报告，以及允许公开再分发的数据
# （config/datasets.yaml 中 archive_data: true，目前只有 Treasury 曲线）。
name: Research site

on:
  push:
    branches: [main]
  schedule:
    # 工作日 23:30 UTC（美东傍晚 Treasury 当日数据发布之后）
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write # 推送 archive 分支
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install CJK font for Chinese figure labels
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Test
        run: uv run pytest -q

      - name: Fetch Treasury par yield curve (2024 onward)
        run: uv run iros fetch ust_par_yield_curve --start 2024

      # FRED：DGS10 用于交叉核验，其余只接入数据，显示在能力地图与资源目录上。
      # CI 中取得的数据随运行环境丢弃，不是快照积累；快照由本机 launchd 保存（scripts/snapshot-agent.sh）
      - name: Fetch scheduled datasets (FRED; failures do not block)
        continue-on-error: true
        run: uv run iros fetch --all

      - name: Run studies
        run: |
          uv run iros run config/studies/ust_curve_2024.yaml
          uv run iros run config/studies/ust_curve_last_year.yaml
          uv run iros run config/studies/ust_par_bond_rate_risk.yaml

      # 曲线变化的分解（解释与归因）：需要 FRED 的 TIPS 实际收益率、盈亏平衡通胀与联邦基金利率。
      # FRED 取得失败时这两项研究可能失败，不阻断发布；两项互不影响
      - name: Run attribution studies (FRED inputs; failures do not block)
        continue-on-error: true
        run: |
          s=0
          uv run iros run config/studies/ust_curve_attribution_last_year.yaml || s=1
          uv run iros run config/studies/ust_curve_attribution_2024.yaml || s=1
          exit $s

      # 美国主要资产的长期回报与风险（描述与比较）：需要 Damodaran 年度回报，另用 FRED CPI、French 与 Shiller 核对。
      # 这些来源取得失败时研究可能失败，不阻断发布；两项互不影响
      - name: Run asset history studies (optional sources; failures do not block)
        continue-on-error: true
        run: |
          s=0
          uv run iros run config/studies/us_asset_history.yaml || s=1
          uv run iros run config/studies/us_asset_history_last_25y.yaml || s=1
          exit $s

      - name: Verify runs reproduce from pinned inputs
        run: uv run iros verify --all

      # 只报告、不写入：日历与用途核验的延长需要人工确认（iros calendar apply --confirm）
      - name: Calendar verification report (report only)
        continue-on-error: true
        run: uv run iros calendar check --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Open archive branch
        run: |
          if git fetch --depth=1 origin archive; then
            git worktree add -B archive _archive FETCH_HEAD
          else
            git worktree add --orphan -b archive _archive
          fi

      - name: Archive new runs, then restore history for the site
        run: |
          uv run iros archive save _archive
          uv run iros archive restore _archive

      - name: Build site
        run: uv run iros site --out _site --archive _archive

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Push archive branch
        working-directory: _archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "档案没有变化"
          else
            git commit -q -m "archive: runs from ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin archive
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
